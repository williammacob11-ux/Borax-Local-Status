const DISC_TYPES = {
  cd:  {label:'CD-R 700 MB',        cap: 700*1024*1024},
  dvd: {label:'DVD-R 4.7 GB',       cap: 4700*1024*1024},
  dl:  {label:'DVD+R DL 8.5 GB',    cap: 8500*1024*1024},
  rw:  {label:'DVD-RW 4.7 GB',      cap: 4700*1024*1024, rw:true}
};
function driveNoise(kind, at){
  const ac = audioCtx();
  if(!ac || !SETTINGS.sounds) return;
  const t = ac.currentTime + (at||0);
  if(kind==='spin'){
    const o = ac.createOscillator(), g = ac.createGain(), lp = ac.createBiquadFilter();
    o.type='sawtooth'; lp.type='lowpass'; lp.frequency.value=1200;
    o.frequency.setValueAtTime(70, t);
    o.frequency.exponentialRampToValueAtTime(340, t+2.2);
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.05,t+.4);
    g.gain.exponentialRampToValueAtTime(.02,t+2.4);
    o.connect(lp); lp.connect(g); g.connect(ac.destination);
    o.start(t); o.stop(t+2.6);
  }else{
    const len = Math.floor(ac.sampleRate*0.05);
    const b = ac.createBuffer(1,len,ac.sampleRate);
    const d = b.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);
    const src = ac.createBufferSource(); src.buffer=b;
    const g = ac.createGain(); g.gain.value=.09;
    src.connect(g); g.connect(ac.destination); src.start(t);
  }
}

    R('burn').onclick=()=>{

      driveNoise('spin');
      const stages = [
        ['Preparing the file list\u2026', 700],
        ['Writing the lead-in\u2026', 1200],
        ['Writing data\u2026', 4200],
        ['Closing the session\u2026', 1100],
        ['Verifying\u2026', 1400]
      ];
      let si = 0, pct = 0, clickAt = 0;
      const t0 = Date.now();
      const totalMs = stages.reduce((n,s)=>n+s[1], 0) * (8/speed);
      const iv = setInterval(()=>{
        const el = Date.now()-t0;
        pct = Math.min(100, el/totalMs*100);
        P('bar').style.width = pct+'%';
        let acc = 0;
        for(let i=0;i<stages.length;i++){
          acc += stages[i][1]*(8/speed);
          if(el < acc){ if(si!==i){ si=i; driveNoise('click'); } break; }
        }
        P('stage').textContent = stages[Math.min(si,stages.length-1)][0];
        P('detail').textContent = fmtSize(total()*pct/100)+' of '+fmtSize(total())+
          ' written at '+speed+'x \u2014 '+Math.max(0, Math.round((totalMs-el)/1000))+' seconds left';
        const lit = Math.round(6 + Math.sin(el/220)*3);
        bufs.forEach((b,k)=>b.classList.toggle('on', k<lit));
        if(Date.now()-clickAt > 900){ clickAt = Date.now(); driveNoise('click'); }
        if(pct >= 100){
          clearInterval(iv);
          FS['D:'] = {};
          items.forEach(it=>{
            const src = FS[it.dir][it.name];
            if(src) FS['D:'][uniqueName('D:', it.name)] = JSON.parse(JSON.stringify(src));

            panel.remove();
            items = [];
            draw();
            notify('Disc Creator','\u201c'+label+'\u201d is ready. It appears as drive D: in Files.');
          }, 1800);
        }
      }, 120);
    }
    draw();
  }

      const ac = audioCtx();
      if(!ac || !SETTINGS.sounds || !DTMF[d]) return;
      const t = ac.currentTime, g = ac.createGain();
      g.gain.setValueAtTime(.0001,t); g.gain.linearRampToValueAtTime(.16,t+.01);
      g.gain.setValueAtTime(.16,t+.11); g.gain.linearRampToValueAtTime(.0001,t+.13);
      g.connect(ac.destination);
      DTMF[d].forEach(f=>{ const o=ac.createOscillator(); o.frequency.value=f; o.connect(g); o.start(t); o.stop(t+.14); });
    }
    function dial(number){
      if(!number) return notify('Phone Book','Type a number first.');
      const digits = number.replace(/[^0-9*#]/g,'');
      R('st').textContent = 'Dialling '+number+'\u2026';
      digits.split('').forEach((d,k)=>setTimeout(()=>tone(d), k*200));
      setTimeout(()=>{
        R('st').textContent = 'Dialled '+number+' \u2014 no line is connected to this computer.';
        notify('Phone Book','Dialled '+number+'. There is no line attached, so nothing is ringing.');
      }, digits.length*200 + 500);
    }
    R('new').onclick=()=>{ phoneStore().push({name:'New entry', number:'', type:'Home'}); sel=phoneStore().length-1; save(); draw(); };
    R('del').onclick=()=>{ if(phoneStore().length){ phoneStore().splice(sel,1); sel=0; save(); draw(); } };
    R('imp').onclick=()=>{

        if(c.phone && !phoneStore().some(p=>p.number===c.phone)){
          phoneStore().push({name:c.name, number:c.phone, type:c.group||'Other'});
          n++;
        }
      });
      save(); draw();
      notify('Phone Book', n? n+' number(s) brought over from the Address Book.' : 'Everything was already here.');
    };
    R('q').oninput=draw;
    draw();
  }
};

function folderSize(path){
  let n = 0;
  Object.keys(FS[path]||{}).forEach(k=>{
    const e = FS[path][k];
    if(e.type==='dir') n += folderSize(joinPath(path,k));
    else n += sizeOf(e);
  });
  return n;
}
function folderCount(path){
  let n = 0;
  Object.keys(FS[path]||{}).forEach(k=>{
    const e = FS[path][k];
    n++;
    if(e.type==='dir') n += folderCount(joinPath(path,k));
  });
  return n;
}

const DTMF = {'1':[697,1209],'2':[697,1336],'3':[697,1477],'4':[770,1209],'5':[770,1336],
  '6':[770,1477],'7':[852,1209],'8':[852,1336],'9':[852,1477],'*':[941,1209],'0':[941,1336],'#':[941,1477]};

             '<i class="'+(c?'on':'')+'"></i></div>';
    }
    function modemSound(number){
      const ac = audioCtx();
      if(!ac || !SETTINGS.sounds) return ()=>{};
      const master = ac.createGain();
      master.gain.value = .12;
      master.connect(ac.destination);
      let t = ac.currentTime;
      const tone=(f,start,dur,vol,type)=>{
        const o=ac.createOscillator(), g=ac.createGain();
        o.type=type||'sine'; o.frequency.value=f;
        g.gain.setValueAtTime(0,start); g.gain.linearRampToValueAtTime(vol||.5,start+.01);
        g.gain.setValueAtTime(vol||.5,start+dur-.01); g.gain.linearRampToValueAtTime(0,start+dur);
        o.connect(g); g.connect(master); o.start(start); o.stop(start+dur+.02);
      };
      /* dial tone */
      tone(350,t,1.1,.35); tone(440,t,1.1,.35);
      t += 1.2;
      /* the number, in DTMF */
      number.replace(/[^0-9*#]/g,'').split('').forEach(d=>{
        const pair = DTMF[d];
        if(pair){ tone(pair[0],t,.12,.5); tone(pair[1],t,.12,.5); }
        t += .18;
      });
      t += .35;
      /* ring, twice */
      for(let i=0;i<2;i++){ tone(440,t,.9,.4); tone(480,t,.9,.4); t += 1.9; }
      /* handshake: answer tone, then the carrier scramble */
      tone(2100,t,.9,.4); t += .95;
      tone(1180,t,.4,.35); tone(980,t,.4,.35); t += .45;
      const len = 3.2;
      const buf = ac.createBuffer(1, ac.sampleRate*len, ac.sampleRate);
      const d = buf.getChannelData(0);
      for(let i=0;i<d.length;i++){
        const p = i/d.length;
        d[i] = (Math.random()*2-1) * (.22 + .18*Math.sin(p*36)) *
               (1 + .6*Math.sin(i*0.02*(1+p*3)));
      }
      const src = ac.createBufferSource(); src.buffer = buf;
      const bp = ac.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1400; bp.Q.value=.7;
      src.connect(bp); bp.connect(master); src.start(t);
      for(let i=0;i<9;i++) tone(700+Math.random()*1800, t+i*.34, .3, .18, 'square');
      const end = t + len;
      return ()=>{ try{ master.gain.setTargetAtTime(0, ac.currentTime, .04); src.stop(); }catch(e){} };
    }
    function dial(){
      const num = R('num').value, isp = R('isp').value;
      stopAudio = modemSound(num);

        R('ab').onclick=()=>{ if(stopAudio) stopAudio(); form(); };
        setTimeout(step, ms);
      }

    }
    function connected(){

      w.body.innerHTML =

          '<div style="width:52px;height:52px">'+I.dialup+'</div>'+
          lights(1,1,1)+
          '<div style="font-size:15px;color:#2a7a2a">Connected at '+speed.toLocaleString()+' bps</div>'+
          '<div style="font-size:11px;color:#5b7a94" data-r="dur">Duration 00:00:00</div>'+
          '<div style="font-size:11px;color:#7b93a8">Sent 0 KB \u2014 Received 0 KB</div>'+
          '<button class="tbtn" data-r="hang" style="margin-top:10px">Disconnect</button></div>';

        hist.forEach((v,k)=>{ const x=k/(hist.length-1)*W, y=H-(v/100)*H; k?cx.lineTo(x,y):cx.moveTo(x,y); });
        cx.strokeStyle='hsl('+hue+' 90% 60%)'; cx.lineWidth=1.8; cx.stroke();
        cx.lineTo(W,H); cx.lineTo(0,H); cx.closePath();
        cx.fillStyle='hsla('+hue+',90%,50%,.22)'; cx.fill();
      };
      function loop(){
        if(tab!=='perf' || !w.body.querySelector('[data-r=c1]')) return;
        cpuHist.push(Math.max(2, Math.min(99, cpuHist[cpuHist.length-1] + (Math.random()-.48)*9 + Object.keys(WINS).length*0.3)));
        cpuHist.shift();
        memHist.push(Math.max(20, Math.min(95, memHist[memHist.length-1] + (Math.random()-.5)*2.2 + Object.keys(WINS).length*0.15)));
        memHist.shift();
        paint(R('c1'), cpuHist, 120); paint(R('c2'), memHist, 190);
        R('cpuv').textContent = Math.round(cpuHist[cpuHist.length-1])+'%';
        R('memv').textContent = Math.round(memHist[memHist.length-1]*10.24)+' MB';
        R('st').textContent = 'CPU usage: '+Math.round(cpuHist[cpuHist.length-1])+'%   Commit charge: '+
          Math.round(memHist[memHist.length-1]*10.24)+' MB / 1024 MB';
        raf = setTimeout(loop, 900);
      }
      loop();
    }
    const views = {apps, proc, perf};
    w.body.querySelectorAll('[data-t]').forEach(t=>t.onclick=()=>{
      tab = t.dataset.t;
      w.body.querySelectorAll('.tm-tab').forEach(x=>x.classList.toggle('on', x===t));
      clearTimeout(raf);
      views[tab]();
    });
    apps();
    const iv = setInterval(()=>{ if(tab==='apps') apps(); }, 2500);
    w.onClose = ()=>{ clearInterval(iv); clearTimeout(raf); };
  }
};

    function floodFill(x,y,hex){
      const img = cx.getImageData(0,0,cv.width,cv.height), d = img.data, W = cv.width, H = cv.height;
      x=Math.round(x); y=Math.round(y);
      const at = (a,b)=>((b*W+a)*4);
      const t = at(x,y), tc = [d[t],d[t+1],d[t+2],d[t+3]];
      const rgb = [parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16),255];
      if(tc.every((v,i)=>Math.abs(v-rgb[i])<8)) return;
      const near = i => Math.abs(d[i]-tc[0])<24 && Math.abs(d[i+1]-tc[1])<24 && Math.abs(d[i+2]-tc[2])<24 && Math.abs(d[i+3]-tc[3])<24;
      const st = [[x,y]];
      while(st.length){
        const [a,b] = st.pop();
        if(a<0||b<0||a>=W||b>=H) continue;
        const i = at(a,b);
        if(!near(i)) continue;
        d[i]=rgb[0]; d[i+1]=rgb[1]; d[i+2]=rgb[2]; d[i+3]=255;
        st.push([a+1,b],[a-1,b],[a,b+1],[a,b-1]);
      }
      cx.putImageData(img,0,0);
    }
    cv.addEventListener('pointerdown', e=>{
      cv.setPointerCapture(e.pointerId);
      const [x,y] = pos(e);
      push();
      if(tool==='fill'){ floodFill(x,y,color); return; }
      drawing = true; sx=x; sy=y;
      snap = (tool==='line'||tool==='rect'||tool==='ellipse') ? cx.getImageData(0,0,cv.width,cv.height) : null;
      cx.lineCap='round'; cx.lineJoin='round';
      cx.beginPath(); cx.moveTo(x,y);
    });
    cv.addEventListener('pointermove', e=>{
      if(!drawing) return;
      const [x,y] = pos(e);
      cx.strokeStyle = tool==='eraser' ? '#ffffff' : color;
      cx.lineWidth = tool==='marker' ? size*2.2 : size;
      cx.globalAlpha = tool==='marker' ? .55 : 1;
      if(snap){
        cx.putImageData(snap,0,0);
        cx.beginPath();
        if(tool==='line'){ cx.moveTo(sx,sy); cx.lineTo(x,y); }
        else if(tool==='rect'){ cx.rect(sx,sy,x-sx,y-sy); }
        else { cx.ellipse((sx+x)/2,(sy+y)/2,Math.abs(x-sx)/2,Math.abs(y-sy)/2,0,0,6.284); }
        cx.stroke();
      }else{
        cx.lineTo(x,y); cx.stroke();
      }
      cx.globalAlpha = 1;
    });
    const stop = ()=>{ drawing=false; snap=null; };
    cv.addEventListener('pointerup', stop);
    cv.addEventListener('pointerleave', stop);

    /* ---------------- games ---------------- */
    let timer = null;
    function clearHud(){
      if(timer) clearInterval(timer);
      timer = null;
      R('stage').querySelectorAll('.sk-hud,.sk-guess').forEach(n=>n.remove());
    }
    R('mPad').onclick=()=>{ clearHud(); R('score').textContent=''; R('st').textContent='Drawing pad \u2014 pick a tool and draw'; };

    /* Draw it: five prompts against the clock, then a gallery */
    R('mDraw').onclick=()=>{
      clearHud();
      const words = SK_WORDS.slice().sort(()=>Math.random()-.5).slice(0,5);
      const shots = [];
      let round = 0;
      const hud = document.createElement('div');
      hud.className = 'sk-hud';
      R('stage').appendChild(hud);
      function nextRound(){
        if(round>0) shots.push(cv.toDataURL('image/png'));
        if(round>=words.length){ finish(); return; }
        push(); white();
        let left = 45;
        hud.innerHTML = '<span>Round '+(round+1)+' of '+words.length+'</span>'+
          '<span class="word">Draw: '+words[round]+'</span>'+
          '<button class="tbtn" data-skip>Done</button><span class="timer">0:45</span>';
        hud.querySelector('[data-skip]').onclick=()=>{ round++; nextRound(); };
        if(timer) clearInterval(timer);
        timer = setInterval(()=>{
          left--;
          const t = hud.querySelector('.timer');
          t.textContent = '0:'+String(Math.max(0,left)).padStart(2,'0');
          t.classList.toggle('low', left<=10);
          if(left<=5 && left>0) 
          if(left<=0){ clearInterval(timer); round++; nextRound(); }
        },1000);
        R('st').textContent = 'Draw it \u2014 you have 45 seconds a word';
      }
      function finish(){
        clearHud();
        const g = document.createElement('div');
        g.className='sk-guess';
        g.innerHTML = '<h3>Nice work</h3><div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center">'+
          shots.map((src,k)=>'<div style="text-align:center"><img src="'+src+'" style="width:120px;border:3px solid #fff">'+
            '<div style="font-size:11px;margin-top:3px">'+esc(words[k]||'')+'</div></div>').join('')+'</div>'+
          '<div style="display:flex;gap:8px"><button class="tbtn" data-again>Play again</button>'+
          '<button class="tbtn" data-close>Back to the pad</button></div>';
        R('stage').appendChild(g);
        g.querySelector('[data-again]').onclick=()=>R('mDraw').onclick();
        g.querySelector('[data-close]').onclick=()=>{ clearHud(); white(); };
      }
      nextRound();
    };

    /* Guess the doodle: the machine draws, you pick the answer */
    R('mGuess').onclick=()=>{
      clearHud();
      const names = Object.keys(DOODLES).sort(()=>Math.random()-.5).slice(0,6);
      let round = 0, score = 0;
      const hud = document.createElement('div');
      hud.className='sk-hud';
      R('stage').appendChild(hud);
      function ask(){
        if(round>=names.length){ over(); return; }
        white();
        const answer = names[round];
        const strokes = DOODLES[answer];
        const opts = [answer].concat(Object.keys(DOODLES).filter(n=>n!==answer).sort(()=>Math.random()-.5).slice(0,3)).sort(()=>Math.random()-.5);
        let left = 20, guessed = false;
        hud.innerHTML = '<span>Doodle '+(round+1)+' of '+names.length+'</span>'+
          '<span class="word">What is it?</span><span class="timer">0:20</span>';
        R('score').textContent = 'Score '+score+' / '+(round*10);
        const panel = document.createElement('div');
        panel.className='sk-guess';
        panel.style.cssText='background:none;justify-content:flex-end;padding-bottom:14px';
        panel.innerHTML = '<div class="sk-opts">'+opts.map(o=>
          '<button class="tbtn" data-o="'+esc(o)+'">'+esc(o)+'</button>').join('')+'</div>';
        R('stage').appendChild(panel);
        /* draw it stroke by stroke */
        let si = 0, pi = 1, speed = 0;
        cx.strokeStyle='#123'; cx.lineWidth=4; cx.lineCap='round'; cx.lineJoin='round';
        const S = Math.min(cv.width, cv.height)*0.86, ox=(cv.width-S)/2, oy=(cv.height-S)/2;
        const P = (pt)=>[ox+pt[0]*S, oy+pt[1]*S];
        const drawStep = ()=>{
          if(si>=strokes.length) return;
          const st = strokes[si];
          if(pi<st.length){
            cx.beginPath();
            const a = P(st[pi-1]), b = P(st[pi]);
            cx.moveTo(a[0],a[1]); cx.lineTo(b[0],b[1]); cx.stroke();
            pi++;
          }else{ si++; pi=1; }
        };
        if(timer) clearInterval(timer);
        timer = setInterval(()=>{
          speed++;
          if(speed%2===0) drawStep();
          if(speed%10===0){
            left--;
            const t = hud.querySelector('.timer');
            if(t){ t.textContent='0:'+String(Math.max(0,left)).padStart(2,'0'); t.classList.toggle('low', left<=6); }
            if(left<=0 && !guessed){ answered(null); }
          }
        }, 100);
        function answered(pick){
          if(guessed) return;
          guessed = true;
          clearInterval(timer);
          while(si<strokes.length){ drawStep(); }
          const right = pick===answer;
          if(right){ score += Math.max(4, left); } else beep('error');
          panel.innerHTML = '<h3>'+(right? 'Correct \u2014 it is a '+answer : (pick? 'Not quite. It was a '+answer : 'Time. It was a '+answer))+'</h3>'+
            '<div class="sk-score">Score '+score+'</div><button class="tbtn" data-next>Next doodle</button>';
          panel.style.background='rgba(6,18,30,.86)';
          panel.style.justifyContent='center';
          panel.querySelector('[data-next]').onclick=()=>{ panel.remove(); round++; ask(); };
        }
        panel.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>answered(b.dataset.o));
      }
      function over(){
        clearHud();
        const g = document.createElement('div');
        g.className='sk-guess';
        const best = Math.max(score, (CURRENT&&CURRENT.sketchBest)||0);
        if(CURRENT){ CURRENT.sketchBest = best; saveProfiles(); }
        g.innerHTML = '<h3>Final score: '+score+'</h3>'+
          '<div class="sk-score">Best on this account: '+best+'</div>'+
          '<div style="display:flex;gap:8px"><button class="tbtn" data-again>Play again</button>'+
          '<button class="tbtn" data-close>Back to the pad</button></div>';
        R('stage').appendChild(g);
        g.querySelector('[data-again]').onclick=()=>R('mGuess').onclick();
        g.querySelector('[data-close]').onclick=()=>{ clearHud(); white(); R('score').textContent=''; };
      }
      R('st').textContent = 'Guess the doodle \u2014 answer before the drawing finishes for more points';
      ask();
    };
    w.onClose = ()=>{ if(timer) clearInterval(timer); };
  }
};

function autoPos(k){ return {x:14 + Math.floor(k/5)*90, y:14 + (k%5)*88}; }
function renderDesktop(){
  const t = FS[DESKTOP] || {};
  const names = Object.keys(t);
  iconsEl.innerHTML = names.map((n,k)=>{
    const e = t[n];
    if(!e.pos) e.pos = autoPos(k);
    const ic = deskIcon(n,e);
    return '<div class="dicon" data-n="'+esc(n)+'" style="left:'+e.pos.x+'px;top:'+e.pos.y+'px">'+
      (ic || '<img src="'+e.data+'" style="width:44px;height:44px;object-fit:cover;border:2px solid #fff">')+
      '<span>'+esc(n.replace(/\.(txt|png|sheet|slides|jpg)$/,''))+'</span></div>';
  }).join('');
  iconsEl.querySelectorAll('.dicon').forEach(el=>{
    const name = el.dataset.n, e = t[name];
    el.onclick = ev=>{ ev.stopPropagation(); selectDesk(name); };
    el.ondblclick = ()=>openDesk(name, e);
    el.oncontextmenu = ev=>{
      ev.preventDefault(); ev.stopPropagation();
      selectDesk(name);
      const items = [{label:'Open', run:()=>openDesk(name,e)}];
      if(e.type==='sys' && e.kind==='recycle'){
        items.push({label:'Empty the Recycle Bin', run:()=>{
          const c = binCount();
          Object.keys(FS[RECYCLE]||{}).forEach(x=>removeEntry(RECYCLE,x));
          persistDesk(); notify('Recycle Bin', c? c+' item(s) deleted for good.' : 'It was already empty.');
        }});
      }
      if(e.type!=='sys'){
        items.push('-',
          {label:'Rename\u2026', run:()=>renameDesk(name)},
          {label:'Delete', run:()=>{ recycle(DESKTOP, name); persistDesk(); }});
      }
      items.push('-', {label:'Properties', run:()=>notify(name, typeName(e)+(e.type==='dir'||e.type==='sys'?'':' \u2014 '+fmtSize(sizeOf(e))))});
      ctx(ev.clientX, ev.clientY, items);
    };
    /* drag to reposition */
    el.addEventListener('pointerdown', ev=>{
      if(ev.button!==0) return;
      const r = el.getBoundingClientRect(), dr = iconsEl.getBoundingClientRect();
      const ox = ev.clientX - r.left, oy = ev.clientY - r.top;
      let moved = false;
      el.setPointerCapture(ev.pointerId);
      const move = m=>{
        if(!moved && Math.abs(m.clientX-ev.clientX)+Math.abs(m.clientY-ev.clientY) < 4) return;
        moved = true; el.classList.add('dragging');
        el.style.left = Math.max(0, Math.min(dr.width-86, m.clientX-dr.left-ox))+'px';
        el.style.top  = Math.max(0, Math.min(dr.height-90, m.clientY-dr.top-oy))+'px';
      };
      const up = ()=>{
        el.removeEventListener('pointermove',move); el.removeEventListener('pointerup',up);
        if(moved){
          el.classList.remove('dragging');
          e.pos = {x:parseInt(el.style.left,10), y:parseInt(el.style.top,10)};
          if(CURRENT){ CURRENT.tree = userTree(); saveProfiles(); }
        }
      };
      el.addEventListener('pointermove',move); el.addEventListener('pointerup',up);
    });
  });
  selectDesk(deskSel);
}

  deskSel = n;

function spotlight(q){
  const n = q.trim().toLowerCase();
  if(!n) return null;
  const groups = [];
  const progs = PROGRAMS.filter(p=>p.label.toLowerCase().includes(n))
    .map(p=>({icon:p.icon, label:p.label, sub:'Program', run:()=>openApp(p.app, p.arg)}));
  if(progs.length) groups.push(['Programs', progs.slice(0,6)]);

  const sets = CP_PAGES.filter(p=>p[1].toLowerCase().includes(n))
    .map(p=>({icon:'settings', label:p[1], sub:'Control Panel', run:()=>openApp('settings', p[0])}));
  if(sets.length) groups.push(['Settings', sets.slice(0,6)]);

  if(SETTINGS.searchFiles){
    const hits = [];
    ['C:'].forEach(root=>searchFS(root, n).forEach(h=>hits.push(h)));
    const files = hits.slice(0,8).map(h=>({
      icon: fileIcon(FS[h.dir][h.name]),
      label: h.name, sub: h.dir,
      run:()=> FS[h.dir][h.name].type==='dir' ? openApp('files', joinPath(h.dir,h.name)) : openFile(h.dir, h.name)
    }));
    if(files.length) groups.push(['Files and folders', files]);
  }
  const people = (typeof MM_CONTACTS!=='undefined' ? MM_CONTACTS : [])
    .filter(c=>c.n.toLowerCase().includes(n))
    .map(c=>({icon:'msg', label:c.n, sub:'Contact', run:()=>{ openApp('msg'); openChat(c); }}));
  const book = ((CURRENT && CURRENT.book) || []).filter(c=>(c.name||'').toLowerCase().includes(n))
    .map(c=>({icon:'user', label:c.name, sub:'Address Book', run:()=>openApp('book')}));
  const all = people.concat(book);
  if(all.length) groups.push(['People', all.slice(0,6)]);

  groups.push(['Web', [
    {icon:'browser', label:'Search the web for \u201c'+q.trim()+'\u201d', sub:'Meridian Browser',
     run:()=>openApp('browser','search:'+q.trim())}
  ]]);
  return groups;
}

function makeShot(w, boxW, boxH){
  const src = w.el.querySelector('.wbody');
  const r = src.getBoundingClientRect();
  if(!r.width) return null;
  const clone = src.cloneNode(true);
  /* a cloned canvas comes back blank, so copy the pixels across */
  const from = src.querySelectorAll('canvas'), to = clone.querySelectorAll('canvas');
  to.forEach((c,k)=>{
    try{
      const o = from[k];
      c.width = o.width; c.height = o.height;
      c.getContext('2d').drawImage(o, 0, 0);
    }catch(e){}
  });
  clone.querySelectorAll('video').forEach(v=>v.remove());
  const scale = Math.min(boxW/r.width, boxH/r.height);
  const wrap = document.createElement('div');
  wrap.style.width = r.width+'px';
  wrap.style.height = r.height+'px';
  wrap.style.transform = 'scale('+scale+')';
  clone.style.width = r.width+'px';
  clone.style.height = r.height+'px';
  wrap.appendChild(clone);

/* the switcher */
let flipOpen = false, flipIdx = 0, flipList = [];
function flipShow(step){
  const el = document.getElementById('flip'), rail = document.getElementById('flipRail');
  if(!flipOpen){
    flipList = Object.values(WINS).sort((a,b)=>(b.el.style.zIndex|0)-(a.el.style.zIndex|0));
    if(flipList.length < 2 && !flipList.length) return;
    flipIdx = flipList.length>1 ? 1 : 0;
    flipOpen = true;
    el.classList.add('on');
    rail.innerHTML = flipList.map((w,k)=>
      '<div class="fcard'+(k===flipIdx?' on':'')+'" data-k="'+k+'">'+
      '<div class="shot" data-shot="'+k+'"></div>'+
      '<div class="cap">'+I[APPS[w.app].icon]+'<span>'+esc(w.titleEl.textContent)+'</span></div></div>').join('');
    flipList.forEach((w,k)=>{
      const box = rail.querySelector('[data-shot="'+k+'"]');
      const shot = makeShot(w, 178, 118);
      if(shot) box.appendChild(shot);
    });
    rail.querySelectorAll('[data-k]').forEach(c=>{
      c.onclick = ()=>{ flipIdx = +c.dataset.k; flipCommit(); };
    });
  }else if(step){
    flipIdx = (flipIdx + step + flipList.length) % flipList.length;
    rail.querySelectorAll('.fcard').forEach((c,k)=>c.classList.toggle('on', k===flipIdx));
  }
}
function flipCommit(){
  const w = flipList[flipIdx];
  flipClose();
  if(w) restore(w);
}
function flipClose(){
  flipOpen = false;
  document.getElementById('flip').classList.remove('on');
  document.getElementById('flipRail').innerHTML = '';
}
document.addEventListener('keydown', e=>{
  if(e.key === 'Tab' && (e.altKey || (e.ctrlKey && e.shiftKey))){
    e.preventDefault();
    flipShow(flipOpen ? (e.shiftKey ? -1 : 1) : 0);
  }else if(e.altKey && e.key === '`'){
    e.preventDefault();
    flipShow(flipOpen ? 1 : 0);
  }else if(flipOpen){
    if(e.key === 'ArrowRight'){ e.preventDefault(); flipShow(1); }
    else if(e.key === 'ArrowLeft'){ e.preventDefault(); flipShow(-1); }
    else if(e.key === 'Enter'){ e.preventDefault(); flipCommit(); }
    else if(e.key === 'Escape'){ e.preventDefault(); flipClose(); }
  }
});
document.addEventListener('keyup', e=>{ if(flipOpen && e.key === 'Alt') flipCommit(); });
document.getElementById('flip').addEventListener('click', e=>{ if(e.target.id==='flip') flipClose(); });

/* ---- taskbar clock flyout: analog face, calendar, options ---- */
const flyout = document.getElementById('flyout');
function drawFlyout(){
  const d = new Date();
  const first = new Date(d.getFullYear(), d.getMonth(), 1);
  const days = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
  const prev = new Date(d.getFullYear(), d.getMonth(), 0).getDate();
  let cells = '';
  for(let i=0;i<first.getDay();i++) cells += '<span class="dim">'+(prev-first.getDay()+i+1)+'</span>';
  for(let i=1;i<=days;i++) cells += '<span'+(i===d.getDate()?' class="today"':'')+'>'+i+'</span>';
  const trailing = (7 - ((first.getDay()+days) % 7)) % 7;
  for(let i=1;i<=trailing;i++) cells += '<span class="dim">'+i+'</span>';
  document.getElementById('flyInner').innerHTML =
    analogFace(112)+
    '<div class="digi">'+d.toLocaleTimeString([], SETTINGS.clock24?{hour12:false}:{})+'</div>'+
    '<div class="dstr">'+d.toLocaleDateString([], {weekday:'long', month:'long', day:'numeric', year:'numeric'})+'</div>'+
    '<hr><div style="text-align:center;font-size:11px;color:#3a6a99;margin-bottom:4px">'+
      d.toLocaleDateString([], {month:'long', year:'numeric'})+'</div>'+
    '<div class="cal"><b>S</b><b>M</b><b>T</b><b>W</b><b>T</b><b>F</b><b>S</b>'+cells+'</div>'+
    '<hr>'+
    '<label class="opt"><input type="checkbox" id="fly24"'+(SETTINGS.clock24?' checked':'')+'> 24-hour clock</label>'+
    '<label class="opt"><input type="checkbox" id="flySec"'+(SETTINGS.showSec?' checked':'')+'> Show seconds</label>'+
    '<label class="opt"><input type="checkbox" id="flyDate"'+(SETTINGS.showDate?' checked':'')+'> Show the date</label>'+
    '<hr><div class="rlink" id="flyCP">Adjust date and time\u2026</div>'+
    '<div class="rlink" id="flyTZ">Time zone: Central Time (GMT-06:00)</div>';
  document.getElementById('fly24').onchange=e=>{SETTINGS.clock24=e.target.checked;applySettings();drawFlyout()};
  document.getElementById('flySec').onchange=e=>{SETTINGS.showSec=e.target.checked;applySettings();drawFlyout()};
  document.getElementById('flyDate').onchange=e=>{SETTINGS.showDate=e.target.checked;applySettings();drawFlyout()};
  document.getElementById('flyCP').onclick=()=>{ toggleFly(false); openApp('settings','clock'); };
  document.getElementById('flyTZ').onclick=()=>notify('Date and Time','This computer is set to Central Time.');
}
let flyTimer = null;
function toggleFly(on){
  const open = on===undefined ? !flyout.classList.contains('on') : on;
  flyout.classList.toggle('on', open);
  clearInterval(flyTimer);
  if(open){ drawFlyout(); flyTimer = setInterval(drawFlyout, 1000); }
}

    stash();
    if(steps[step]==='account' && !draft.name){
      notify('Setup','Please type a name for the account.');
      return;
    }
    step = Math.min(steps.length-1, step+1);
    render();
  };
  document.getElementById('oobeBack').onclick = ()=>{ stash(); step = Math.max(0, step-1); render(); };
  function commit(){
    el.classList.remove('on');
    PROFILES = PROFILES.filter(p=>p.seeded !== true);
    const p = makeProfile(draft.name || 'User', draft.hue);
    Object.assign(p.settings, {
      wall:draft.wall, hue:draft.accent, sounds:draft.sounds, anim:draft.anim,
      trails:draft.trails, clock24:draft.clock24, saver:draft.saver
    });
    saveProfiles();
    store.set('setupDone', true);
    showLoader('Preparing LaptopOS', [
      'Creating your account', 'Copying your documents', 'Applying your settings',
      'Registering programs', 'Almost there'
    ], ()=>{ drawTiles(); document.getElementById('lock').style.display='flex'; });
  }
  render();
}

/* =======================================================================
   STARTUP ANIMATION
   ======================================================================= */
(function boot(){
  document.getElementById('bootOrb').innerHTML = ORB;
  const fw = document.getElementById('fw');
  const lines = ['MERIDIAN MOBILE FIRMWARE 2.14','CRYSTAL MOBILE 1.86 GHz  \u2022  1024 MB OK',
                 'ATA-0  HITACHI 60GB   ATAPI-1  DVD-ROM','BOOTING FROM HARD DISK \u2026'];
  lines.forEach((l,k)=>{
    const sp=document.createElement('span'); sp.textContent=l;
    sp.style.animationDelay=(k*260)+'ms'; fw.appendChild(sp);
  });
  const txt = document.getElementById('bootText');
  const steps = ['Checking hardware','Loading Crystal compositor','Starting services','Preparing to log on'];
  let s = 0, iv;
  function tick(){
    if(s>=steps.length){ clearInterval(iv); finish(); return; }
    txt.textContent = steps[s++];
  }
  function finish(){
    const boot = document.getElementById('boot');
    boot.style.transition='opacity .55s'; boot.style.opacity='0';
    setTimeout(()=>{
      boot.style.display='none';
      if(!store.get('setupDone', false)) runSetup();
      else { drawTiles(); lockEl.style.display='flex'; }
    }, 560);
  }
  setTimeout(()=>{ iv = setInterval(tick, 760); tick(); }, 1150);
  document.getElementById('boot').onclick = ()=>{ clearInterval(iv); finish(); };
})();
</script>
