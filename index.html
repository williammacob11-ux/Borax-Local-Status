<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LaptopOS 1.6 &mdash; Crystal</title>
<style>
/* ============================================================
   LaptopOS 1.6 "Crystal"  (c) 2007 Meridian Systems
   Single-file desktop environment
   ============================================================ */

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{
  font-family:"Segoe UI","Trebuchet MS",Tahoma,Verdana,Geneva,sans-serif;
  font-size:12px;color:#0b1a2b;user-select:none;
  background:#0a1c33;
}
:root{
  --accent-h:206;
  --accent:hsl(var(--accent-h) 78% 46%);
  --accent-dk:hsl(var(--accent-h) 82% 28%);
  --accent-lt:hsl(var(--accent-h) 84% 72%);
  --glass:.62;
  --blur:14px;
  --radius:8px;
  --av-h:40;
}

/* ---------- glossy chrome mixins ---------- */
.glass{
  background:
    linear-gradient(180deg,
      hsla(var(--accent-h),70%,88%,calc(var(--glass) * .95)) 0%,
      hsla(var(--accent-h),60%,74%,calc(var(--glass) * .78)) 42%,
      hsla(var(--accent-h),55%,62%,calc(var(--glass) * .68)) 43%,
      hsla(var(--accent-h),60%,76%,calc(var(--glass) * .82)) 100%);
  -webkit-backdrop-filter:blur(var(--blur)) saturate(150%);
  backdrop-filter:blur(var(--blur)) saturate(150%);
}

/* ============================ DESKTOP ============================ */
#desktop{
  position:absolute;inset:0;
  background-size:cover;background-position:center;
  transition:background-image .4s;
}
.wp-meadow{background:
  radial-gradient(120% 80% at 50% 120%, #5aa32c 0%, #3f8a21 32%, transparent 33%),
  radial-gradient(100% 60% at 20% 118%, #78bf3e 0%, transparent 40%),
  linear-gradient(180deg,#1a4f8f 0%,#3f8fd8 38%,#93ccef 62%,#cfe9f8 74%,#7fb648 74.5%,#3f8a21 100%);}
.wp-aurora{background:
  radial-gradient(80% 50% at 30% 20%, rgba(0,255,200,.35), transparent 60%),
  radial-gradient(70% 60% at 75% 35%, rgba(120,60,255,.4), transparent 62%),
  linear-gradient(180deg,#02040f 0%,#0a1230 45%,#123 100%);}
.wp-crystal{background:
  radial-gradient(60% 60% at 50% 45%, rgba(255,255,255,.55), transparent 62%),
  conic-gradient(from 210deg at 50% 45%, #0e4f8f,#1f8fd0,#69d0f2,#1f8fd0,#0e4f8f);}
.wp-sunset{background:linear-gradient(180deg,#1b1040 0%,#5c2a6e 30%,#c95b3e 62%,#f2a94b 80%,#2a1a12 100%);}
.wp-workday{background:linear-gradient(150deg,#243b55 0%,#3e5a7c 45%,#8fa9c4 100%);}
/* --- 1.3 wallpaper set --- */
.wp-silk{background:
  radial-gradient(120% 90% at 15% 10%, rgba(255,255,255,.5), transparent 45%),
  conic-gradient(from 140deg at 65% 40%, #0b3f77, #1c7fc4, #6fd2f5, #1c7fc4, #0b3f77),
  linear-gradient(180deg,#061d3a,#0d3f6e);}
.wp-ribbon{background:
  radial-gradient(80% 55% at 20% 85%, rgba(120,220,255,.55), transparent 60%),
  radial-gradient(70% 45% at 80% 25%, rgba(60,140,240,.6), transparent 62%),
  conic-gradient(from 30deg at 50% 60%, #04203f, #0a58a0, #1188d6, #0a58a0, #04203f);}
.wp-tulips{background:
  radial-gradient(circle at 12% 88%, #d94a5c 0 10px, transparent 11px),
  radial-gradient(circle at 30% 92%, #f2c53d 0 9px, transparent 10px),
  radial-gradient(circle at 48% 86%, #e2554a 0 11px, transparent 12px),
  radial-gradient(circle at 66% 93%, #f0873a 0 9px, transparent 10px),
  radial-gradient(circle at 84% 87%, #d94a8c 0 10px, transparent 11px),
  radial-gradient(circle at 22% 79%, #e8604f 0 7px, transparent 8px),
  radial-gradient(circle at 58% 78%, #f2b13d 0 7px, transparent 8px),
  linear-gradient(180deg,#8fd0f0 0%,#cfe9f8 42%,#7fb648 52%,#3f8a21 100%);}
.wp-waterdrop{background:
  radial-gradient(30% 22% at 62% 38%, rgba(255,255,255,.9), rgba(255,255,255,.15) 55%, transparent 70%),
  radial-gradient(60% 45% at 40% 60%, rgba(80,220,255,.45), transparent 65%),
  linear-gradient(160deg,#062a3a,#0f5d70 45%,#1d8f9c 70%,#073042);}
.wp-nightfall{background:
  repeating-linear-gradient(90deg, rgba(255,220,150,.85) 0 2px, transparent 2px 9px) 0 76%/100% 3% no-repeat,
  linear-gradient(180deg,#0a1330 0%,#26305e 38%,#7a4a72 58%,#d98a52 70%,#101426 71%,#05070f 100%);}
.wp-autumn{background:
  radial-gradient(45% 35% at 22% 30%, rgba(255,180,60,.55), transparent 62%),
  radial-gradient(50% 40% at 78% 62%, rgba(190,60,30,.55), transparent 65%),
  linear-gradient(150deg,#3a1a08,#8a3d12 40%,#d97a25 70%,#4a2109);}
.wp-bloom{background:
  radial-gradient(35% 30% at 50% 45%, rgba(255,255,255,.75), transparent 60%),
  radial-gradient(60% 50% at 30% 70%, rgba(190,90,255,.6), transparent 65%),
  radial-gradient(55% 45% at 75% 30%, rgba(90,140,255,.55), transparent 65%),
  linear-gradient(180deg,#150a2e,#3b1a63 60%,#160b2c);}
.wp-harbor{background:
  repeating-linear-gradient(180deg, rgba(255,255,255,.16) 0 1px, transparent 1px 7px) 0 62%/100% 38% no-repeat,
  linear-gradient(180deg,#f7c98a 0%,#e9964f 18%,#a85b52 34%,#2f4a72 36%,#12304f 100%);}
.wp-lagoon{background:
  radial-gradient(50% 30% at 30% 20%, rgba(255,255,255,.45), transparent 60%),
  radial-gradient(40% 25% at 70% 55%, rgba(160,255,235,.4), transparent 62%),
  linear-gradient(180deg,#0a4f5e,#12a09b 45%,#5fd9c0 68%,#0b3f4c);}


#desktop::after{ /* subtle vignette, very 2006 */
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 100% at 50% 40%,transparent 55%,rgba(0,0,0,.35) 100%);
}

/* ---------- desktop icons ---------- */
#icons{position:absolute;top:14px;left:14px;width:96px;z-index:2}
.dicon{
  width:84px;padding:6px 2px 8px;margin-bottom:6px;border-radius:4px;
  text-align:center;cursor:default;
}
.dicon svg{width:44px;height:44px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.5))}
.dicon span{
  display:block;margin-top:3px;color:#fff;font-size:11px;line-height:1.25;
  text-shadow:0 1px 2px rgba(0,0,0,.9),0 0 6px rgba(0,0,0,.6);
  word-break:break-word;
}
.dicon:hover{background:rgba(255,255,255,.18);outline:1px solid rgba(255,255,255,.35)}
.dicon.sel{background:hsla(var(--accent-h),80%,60%,.45);outline:1px solid rgba(255,255,255,.7)}

/* ============================ WINDOWS ============================ */
.win{
  position:absolute;min-width:280px;min-height:170px;
  border-radius:var(--radius) var(--radius) 4px 4px;
  padding:1px 5px 5px;
  box-shadow:0 14px 40px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.5) inset,
             0 0 0 1px rgba(0,0,0,.35);
  display:flex;flex-direction:column;
  animation:winIn .16s ease-out;
}
@keyframes winIn{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:none}}
.win.min{display:none}
.win.max{border-radius:0;padding:1px 0 0}
.titlebar{
  height:29px;flex:0 0 29px;display:flex;align-items:center;gap:6px;
  padding:0 4px 0 7px;cursor:default;position:relative;overflow:hidden;
  border-radius:6px 6px 0 0;
}
.titlebar::before{ /* specular gloss sweep */
  content:"";position:absolute;left:0;right:0;top:0;height:14px;
  background:linear-gradient(180deg,rgba(255,255,255,.75),rgba(255,255,255,.05));
  border-radius:6px 6px 60% 60%/6px 6px 100% 100%;pointer-events:none;
}
.titlebar svg{width:16px;height:16px;position:relative;z-index:1}
.tt{
  flex:1;font-weight:700;font-size:12px;color:#0d2237;position:relative;z-index:1;
  text-shadow:0 1px 0 rgba(255,255,255,.85);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.win:not(.focused) .tt{color:#425a70;font-weight:400}
.win:not(.focused){box-shadow:0 8px 24px rgba(0,0,0,.4),0 0 0 1px rgba(255,255,255,.3) inset}
.wbtns{display:flex;gap:2px;position:relative;z-index:1}
.wbtn{
  width:26px;height:19px;border:1px solid rgba(255,255,255,.65);border-radius:3px;
  background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(255,255,255,.25) 48%,rgba(255,255,255,.05) 52%,rgba(255,255,255,.35));
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  box-shadow:0 1px 2px rgba(0,0,0,.25);
}
.wbtn:hover{background:linear-gradient(180deg,#fff,rgba(255,255,255,.6) 48%,rgba(255,255,255,.3) 52%,rgba(255,255,255,.6))}
.wbtn:active{transform:translateY(1px)}
.wbtn.x{width:44px;background:linear-gradient(180deg,#f7b5ae,#e2554a 48%,#c02a1e 52%,#e8776c)}
.wbtn.x:hover{background:linear-gradient(180deg,#ffd6d1,#f2665a 48%,#d43323 52%,#f5897d)}
.wbtn i{display:block;width:9px;height:9px;position:relative}
.wbtn i::before,.wbtn i::after{content:"";position:absolute;background:#12304a}
.wbtn.min i::before{left:0;right:0;bottom:0;height:2px}
.wbtn.mx i::before{inset:0;border:2px solid #12304a;background:none}
.wbtn.x i{width:10px;height:10px}
.wbtn.x i::before,.wbtn.x i::after{
  left:0;right:0;top:4px;height:2px;background:#fff;box-shadow:0 1px 0 rgba(0,0,0,.35)}
.wbtn.x i::before{transform:rotate(45deg)}
.wbtn.x i::after{transform:rotate(-45deg)}
.wbody{
  flex:1;background:#fff;border:1px solid rgba(255,255,255,.6);
  border-radius:0 0 3px 3px;overflow:hidden;display:flex;flex-direction:column;
  box-shadow:0 0 0 1px rgba(0,0,0,.3);
}
.grip{position:absolute;right:2px;bottom:2px;width:16px;height:16px;cursor:nwse-resize;z-index:3}
.grip::after{content:"";position:absolute;right:3px;bottom:3px;width:9px;height:9px;
  background:repeating-linear-gradient(135deg,rgba(255,255,255,.9) 0 2px,transparent 2px 4px)}
.win.max .grip{display:none}

/* ---------- generic app furniture ---------- */
.menubar{
  display:flex;gap:2px;padding:2px 4px;font-size:12px;
  background:linear-gradient(180deg,#fdfeff,#e8f0f8);border-bottom:1px solid #b8cadb;flex:0 0 auto}
.menubar b{font-weight:400;padding:2px 8px;border-radius:3px;cursor:default}
.menubar b:hover{background:hsla(var(--accent-h),80%,60%,.25);outline:1px solid hsla(var(--accent-h),60%,55%,.5)}
.toolbar{
  display:flex;align-items:center;gap:5px;padding:5px 7px;flex:0 0 auto;
  background:linear-gradient(180deg,#fbfdff,#dfeaf5 48%,#d3e2f0 52%,#eaf3fb);
  border-bottom:1px solid #a9bfd2;}
.tbtn{
  padding:4px 10px;border:1px solid #8fa9c0;border-radius:4px;cursor:pointer;font-size:11px;
  background:linear-gradient(180deg,#ffffff,#e6eef7 48%,#d6e3f0 52%,#f2f7fc);
  box-shadow:0 1px 1px rgba(0,0,0,.12),0 1px 0 #fff inset;color:#123}
.tbtn:hover{background:linear-gradient(180deg,#fff,#e2f0ff 48%,#c9e2fb 52%,#eef7ff);border-color:#5b90c4}
.tbtn:active{transform:translateY(1px);background:linear-gradient(180deg,#cfe0f0,#eaf3fb)}
.tbtn.on{background:linear-gradient(180deg,#bcd9f2,#9cc4e8);border-color:#4a80b4}
.fld{
  border:1px solid #7f9db9;border-radius:3px;padding:4px 6px;font:12px "Segoe UI",Tahoma,sans-serif;
  background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.12) inset;min-width:0}
.fld:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px hsla(var(--accent-h),90%,70%,.5)}
.statusbar{
  flex:0 0 auto;padding:3px 8px;font-size:11px;color:#33506b;
  background:linear-gradient(180deg,#f4f8fc,#e2ebf4);border-top:1px solid #c2d2e0}
.pane{flex:1;overflow:auto;background:#fff}
.sidebar{
  width:160px;flex:0 0 160px;overflow:auto;padding:6px;
  background:linear-gradient(180deg,#eef5fc,#dce9f6);border-right:1px solid #bcd0e2}
.row{display:flex;min-height:0;flex:1}
h4.grp{margin:8px 4px 4px;font-size:11px;color:#3a6a99;text-transform:uppercase;letter-spacing:.5px}
.li{padding:4px 7px;border-radius:3px;cursor:default;display:flex;align-items:center;gap:6px}
.li:hover{background:hsla(var(--accent-h),85%,70%,.3)}
.li.sel{background:linear-gradient(180deg,hsla(var(--accent-h),85%,62%,.9),hsla(var(--accent-h),80%,48%,.9));color:#fff}
.li svg{width:16px;height:16px;flex:0 0 16px}

/* ============================ TASKBAR ============================ */
#taskbar{
  position:absolute;left:0;right:0;bottom:0;height:40px;z-index:9000;
  display:flex;align-items:center;gap:6px;padding:0 6px 0 0;
  border-top:1px solid rgba(255,255,255,.75);
  box-shadow:0 -6px 18px rgba(0,0,0,.45);
}
#orb{
  width:56px;height:52px;margin:-8px 6px -4px -2px;border:0;background:none;cursor:pointer;
  position:relative;flex:0 0 56px}
#orb svg{width:100%;height:100%;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}
#orb:hover svg{filter:drop-shadow(0 0 8px hsl(var(--accent-h) 100% 70%)) brightness(1.12)}
#tasks{flex:1;display:flex;gap:5px;overflow:hidden}
.task{
  min-width:0;max-width:170px;flex:0 1 170px;height:28px;display:flex;align-items:center;gap:6px;
  padding:0 8px;border-radius:4px;cursor:pointer;font-size:11px;color:#eaf6ff;
  border:1px solid rgba(255,255,255,.4);
  background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,.08) 48%,rgba(0,0,0,.06) 52%,rgba(255,255,255,.2));
  text-shadow:0 1px 2px rgba(0,0,0,.7);
}
.task span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.task svg{width:16px;height:16px;flex:0 0 16px}
.task:hover{background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,.2) 48%,rgba(255,255,255,.12) 52%,rgba(255,255,255,.4))}
.task.active{
  border-color:rgba(255,255,255,.85);
  background:linear-gradient(180deg,rgba(255,255,255,.7),rgba(255,255,255,.35) 48%,rgba(255,255,255,.25) 52%,rgba(255,255,255,.55));
  color:#0a2438;text-shadow:0 1px 0 rgba(255,255,255,.8)}
#switcher{width:30px;height:28px;border-radius:4px;cursor:pointer;margin-right:4px;
  border:1px solid rgba(255,255,255,.4);color:#eaf6ff;font-size:13px;
  background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,.08) 48%,rgba(0,0,0,.06) 52%,rgba(255,255,255,.2))}
#switcher::after{content:"\29C9"}
#switcher:hover{box-shadow:0 0 10px hsla(var(--accent-h),95%,72%,.6)}
#peek{width:12px;align-self:stretch;margin-left:6px;cursor:pointer;
  border-left:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.12)}
#peek:hover{background:rgba(255,255,255,.3)}
body.classic #switcher,body.classic #peek{background:#c3c3c3;color:#000;border-radius:0;
  box-shadow:inset -1px -1px 0 #0a0a0a,inset 1px 1px 0 #fff}
#tray{
  display:flex;align-items:center;gap:8px;height:28px;padding:0 8px;border-radius:4px;
  background:rgba(0,0,0,.18);border:1px solid rgba(255,255,255,.28);color:#eef8ff;
  text-shadow:0 1px 2px rgba(0,0,0,.8)}
#tray svg{width:15px;height:15px;opacity:.95}
#clock{text-align:center;line-height:1.15;font-size:11px;cursor:default}
#clock b{display:block;font-weight:400}

/* ============================ START MENU ============================ */
#start{
  position:absolute;left:4px;bottom:44px;width:420px;z-index:9500;display:none;
  border-radius:10px;padding:6px;
  box-shadow:0 18px 48px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.55) inset;
}
#start.open{display:block;animation:winIn .14s ease-out}
#start .userbar{display:flex;align-items:center;gap:8px;padding:4px 6px 8px}
#start .avatar{
  width:42px;height:42px;border-radius:6px;border:2px solid rgba(255,255,255,.85);
  overflow:hidden;background:#dff1ff;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.avatar svg{display:block;width:100%;height:100%}
#start .uname{color:#fff;font-size:14px;font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,.7)}
#start .cols{display:flex;gap:6px;background:rgba(255,255,255,.92);border-radius:6px;padding:6px;
  box-shadow:0 0 0 1px rgba(0,0,0,.25)}
#start .left{flex:1;border-right:1px solid #cfdde9;padding-right:6px}
#start .right{width:132px;padding-left:2px}
.slink{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:4px;cursor:default;font-size:12px}
.slink svg{width:22px;height:22px}
.slink:hover{background:linear-gradient(180deg,hsla(var(--accent-h),90%,72%,.95),hsla(var(--accent-h),85%,55%,.95));color:#fff}
.rlink{padding:5px 8px;border-radius:4px;font-size:12px;color:#12354f;cursor:default}
.rlink:hover{background:hsla(var(--accent-h),85%,70%,.35)}
#start .foot{display:flex;justify-content:flex-end;gap:6px;padding:8px 4px 2px}
.pbtn{
  padding:5px 12px;border-radius:5px;border:1px solid rgba(255,255,255,.6);cursor:pointer;
  font-size:11px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6);
  background:linear-gradient(180deg,rgba(255,255,255,.4),rgba(255,255,255,.05) 48%,rgba(0,0,0,.1) 52%,rgba(255,255,255,.25))}
.pbtn:hover{background:linear-gradient(180deg,rgba(255,255,255,.6),rgba(255,255,255,.2) 48%,rgba(255,255,255,.1) 52%,rgba(255,255,255,.45))}
#start .search{margin:8px 4px 2px;display:flex}
#start .search input{flex:1}

/* ============================ BOOT / LOGIN ============================ */
#boot,#lock,#bye{position:absolute;inset:0;z-index:99999;display:flex;flex-direction:column;
  align-items:center;justify-content:center;color:#dff0ff}
#boot{background:#000;gap:26px}
.bootlogo{font:300 44px "Trebuchet MS",sans-serif;letter-spacing:6px;
  background:linear-gradient(180deg,#eaf7ff,#5fb8ef 55%,#1d6fb0);-webkit-background-clip:text;background-clip:text;color:transparent}
.bootlogo b{font-weight:700}
#bootbar{width:230px;height:12px;border:1px solid #2b5f88;border-radius:7px;overflow:hidden;background:#04101c}
#bootbar i{display:block;height:100%;width:0;border-radius:6px;
  background:linear-gradient(90deg,#0d4b7f,#4fc3f7,#0d4b7f);animation:none}
.boottext{font-size:11px;color:#5f8ba9;letter-spacing:1px}
#lock{background:linear-gradient(180deg,#0d3a63,#1f7ab5 55%,#7cc4e8);gap:18px}
.tile{
  display:flex;align-items:center;gap:14px;padding:14px 22px;border-radius:10px;cursor:pointer;
  background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.5);
  box-shadow:0 8px 26px rgba(0,0,0,.4)}
.tile:hover{background:rgba(255,255,255,.3)}
.tile .avatar{width:58px;height:58px;border-radius:8px;border:2px solid #fff;overflow:hidden;background:#dff1ff}
.tile .n{font-size:20px;text-shadow:0 2px 6px rgba(0,0,0,.5)}
.tile .h{font-size:11px;opacity:.8}
#bye{background:#04121f;gap:16px;display:none}

/* ============================ APP-SPECIFIC ============================ */
/* Weather */
.wx-hero{padding:16px 18px;color:#fff;position:relative;overflow:hidden;
  background:linear-gradient(180deg,#2f8ad0,#67b6e4 60%,#a9d8f2)}
.wx-hero.night{background:linear-gradient(180deg,#0f2547,#1d3f6b 60%,#3c6796)}
.wx-hero::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(255,255,255,.35),transparent 45%);pointer-events:none}
.wx-temp{font-size:52px;font-weight:300;line-height:1;text-shadow:0 2px 6px rgba(0,0,0,.35)}
.wx-city{font-size:15px;font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,.4)}
.wx-cond{font-size:12px;opacity:.95}
.wx-days{display:flex;gap:6px;padding:10px;background:linear-gradient(180deg,#eef6fd,#dbe9f6)}
.wx-day{flex:1;text-align:center;padding:8px 4px;border-radius:6px;background:rgba(255,255,255,.75);
  border:1px solid #c3d8ea;box-shadow:0 1px 0 #fff inset}
.wx-day .d{font-weight:700;font-size:11px;color:#2c5a80}
.wx-day .t{font-size:13px;margin-top:3px}
.wx-day .lo{color:#6b87a0;font-size:11px}
.wx-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#cfdeeb;border-top:1px solid #cfdeeb}
.wx-grid div{background:#fff;padding:7px 10px;font-size:11px}
.wx-grid b{color:#3a6a99;display:block;font-size:10px;text-transform:uppercase;letter-spacing:.4px}

/* Browser */
.bw-tabs{display:flex;gap:3px;padding:4px 6px 0;background:linear-gradient(180deg,#e9f2fa,#d4e4f2)}
.bw-tab{padding:5px 14px;border-radius:6px 6px 0 0;font-size:11px;background:linear-gradient(180deg,#dbe8f4,#c3d7e9);
  border:1px solid #a7c0d6;border-bottom:none;cursor:pointer}
.bw-tab.on{background:linear-gradient(180deg,#fff,#eef6fd);font-weight:700}
.bw-page{padding:0;background:#fff}
.site{padding:18px 22px;font-family:Verdana,Geneva,sans-serif;font-size:12px;color:#222;user-select:text}
.site h1{font-size:20px;margin:0 0 4px}
.site a{color:#0a51a1}
.site .banner{padding:14px;border-radius:6px;color:#fff;margin-bottom:14px;
  background:linear-gradient(180deg,#2b6cb0,#1a4b80);box-shadow:0 2px 6px rgba(0,0,0,.25)}
.site .card{border:1px solid #c8d6e2;border-radius:5px;padding:10px 12px;margin:8px 0;background:#f9fcff}
.site table{border-collapse:collapse;width:100%;font-size:11px}
.site td,.site th{border:1px solid #d5e0ea;padding:5px 7px;text-align:left}
.site th{background:#e8f1f9}
.hitlist a{font-size:14px}
.hitlist .url{color:#0a7a2a;font-size:11px}
.hitlist p{margin:2px 0 14px;color:#444}

/* File manager */
.fm-grid{display:flex;flex-wrap:wrap;align-content:flex-start;gap:4px;padding:10px}
.fm-item{width:96px;padding:8px 4px;text-align:center;border-radius:4px;cursor:default}
.fm-item svg{width:36px;height:36px}
.fm-item span{display:block;font-size:11px;margin-top:4px;word-break:break-word}
.fm-item:hover{background:hsla(var(--accent-h),85%,70%,.25);outline:1px solid hsla(var(--accent-h),60%,60%,.4)}
.fm-item.sel{background:hsla(var(--accent-h),85%,62%,.45);outline:1px solid hsla(var(--accent-h),60%,50%,.7)}
.crumb{display:flex;align-items:center;gap:4px;flex:1;border:1px solid #7f9db9;border-radius:3px;
  padding:3px 6px;background:#fff;font-size:11px}
.crumb i{font-style:normal;color:#7b93a8}

/* Text editor */
.te-area{flex:1;width:100%;border:0;resize:none;padding:10px 12px;font:13px Consolas,"Courier New",monospace;
  line-height:1.55;color:#12222f;user-select:text}
.te-area:focus{outline:none}

/* Image viewer */
.iv-stage{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;
  background:linear-gradient(180deg,#2b3947,#151d26)}
.iv-stage img{max-width:96%;max-height:96%;box-shadow:0 10px 30px rgba(0,0,0,.7);
  border:6px solid #fff;transition:transform .18s}
.iv-strip{flex:0 0 auto;display:flex;gap:6px;padding:6px;overflow-x:auto;
  background:linear-gradient(180deg,#e9f2fa,#d3e3f1);border-top:1px solid #b7cbdd}
.iv-strip img{height:46px;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.35);cursor:pointer;border-radius:2px}
.iv-strip img.on{border-color:var(--accent);box-shadow:0 0 0 2px hsla(var(--accent-h),90%,60%,.6)}

/* Media player */
.mp-wrap{flex:1;display:flex;flex-direction:column;background:linear-gradient(180deg,#101a26,#04080d)}
.mp-vis{flex:1;position:relative;min-height:120px}
.mp-vis canvas{position:absolute;inset:0;width:100%;height:100%}
.mp-drop{position:absolute;inset:10px;border:2px dashed rgba(140,215,255,.75);border-radius:8px;
  display:none;align-items:center;justify-content:center;color:#cfe9ff;font-size:14px;letter-spacing:1px;
  background:rgba(10,40,70,.55);z-index:3}
.mp-drop.on{display:flex}
.mp-now{position:absolute;left:14px;bottom:12px;color:#cfe9ff;text-shadow:0 2px 6px #000;z-index:2}
.mp-now .t{font-size:16px;font-weight:700}
.mp-now .a{font-size:11px;opacity:.8}
.mp-ctl{display:flex;align-items:center;gap:10px;padding:8px 12px;
  background:linear-gradient(180deg,#3a5470,#16232f);border-top:1px solid #547296}
.mp-round{
  width:34px;height:34px;border-radius:50%;border:1px solid #7fa8cf;cursor:pointer;
  background:radial-gradient(circle at 35% 28%,#eaf6ff,#7fb6e2 45%,#2a6fa8 100%);
  display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.5)}
.mp-round:active{transform:translateY(1px)}
.mp-round.big{width:44px;height:44px}
.mp-round svg{width:15px;height:15px;fill:#0d2c47}
.mp-seek{flex:1;height:8px;border-radius:5px;background:#0a1620;border:1px solid #4b6b8a;cursor:pointer;position:relative}
.mp-seek i{display:block;height:100%;border-radius:4px;width:0;
  background:linear-gradient(180deg,#9fe0ff,#2b8fd0)}
.mp-time{color:#a9c9e4;font-size:11px;min-width:82px;text-align:right}
.mp-list{flex:0 0 148px;overflow:auto;background:#0d151f;border-top:1px solid #2a3d52}
.mp-track{display:flex;gap:10px;padding:5px 12px;color:#9fbdd8;font-size:11px;cursor:default}
.mp-track:hover{background:#16283a}
.mp-track.on{background:linear-gradient(180deg,#2c6fa8,#194b78);color:#fff}
.mp-track .n{flex:1}

/* Mail */
.ml-list{flex:0 0 236px;overflow:auto;border-right:1px solid #c3d5e5;background:#fff}
.ml-item{padding:7px 10px;border-bottom:1px solid #eaf1f7;cursor:default}
.ml-item:hover{background:#f0f7fd}
.ml-item.sel{background:linear-gradient(180deg,hsla(var(--accent-h),85%,62%,.95),hsla(var(--accent-h),80%,48%,.95));color:#fff}
.ml-item.sel .sub,.ml-item.sel .prev,.ml-item.sel .from{color:#fff}
.ml-item .from{font-weight:700;font-size:11px;color:#123}
.ml-item .sub{font-size:12px;margin:1px 0}
.ml-item .prev{font-size:11px;color:#6b8299;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ml-item.unread .sub{font-weight:700}
.ml-read{flex:1;display:flex;flex-direction:column;overflow:hidden}
.ml-head{padding:10px 14px;background:linear-gradient(180deg,#f6fafd,#e6eff8);border-bottom:1px solid #c8d8e6}
.ml-head h3{margin:0 0 4px;font-size:14px}
.ml-head .meta{font-size:11px;color:#4a6b86}
.ml-body{flex:1;overflow:auto;padding:14px 16px;font-size:12px;line-height:1.6;user-select:text;white-space:pre-wrap}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:5px}

/* Control panel */
.cp-grid{display:flex;flex-wrap:wrap;gap:10px;padding:14px}
.cp-tile{width:126px;padding:12px 6px;text-align:center;border-radius:6px;cursor:default;
  border:1px solid transparent}
.cp-tile:hover{background:hsla(var(--accent-h),85%,72%,.3);border-color:hsla(var(--accent-h),60%,60%,.5)}
.cp-tile svg{width:40px;height:40px}
.cp-tile span{display:block;font-size:11px;margin-top:6px;color:#14405f}
.cp-page{padding:14px 18px;overflow:auto}
.cp-page h3{margin:0 0 4px;font-size:15px;color:#14507d;font-weight:400}
.cp-page hr{border:0;border-top:1px solid #d5e2ec;margin:10px 0}
.swatches{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.sw{width:34px;height:34px;border-radius:6px;cursor:pointer;border:2px solid #fff;
  box-shadow:0 2px 5px rgba(0,0,0,.3)}
.sw.on{outline:3px solid #123;outline-offset:1px}
.wps{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.wpt{width:96px;height:60px;border-radius:4px;border:2px solid #fff;cursor:pointer;
  box-shadow:0 2px 6px rgba(0,0,0,.35)}
.wpt.on{outline:3px solid var(--accent);outline-offset:1px}
label.opt{display:flex;align-items:center;gap:7px;padding:5px 0;font-size:12px}
.about{display:flex;gap:16px;align-items:center;padding:6px 0}

/* Spreadsheet */
.ss-wrap{flex:1;overflow:auto;background:#fff}
table.ss{border-collapse:collapse;font-size:12px}
table.ss th{background:linear-gradient(180deg,#f4f8fc,#dde8f2);border:1px solid #b6c8d8;
  font-weight:400;color:#3a5a75;padding:2px 6px;position:sticky;top:0;z-index:2;min-width:78px}
table.ss th.rh{min-width:34px;left:0;z-index:3;position:sticky}
table.ss td{border:1px solid #dde6ee;padding:0;height:21px}
table.ss td div{padding:2px 5px;min-width:78px;height:21px;outline:none;white-space:nowrap;overflow:hidden}
table.ss td.num div{text-align:right}
table.ss td.cur{box-shadow:0 0 0 2px var(--accent) inset}
table.ss td.rh{background:linear-gradient(180deg,#f4f8fc,#dde8f2);text-align:center;color:#3a5a75;
  position:sticky;left:0;z-index:1;min-width:34px;font-size:11px}
.ss-bar{display:flex;align-items:center;gap:6px;padding:4px 7px;background:#eef4fa;border-bottom:1px solid #c3d4e3}
.ss-bar .ref{width:56px;text-align:center;font-weight:700;color:#2c5a80}
.ss-bar input{flex:1}

/* Slides */
.sl-thumbs{flex:0 0 132px;overflow:auto;padding:8px;background:linear-gradient(180deg,#e8f1f9,#d5e5f2);
  border-right:1px solid #b9cddd}
.sl-thumb{position:relative;margin-bottom:8px;cursor:default}
.sl-thumb .mini{height:66px;border:2px solid #fff;border-radius:3px;box-shadow:0 2px 5px rgba(0,0,0,.3);
  padding:5px;overflow:hidden;color:#fff}
.sl-thumb.on .mini{border-color:var(--accent);box-shadow:0 0 0 2px hsla(var(--accent-h),90%,55%,.7)}
.sl-thumb .mini b{font-size:8px;display:block;line-height:1.15}
.sl-thumb .mini i{font-size:6px;font-style:normal;opacity:.85;display:block;margin-top:3px;line-height:1.2}
.sl-thumb .no{position:absolute;left:-4px;top:-4px;width:16px;height:16px;border-radius:50%;font-size:9px;
  background:#2c5a80;color:#fff;display:flex;align-items:center;justify-content:center}
.sl-stage{flex:1;display:flex;align-items:center;justify-content:center;padding:18px;
  background:linear-gradient(180deg,#8ea6bd,#5d7288)}
.slide{
  width:100%;max-width:520px;aspect-ratio:4/3;border-radius:4px;padding:34px 38px;color:#fff;
  box-shadow:0 12px 34px rgba(0,0,0,.5);display:flex;flex-direction:column;justify-content:center;gap:14px;
  background:linear-gradient(160deg,#1d5c96,#0d3159 70%);position:relative;overflow:hidden}
.slide::after{content:"";position:absolute;inset:0;
  background:radial-gradient(70% 40% at 20% -5%,rgba(255,255,255,.35),transparent 60%);pointer-events:none}
.slide h2{margin:0;font-size:27px;font-weight:400;text-shadow:0 2px 5px rgba(0,0,0,.5);outline:none}
.slide ul{margin:0;padding-left:20px;font-size:14px;line-height:1.7;outline:none}
#present{position:absolute;inset:0;z-index:99000;background:#000;display:none;
  align-items:center;justify-content:center;flex-direction:column;gap:20px}
#present.on{display:flex}
#present .slide{max-width:74vw;width:74vw;box-shadow:none}
#present .hint{color:#5d7284;font-size:11px}

/* misc */
.balloon{
  position:absolute;right:12px;bottom:52px;width:266px;z-index:9800;padding:10px 12px;
  border-radius:6px;background:linear-gradient(180deg,#fffdf0,#fdf3c8);border:1px solid #d8c473;
  box-shadow:0 8px 24px rgba(0,0,0,.45);font-size:11px;color:#4a3a10;animation:winIn .2s}
.balloon b{display:block;font-size:12px;margin-bottom:3px;color:#3a2c06}
.ctxmenu{position:absolute;z-index:9900;min-width:170px;padding:3px;border-radius:5px;
  background:rgba(255,255,255,.97);box-shadow:0 8px 26px rgba(0,0,0,.45),0 0 0 1px rgba(0,0,0,.3)}
.ctxmenu div{padding:5px 12px;border-radius:3px;font-size:12px;cursor:default}
.ctxmenu div:hover{background:linear-gradient(180deg,hsla(var(--accent-h),90%,70%,.95),hsla(var(--accent-h),85%,52%,.95));color:#fff}
.ctxmenu hr{border:0;border-top:1px solid #dbe5ee;margin:3px 6px}
::-webkit-scrollbar{width:15px;height:15px}
::-webkit-scrollbar-track{background:linear-gradient(90deg,#eef4fa,#e0eaf4)}
::-webkit-scrollbar-thumb{border-radius:7px;border:1px solid #92b0c8;
  background:linear-gradient(90deg,#fdfeff,#cfe0ef 48%,#bcd3e6 52%,#e9f3fb)}
::-webkit-scrollbar-thumb:hover{background:linear-gradient(90deg,#fff,#d9ecfc 48%,#bfe0fb 52%,#f0f8ff)}

/* ===================== 1.1 ADDITIONS ===================== */
/* startup animation */
#boot{background:radial-gradient(70% 60% at 50% 45%,#061626,#000 75%);gap:0;overflow:hidden}
#bootStage{display:flex;flex-direction:column;align-items:center;gap:26px}
.firmware{position:absolute;top:22px;left:26px;font:11px Consolas,monospace;color:#3d5f7d;letter-spacing:1px}
.firmware span{display:block;opacity:0;animation:fwIn .01s forwards}
.orbwrap{position:relative;width:132px;height:132px}
.orbwrap svg{width:100%;height:100%;filter:drop-shadow(0 0 22px rgba(60,170,255,.55))}
.orbwrap .bloom{position:absolute;inset:-30%;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(90,190,255,.42),transparent 62%);animation:bloom 2.6s ease-in-out infinite}
@keyframes bloom{0%,100%{transform:scale(.86);opacity:.5}50%{transform:scale(1.06);opacity:.95}}
@keyframes fwIn{to{opacity:1}}
.assemble{animation:assemble 1.5s cubic-bezier(.22,1,.3,1) both}
@keyframes assemble{0%{opacity:0;transform:scale(.35) rotate(-25deg)}60%{opacity:1}100%{opacity:1;transform:none}}
.beads{width:190px;height:9px;position:relative;overflow:hidden}
.beads i{position:absolute;top:0;width:9px;height:9px;border-radius:50%;left:-14px;
  background:radial-gradient(circle at 35% 30%,#e8faff,#3fb4f5 55%,#0b5c93);
  box-shadow:0 0 9px rgba(80,200,255,.9);animation:beadRun 2.1s cubic-bezier(.62,0,.38,1) infinite}
@keyframes beadRun{0%{left:-14px}100%{left:200px}}
.bootword{font:300 15px "Trebuchet MS",sans-serif;letter-spacing:5px;color:#8fc7ee;
  text-transform:uppercase;animation:fwIn .8s .3s both}
#welcome{position:absolute;inset:0;z-index:99998;display:none;flex-direction:column;
  align-items:center;justify-content:center;gap:22px;color:#eaf6ff;
  background:radial-gradient(80% 70% at 50% 40%,#2b7fc0,#0b3560 70%,#04203c)}
#welcome.on{display:flex;animation:fwIn .5s}
#welcome .avatar{width:82px;height:82px;border-radius:10px;border:3px solid rgba(255,255,255,.9);
  overflow:hidden;background:#dff1ff;box-shadow:0 10px 34px rgba(0,0,0,.55);animation:assemble 1s both}
#welcome .wname{font:300 30px "Trebuchet MS",sans-serif;text-shadow:0 2px 10px rgba(0,0,0,.55)}
#welcome .wsub{font-size:12px;opacity:.85;letter-spacing:2px;text-transform:uppercase}
.ring{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.25);
  border-top-color:#eaf9ff;animation:spin .85s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes iconIn{from{opacity:0;transform:translateY(14px) scale(.9)}to{opacity:1;transform:none}}
.cascade .dicon{animation:iconIn .34s backwards}
@keyframes tbIn{from{transform:translateY(46px)}to{transform:none}}
.tbIn{animation:tbIn .5s cubic-bezier(.2,1,.3,1) both}
#bye{background:radial-gradient(70% 60% at 50% 45%,#08203a,#000 75%)}

/* login / account tiles */
#lock{background:linear-gradient(180deg,#0d3a63,#1f7ab5 55%,#7cc4e8);gap:14px;justify-content:center}
#tiles{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;max-width:640px}
.tile{flex-direction:column;text-align:center;gap:8px;padding:16px 18px;min-width:132px}
.tile .avatar{width:66px;height:66px;margin:0 auto}
.tile.newacc{border-style:dashed;opacity:.9}
.tile.newacc .plus{width:66px;height:66px;border-radius:8px;border:2px dashed rgba(255,255,255,.7);
  display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:300;margin:0 auto}
#newform{display:none;flex-direction:column;gap:10px;align-items:center;padding:16px 20px;border-radius:10px;
  background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.5);box-shadow:0 10px 30px rgba(0,0,0,.4)}
#newform.on{display:flex}
#newform .huerow{display:flex;gap:7px}
#newform .hue{width:30px;height:30px;border-radius:6px;border:2px solid #fff;cursor:pointer;overflow:hidden}
#newform .hue svg{display:block;width:100%;height:100%}
#newform .hue.on{outline:2px solid #fff;outline-offset:2px}

/* browser 1.1 */
.bw-tab{display:flex;align-items:center;gap:6px;max-width:180px}
.bw-tab .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bw-tab .cl{opacity:.55;font-weight:700;padding:0 2px}
.bw-tab .cl:hover{opacity:1;color:#a33}
.bw-frame{flex:1;width:100%;border:0;background:#fff}
.bw-note{padding:6px 10px;font-size:11px;background:linear-gradient(180deg,#fffdf0,#fbf0c6);
  border-bottom:1px solid #d8c473;color:#5a4a12;display:flex;align-items:center;gap:8px}
.bw-note button{margin-left:auto}
.reader{padding:22px 30px;max-width:760px;margin:0 auto;font:13px/1.75 Georgia,serif;color:#1d2733;
  white-space:pre-wrap;user-select:text}
.reader h1{font-size:22px;border-bottom:2px solid #d8e2ea;padding-bottom:6px}
.spinbox{display:flex;align-items:center;gap:10px;padding:26px;color:#4a6b86;font-size:12px}
.spinbox .ring{width:18px;height:18px;border-width:2px;border-color:#cfdde9;border-top-color:#2f7fbc}
.fav{padding:3px 8px;font-size:11px;border-radius:3px;cursor:default}
.fav:hover{background:hsla(var(--accent-h),85%,70%,.3)}

/* weather 1.1 */
.wx-search{position:absolute;z-index:20;background:#fff;border:1px solid #7f9db9;border-radius:4px;
  box-shadow:0 8px 22px rgba(0,0,0,.3);max-height:200px;overflow:auto;min-width:250px;display:none}
.wx-search.on{display:block}
.wx-search div{padding:6px 10px;font-size:12px;cursor:default}
.wx-search div:hover{background:hsla(var(--accent-h),85%,70%,.35)}
.wx-hours{display:flex;gap:0;overflow-x:auto;background:#fff;border-top:1px solid #cfdeeb}
.wx-hour{flex:0 0 62px;text-align:center;padding:8px 2px;border-right:1px solid #eef4f9;font-size:11px}
.wx-hour .h{color:#5b7a94;font-size:10px}
.wx-hour .v{font-size:13px;margin-top:2px}
.live{display:inline-block;width:7px;height:7px;border-radius:50%;background:#4fbf3f;margin-right:5px;
  box-shadow:0 0 6px #4fbf3f}
.live.off{background:#c9a227;box-shadow:0 0 6px #c9a227}


/* ===================== 1.2 ADDITIONS ===================== */
/* wallpaper layers for crossfade */
#wall,#wall2{position:absolute;inset:0;background-size:cover;background-position:center;z-index:0}
#wall2{opacity:0;transition:opacity .55s ease}
#icons,.win{z-index:2}

/* window motion */
.win{transition:box-shadow .18s}
.anim .win.moving{transition:none}
.anim .win.zoom{transition:left .22s cubic-bezier(.22,1,.3,1),top .22s cubic-bezier(.22,1,.3,1),
  width .22s cubic-bezier(.22,1,.3,1),height .22s cubic-bezier(.22,1,.3,1)}
@keyframes winOut{to{opacity:0;transform:scale(.94) translateY(10px)}}
.anim .win.closing{animation:winOut .15s forwards}
@keyframes minGo{to{opacity:0;transform:scale(.28) translateY(240px)}}
.anim .win.mining{animation:minGo .2s forwards}
@keyframes minBack{from{opacity:0;transform:scale(.35) translateY(200px)}to{opacity:1;transform:none}}
.anim .win.restoring{animation:minBack .22s cubic-bezier(.22,1,.3,1)}
.titlebar .sheen{position:absolute;top:0;bottom:0;width:70px;pointer-events:none;z-index:2;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.75),transparent);
  transform:translateX(-90px)}
.anim .win.focused .titlebar .sheen{animation:sheen .75s ease-out}
@keyframes sheen{to{transform:translateX(calc(100% + 900px))}}

/* desktop + taskbar micro-motion */
.dicon{transition:transform .12s,background .12s}
.dicon:hover{transform:translateY(-2px) scale(1.03)}
.dicon svg{transition:filter .15s}
.dicon:hover svg{filter:drop-shadow(0 3px 5px rgba(0,0,0,.6)) brightness(1.08)}
.task{transition:background .15s,box-shadow .15s,transform .12s}
.task:hover{box-shadow:0 0 10px hsla(var(--accent-h),95%,72%,.55)}
@keyframes taskPop{0%{transform:translateY(12px) scale(.9);opacity:0}60%{transform:translateY(-3px) scale(1.02)}100%{transform:none;opacity:1}}
.anim .task.pop{animation:taskPop .3s}
#orb svg{transition:filter .2s,transform .2s}
#orb:active svg{transform:scale(.94)}
@keyframes orbPulse{0%,100%{filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}
  50%{filter:drop-shadow(0 0 12px hsl(var(--accent-h) 100% 72%)) brightness(1.15)}}
.anim #orb.busy svg{animation:orbPulse 1.2s ease-in-out infinite}
@keyframes startIn{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
.anim #start.open{animation:startIn .17s cubic-bezier(.22,1,.3,1)}
@keyframes ctxIn{from{opacity:0;transform:scale(.94) translateY(-4px)}to{opacity:1;transform:none}}
.anim .ctxmenu{animation:ctxIn .11s ease-out;transform-origin:top left}
@keyframes balloonIn{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
.anim .balloon{animation:balloonIn .28s cubic-bezier(.22,1,.3,1)}
.tbtn,.pbtn,.wbtn{transition:background .12s,border-color .12s,box-shadow .12s,transform .08s}
.li,.slink,.rlink,.fm-item,.cp-tile{transition:background .1s}

/* cursor trail */
.trail{position:fixed;width:9px;height:9px;border-radius:50%;pointer-events:none;z-index:99997;
  background:radial-gradient(circle at 34% 30%,#fff,hsl(var(--accent-h) 90% 60%));
  animation:trailOut .55s ease-out forwards}
@keyframes trailOut{to{opacity:0;transform:scale(.25)}}

/* tray clock flyout */
#flyout{position:absolute;right:8px;bottom:46px;width:266px;z-index:9700;display:none;
  border-radius:10px;padding:8px;box-shadow:0 18px 44px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.5) inset}
#flyout.on{display:block}
.anim #flyout.on{animation:startIn .18s cubic-bezier(.22,1,.3,1)}
#flyout .inner{background:rgba(255,255,255,.94);border-radius:7px;padding:10px;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
#flyout .digi{text-align:center;font:300 24px "Trebuchet MS",sans-serif;color:#123c5e;letter-spacing:1px}
#flyout .dstr{text-align:center;font-size:11px;color:#5b7a94;margin-bottom:6px}
#flyout .face{display:block;margin:0 auto}
#flyout hr{border:0;border-top:1px solid #dde7ef;margin:8px 0}
#flyout .opt{font-size:11px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;font-size:10px;text-align:center}
.cal b{color:#3a6a99;font-weight:400;padding:2px 0}
.cal span{padding:3px 0;border-radius:3px;color:#24435f}
.cal span.today{background:linear-gradient(180deg,hsla(var(--accent-h),85%,62%,.95),hsla(var(--accent-h),80%,48%,.95));color:#fff}
.cal span.dim{color:#b6c6d4}

/* screen saver */
#saver{position:absolute;inset:0;z-index:99500;background:#000;display:none}
#saver.on{display:block}
#saver canvas{width:100%;height:100%;display:block}

/* file manager 1.2 */
.fm-details{width:100%;border-collapse:collapse;font-size:11px}
.fm-details th{position:sticky;top:0;text-align:left;padding:4px 8px;font-weight:400;color:#3a5a75;
  background:linear-gradient(180deg,#f7fbfe,#e2ecf5);border-bottom:1px solid #c3d4e3;cursor:pointer}
.fm-details th:hover{background:linear-gradient(180deg,#fff,#d8ebfb)}
.fm-details td{padding:3px 8px;border-bottom:1px solid #f0f5f9}
.fm-details tr{cursor:default}
.fm-details tr:hover td{background:hsla(var(--accent-h),85%,70%,.2)}
.fm-details tr.sel td{background:linear-gradient(180deg,hsla(var(--accent-h),85%,62%,.9),hsla(var(--accent-h),80%,48%,.9));color:#fff}
.fm-item.cut,.fm-details tr.cut td{opacity:.45}
.tree{font-size:11px}
.tree .tw{padding:3px 6px;border-radius:3px;cursor:default;display:flex;align-items:center;gap:5px}
.tree .tw:hover{background:hsla(var(--accent-h),85%,70%,.3)}
.tree .tw.sel{background:linear-gradient(180deg,hsla(var(--accent-h),85%,62%,.9),hsla(var(--accent-h),80%,48%,.9));color:#fff}
.tree .tw svg{width:15px;height:15px}
.dlg{position:absolute;inset:0;background:rgba(10,25,40,.35);display:flex;align-items:center;
  justify-content:center;z-index:50}
.dlg .box{background:#fff;border-radius:6px;box-shadow:0 16px 40px rgba(0,0,0,.5);padding:14px 16px;min-width:250px}
.dlg h4{margin:0 0 8px;font-size:13px;color:#14507d;font-weight:400}
.dlg .btns{display:flex;justify-content:flex-end;gap:6px;margin-top:12px}

/* sketch */
.sk-wrap{flex:1;display:flex;min-height:0}
.sk-tools{width:132px;flex:0 0 132px;padding:8px;overflow:auto;
  background:linear-gradient(180deg,#eef5fc,#dbe9f6);border-right:1px solid #bcd0e2}
.sk-tools .tbtn{width:100%;margin-bottom:4px;text-align:left}
.sk-colors{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:6px 0}
.sk-colors i{display:block;height:19px;border-radius:3px;cursor:pointer;border:1px solid rgba(0,0,0,.25);
  box-shadow:0 1px 0 rgba(255,255,255,.6) inset}
.sk-colors i.on{outline:2px solid #123;outline-offset:1px}
.sk-canvas{flex:1;position:relative;background:#6d8095;display:flex;align-items:center;justify-content:center}
.sk-canvas canvas{background:#fff;box-shadow:0 8px 26px rgba(0,0,0,.45);cursor:crosshair;touch-action:none}
.sk-hud{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:12px;padding:6px 12px;
  background:linear-gradient(180deg,rgba(10,30,50,.85),rgba(10,30,50,.55));color:#dff0ff;font-size:12px;z-index:3}
.sk-hud .word{font-size:15px;font-weight:700;letter-spacing:1px}
.sk-hud .timer{margin-left:auto;font:700 15px Consolas,monospace}
.sk-hud .timer.low{color:#ff9b8f;animation:blink .6s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.sk-guess{position:absolute;inset:0;background:rgba(6,18,30,.86);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;color:#eaf6ff;z-index:4;text-align:center;padding:20px}
.sk-guess h3{margin:0;font-weight:400;font-size:20px}
.sk-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:min(360px,90%)}
.sk-opts button{padding:9px 12px;font-size:13px}
.sk-score{font-size:12px;opacity:.85}

/* ---------- first-run setup ---------- */
#oobe{position:absolute;inset:0;z-index:99600;display:none;align-items:center;justify-content:center;
  background:#0b2c4d;background-size:cover;background-position:center}
#oobe.on{display:flex}
#oobe .scrim{position:absolute;inset:0;background:radial-gradient(80% 70% at 50% 40%,rgba(4,20,38,.45),rgba(3,12,24,.82))}
.oobe-card{position:relative;width:min(660px,92%);border-radius:12px;padding:0;overflow:hidden;
  box-shadow:0 26px 70px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.45) inset;
  background:linear-gradient(180deg,rgba(255,255,255,.96),rgba(238,246,253,.96))}
.oobe-head{padding:16px 22px 12px;color:#0d3a63;
  background:linear-gradient(180deg,hsla(var(--accent-h),75%,88%,.95),hsla(var(--accent-h),62%,74%,.9));
  border-bottom:1px solid rgba(255,255,255,.7);position:relative;overflow:hidden}
.oobe-head::after{content:"";position:absolute;left:0;right:0;top:0;height:26px;
  background:linear-gradient(180deg,rgba(255,255,255,.75),transparent)}
.oobe-head h2{margin:0;font-weight:300;font-size:23px;position:relative}
.oobe-head p{margin:3px 0 0;font-size:12px;opacity:.85;position:relative}
.oobe-body{padding:18px 22px;min-height:214px;max-height:52vh;overflow:auto}
.oobe-foot{display:flex;align-items:center;gap:10px;padding:12px 22px;
  background:linear-gradient(180deg,#eef5fb,#dfeaf5);border-top:1px solid #c3d4e3}
.oobe-foot .dots{display:flex;gap:6px;flex:1}
.oobe-foot .dots i{width:8px;height:8px;border-radius:50%;background:#b8cbdc;display:block}
.oobe-foot .dots i.on{background:var(--accent);box-shadow:0 0 6px hsla(var(--accent-h),90%,60%,.8)}
.oobe-foot .tbtn{padding:6px 18px}
.oobe-grid{display:flex;flex-wrap:wrap;gap:9px}
.oobe-pick{width:104px;height:64px;border-radius:5px;border:2px solid #fff;cursor:pointer;
  box-shadow:0 2px 7px rgba(0,0,0,.3);position:relative}
.oobe-pick.on{outline:3px solid var(--accent);outline-offset:1px}
.oobe-pick span{position:absolute;left:0;right:0;bottom:0;font-size:9px;text-align:center;color:#fff;
  background:rgba(0,0,0,.45);padding:1px 0;border-radius:0 0 3px 3px}
.oobe-flowers{display:flex;gap:10px;flex-wrap:wrap}
.oobe-flower{width:56px;height:56px;border-radius:8px;border:2px solid #fff;cursor:pointer;overflow:hidden;
  background:#dff1ff;box-shadow:0 2px 7px rgba(0,0,0,.28)}
.oobe-flower.on{outline:3px solid var(--accent);outline-offset:1px}
.oobe-flower svg{display:block;width:100%;height:100%}
.oobe-row{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:8px 0}
/* reusable loading overlay */
#loader{position:absolute;inset:0;z-index:99650;display:none;flex-direction:column;align-items:center;
  justify-content:center;gap:22px;background:radial-gradient(70% 60% at 50% 45%,#0a2340,#03101f 78%);color:#cfe7fb}
#loader.on{display:flex}
#loader .ltitle{font:300 20px "Trebuchet MS",sans-serif;letter-spacing:3px}
#loader .lstep{font-size:11px;color:#7fa8c8;letter-spacing:1px;min-height:14px}
#loader .lbar{width:260px;height:10px;border:1px solid #2b5f88;border-radius:6px;overflow:hidden;background:#04101c}
#loader .lbar i{display:block;height:100%;width:0;transition:width .4s ease;
  background:linear-gradient(90deg,#0d4b7f,#4fc3f7,#0d4b7f)}

/* ---------- MeridianMsg ---------- */
.mm-signin{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  background:linear-gradient(180deg,#eaf4fc,#c9dff2);padding:18px}
.mm-logo{display:flex;align-items:center;gap:10px;color:#1c6b15;font:300 24px "Trebuchet MS",sans-serif}
.mm-logo svg{width:44px;height:44px}
.mm-signin .fld{width:230px}
.mm-signin label.opt{font-size:11px;color:#2c5a80}
.mm-hdr{display:flex;gap:10px;padding:9px 10px;align-items:center;
  background:linear-gradient(180deg,#fbfdff,#dfeaf5);border-bottom:1px solid #b8cadb}
.mm-dp{width:52px;height:52px;border-radius:6px;border:2px solid #fff;overflow:hidden;background:#dff1ff;
  box-shadow:0 2px 6px rgba(0,0,0,.28);flex:0 0 52px}
.mm-dp svg{display:block;width:100%;height:100%}
.mm-who{flex:1;min-width:0}
.mm-name{font-weight:700;font-size:13px;color:#123;cursor:text;display:inline-block}
.mm-pm{font-size:11px;color:#6b8299;cursor:text;display:block;margin-top:2px;font-style:italic}
.mm-status{display:flex;align-items:center;gap:5px;font-size:11px;margin-top:3px}
.mm-status select{font-size:11px}
.sdot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:0 0 10px;
  box-shadow:0 0 0 1px rgba(0,0,0,.25) inset}
.sdot.online{background:radial-gradient(circle at 35% 30%,#c7f5a8,#3fae2a)}
.sdot.away{background:radial-gradient(circle at 35% 30%,#ffe9a3,#e0a220)}
.sdot.busy{background:radial-gradient(circle at 35% 30%,#ffb3ab,#c0392b)}
.sdot.off{background:radial-gradient(circle at 35% 30%,#dfe7ee,#93a6b5)}
.mm-tools{display:flex;gap:4px;padding:4px 7px;background:#eef4fa;border-bottom:1px solid #c3d4e3}
.mm-list{flex:1;overflow:auto;background:#fff}
.mm-group{padding:5px 8px;font-size:11px;font-weight:700;color:#2c5a80;cursor:default;
  background:linear-gradient(180deg,#f4f9fd,#e6eff8);border-bottom:1px solid #e2ebf3}
.mm-group:hover{background:linear-gradient(180deg,#fff,#dceaf7)}
.mm-c{display:flex;align-items:center;gap:7px;padding:4px 10px 4px 18px;cursor:default}
.mm-c:hover{background:hsla(var(--accent-h),85%,70%,.22)}
.mm-c.sel{background:linear-gradient(180deg,hsla(var(--accent-h),85%,62%,.9),hsla(var(--accent-h),80%,48%,.9));color:#fff}
.mm-c .nm{font-size:12px}
.mm-c .pm{font-size:11px;color:#8a9fb0;margin-left:4px;font-style:italic}
.mm-c.sel .pm{color:#e6f2ff}
.mm-c.offline .nm{color:#8a9fb0}
.mm-ad{flex:0 0 auto;padding:6px;text-align:center;border-top:1px solid #c3d4e3;
  background:linear-gradient(180deg,#fffdf0,#f6ecc4)}
.mm-ad div{border:1px solid #d8c473;border-radius:3px;padding:7px 6px;font-size:11px;color:#5a4a12;
  background:linear-gradient(180deg,#fff9df,#f3e3ae)}
/* conversation */
.mm-conv{flex:1;display:flex;flex-direction:column;min-height:0}
.mm-to{padding:6px 10px;font-size:11px;color:#2c5a80;background:linear-gradient(180deg,#fbfdff,#e9f2fa);
  border-bottom:1px solid #c3d4e3}
.mm-hist{flex:1;overflow:auto;padding:10px 12px;background:#fff;font-size:12px;line-height:1.55;user-select:text}
.mm-line{margin-bottom:7px}
.mm-line .who{font-weight:700;color:#2f7fbc}
.mm-line.me .who{color:#c0392b}
.mm-sys{color:#8a9fb0;font-size:11px;font-style:italic;margin:8px 0;text-align:center}
.mm-err{color:#c0392b;font-size:11px;margin:8px 0;padding:6px 8px;border:1px solid #e2b3ac;border-radius:4px;
  background:#fdf3f2}
.mm-fmt{display:flex;gap:4px;align-items:center;padding:4px 7px;background:#eef4fa;border-top:1px solid #c3d4e3}
.mm-emo{display:flex;gap:3px}
.mm-emo span{cursor:pointer;font-size:14px;line-height:1}
.mm-in{display:flex;gap:6px;padding:7px;background:linear-gradient(180deg,#f7fbfe,#e9f2fa);border-top:1px solid #c3d4e3}
.mm-in textarea{flex:1;height:52px;resize:none;border:1px solid #7f9db9;border-radius:3px;padding:5px 7px;
  font:12px "Segoe UI",Tahoma,sans-serif;user-select:text}
.mm-in textarea:focus{outline:none;border-color:var(--accent)}
@keyframes nudge{0%,100%{transform:none}
  10%{transform:translate(-8px,4px)}25%{transform:translate(7px,-5px)}
  40%{transform:translate(-6px,-3px)}55%{transform:translate(5px,4px)}70%{transform:translate(-3px,2px)}}
.win.nudged{animation:nudge .55s}

/* ===================== 1.5: CLASSIC THEME ===================== */
body.classic{--radius:0}
body.classic .glass{background:#c3c3c3!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
body.classic .win{border-radius:0;padding:3px;background:#c3c3c3;border:0;
  box-shadow:inset -1px -1px 0 #0a0a0a,inset 1px 1px 0 #fff,inset -2px -2px 0 #808080,inset 2px 2px 0 #dfdfdf,3px 3px 8px rgba(0,0,0,.35)}
body.classic .win.max{padding:3px}
body.classic .titlebar{height:20px;flex:0 0 20px;border-radius:0;padding:0 2px 0 4px;
  background:linear-gradient(90deg,#000082,#1084d0)}
body.classic .titlebar::before{display:none}
body.classic .titlebar .sheen{display:none}
body.classic .tt{color:#fff;text-shadow:none;font-weight:700;font-size:11px}
body.classic .win:not(.focused) .titlebar{background:linear-gradient(90deg,#7f7f7f,#b0b0b0)}
body.classic .win:not(.focused) .tt{color:#dcdcdc}
body.classic .wbtn{width:17px;height:15px;border-radius:0;background:#c3c3c3;border:0;
  box-shadow:inset -1px -1px 0 #0a0a0a,inset 1px 1px 0 #fff,inset -2px -2px 0 #808080,inset 2px 2px 0 #dfdfdf}
body.classic .wbtn.x{width:17px;background:#c3c3c3}
body.classic .wbtn i::before,body.classic .wbtn i::after{background:#000}
body.classic .wbtn.x i::before,body.classic .wbtn.x i::after{background:#000;box-shadow:none}
body.classic .wbody{border:0;border-radius:0;box-shadow:inset 1px 1px 0 #808080,inset -1px -1px 0 #fff,inset 2px 2px 0 #0a0a0a}
body.classic #taskbar{background:#c3c3c3;border-top:2px solid #fff;box-shadow:none;height:34px}
body.classic .task{border-radius:0;color:#000;text-shadow:none;background:#c3c3c3;border:0;height:24px;
  box-shadow:inset -1px -1px 0 #0a0a0a,inset 1px 1px 0 #fff,inset -2px -2px 0 #808080,inset 2px 2px 0 #dfdfdf}
body.classic .task.active{background:#b0b0b0;color:#000;
  box-shadow:inset 1px 1px 0 #0a0a0a,inset -1px -1px 0 #fff,inset 2px 2px 0 #808080}
body.classic #tray{background:#c3c3c3;border:0;color:#000;text-shadow:none;border-radius:0;
  box-shadow:inset 1px 1px 0 #808080,inset -1px -1px 0 #fff}
body.classic #orb{width:76px;height:24px;margin:0 6px 0 2px;flex:0 0 76px}
body.classic #orb svg{display:none}
body.classic #orb::after{content:"Start";display:flex;align-items:center;justify-content:center;gap:4px;
  width:100%;height:100%;font-weight:700;font-size:12px;background:#c3c3c3;
  box-shadow:inset -1px -1px 0 #0a0a0a,inset 1px 1px 0 #fff,inset -2px -2px 0 #808080,inset 2px 2px 0 #dfdfdf}
body.classic #start{border-radius:0;background:#c3c3c3;padding:3px;
  box-shadow:inset -1px -1px 0 #0a0a0a,inset 1px 1px 0 #fff,inset -2px -2px 0 #808080,inset 2px 2px 0 #dfdfdf}
body.classic #start .cols{background:#c3c3c3;border-radius:0;box-shadow:none}
body.classic #start .userbar{background:linear-gradient(90deg,#000082,#1084d0);border-radius:0;padding:6px}
body.classic .slink:hover,body.classic .li.sel,body.classic .ml-item.sel,body.classic .mm-c.sel{background:#000082;color:#fff}
body.classic .tbtn,body.classic .pbtn{border-radius:0;border:0;background:#c3c3c3;color:#000;text-shadow:none;
  box-shadow:inset -1px -1px 0 #0a0a0a,inset 1px 1px 0 #fff,inset -2px -2px 0 #808080,inset 2px 2px 0 #dfdfdf}
body.classic .tbtn:active,body.classic .pbtn:active{transform:none;
  box-shadow:inset 1px 1px 0 #0a0a0a,inset -1px -1px 0 #fff,inset 2px 2px 0 #808080}
body.classic .fld{border-radius:0;border:0;box-shadow:inset 1px 1px 0 #808080,inset -1px -1px 0 #fff,inset 2px 2px 0 #0a0a0a}
body.classic .toolbar,body.classic .menubar,body.classic .statusbar,body.classic .sidebar,
body.classic .ss-bar,body.classic .mm-tools{background:#c3c3c3;border-color:#808080}
body.classic .statusbar{box-shadow:inset 1px 1px 0 #808080,inset -1px -1px 0 #fff}
body.classic .ctxmenu{border-radius:0;background:#c3c3c3;
  box-shadow:inset -1px -1px 0 #0a0a0a,inset 1px 1px 0 #fff,inset -2px -2px 0 #808080,inset 2px 2px 0 #dfdfdf}
body.classic .ctxmenu div:hover{background:#000082;border-radius:0}
body.classic #flyout,body.classic .balloon{border-radius:0}
body.classic .dicon span{text-shadow:1px 1px 0 #000}

/* ===================== 1.5: DESKTOP AS A FOLDER ===================== */
#icons{position:absolute;left:0;right:0;top:0;bottom:44px;width:auto;height:auto;padding:10px;overflow:hidden}
.dicon{position:absolute;width:82px}
.dicon.dragging{opacity:.65;z-index:50}
.rubber{position:absolute;border:1px dotted #fff;background:rgba(255,255,255,.18);z-index:3;pointer-events:none}

/* ===================== 1.5: NEW APPS ===================== */
/* calculator */
.cl-disp{margin:8px;padding:8px 10px;text-align:right;font:300 26px "Segoe UI",Tahoma,sans-serif;
  background:#eef4ea;border:1px solid #7f9db9;box-shadow:inset 1px 1px 3px rgba(0,0,0,.18);
  overflow:hidden;white-space:nowrap}
.cl-mem{font-size:10px;color:#5b7a94;text-align:left;height:12px}
.cl-pad{display:grid;gap:4px;padding:0 8px 8px}
.cl-pad button{padding:9px 0;font-size:13px;border:1px solid #8fa9c0;border-radius:3px;cursor:pointer;
  background:linear-gradient(180deg,#fff,#e6eef7 48%,#d6e3f0 52%,#f2f7fc)}
.cl-pad button:hover{border-color:#5b90c4;background:linear-gradient(180deg,#fff,#e2f0ff 48%,#c9e2fb 52%,#eef7ff)}
.cl-pad button:active{transform:translateY(1px)}
.cl-pad button.op{color:#14568f;font-weight:700}
.cl-pad button.eq{background:linear-gradient(180deg,#bfe0ff,#7fb6e2);color:#0d2c47;font-weight:700}
.cl-pad button.fn{font-size:11px;color:#8a3b2a}
/* command prompt */
.cmd-out{flex:1;overflow:auto;background:#000;color:#c8c8c8;padding:8px 10px;
  font:12px/1.45 Consolas,"Courier New",monospace;white-space:pre-wrap;user-select:text}
.cmd-in{display:flex;background:#000;padding:0 10px 8px;font:12px Consolas,monospace}
.cmd-in span{color:#c8c8c8;white-space:pre}
.cmd-in input{flex:1;background:transparent;border:0;outline:none;color:#c8c8c8;font:12px Consolas,monospace}
/* task manager */
.tm-tabs{display:flex;gap:3px;padding:5px 6px 0;background:linear-gradient(180deg,#eef5fc,#dbe9f6)}
.tm-tab{padding:4px 14px;font-size:11px;border:1px solid #a7c0d6;border-bottom:none;border-radius:5px 5px 0 0;
  background:linear-gradient(180deg,#dbe8f4,#c3d7e9);cursor:pointer}
.tm-tab.on{background:linear-gradient(180deg,#fff,#eef6fd);font-weight:700}
.tm-graph{height:92px;border:1px solid #4a6b86;background:#0a2010;position:relative;overflow:hidden}
.tm-graph canvas{width:100%;height:100%;display:block}
.tm-lbl{font-size:11px;color:#3a5a75;margin:8px 0 3px}
/* solitaire */
.sol{flex:1;position:relative;background:radial-gradient(120% 90% at 50% 0%,#1d7a3c,#0d4a24 70%);overflow:hidden}
.card{position:absolute;width:64px;height:90px;border-radius:5px;background:#fff;cursor:default;
  box-shadow:0 1px 3px rgba(0,0,0,.45);border:1px solid #7b8b99;user-select:none;transition:none}
.card .cnr{position:absolute;font:700 13px "Segoe UI",Tahoma,sans-serif;line-height:1}
.card .tl{left:4px;top:3px}
.card .br{right:4px;bottom:3px;transform:rotate(180deg)}
.card .pip{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font-size:26px}
.card.red{color:#c0392b}
.card.black{color:#12222f}
.card.back{background:repeating-linear-gradient(45deg,#2f6fa8 0 6px,#1d4f7c 6px 12px);border-color:#0d3559}
.card.back::after{content:"";position:absolute;inset:5px;border:2px solid rgba(255,255,255,.55);border-radius:3px}
.slot{position:absolute;width:64px;height:90px;border-radius:5px;border:2px dashed rgba(255,255,255,.35)}
.sol-bar{display:flex;gap:6px;align-items:center;padding:5px 8px;
  background:linear-gradient(180deg,#fbfdff,#dfeaf5);border-bottom:1px solid #a9bfd2}
.sol-win{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;background:rgba(4,30,15,.82);color:#eaffea;z-index:20}
/* minesweeper */
.ms-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  padding:10px;background:#c3c3c3;gap:8px}
.ms-panel{display:flex;align-items:center;gap:14px;padding:6px 10px;background:#c3c3c3;
  box-shadow:inset 1px 1px 0 #808080,inset -1px -1px 0 #fff,inset 2px 2px 0 #0a0a0a}
.ms-seg{font:700 20px Consolas,monospace;color:#f33;background:#200;padding:1px 5px;letter-spacing:2px}
.ms-face{width:30px;height:30px;font-size:17px;line-height:1;cursor:pointer;background:#c3c3c3;border:0;
  box-shadow:inset -1px -1px 0 #0a0a0a,inset 1px 1px 0 #fff,inset -2px -2px 0 #808080,inset 2px 2px 0 #dfdfdf}
.ms-grid{display:grid;gap:0;background:#8b8b8b;
  box-shadow:inset 1px 1px 0 #808080,inset -1px -1px 0 #fff,inset 2px 2px 0 #0a0a0a;padding:3px}
.ms-c{width:20px;height:20px;font:700 12px "Segoe UI",Tahoma,sans-serif;line-height:20px;text-align:center;
  background:#c3c3c3;cursor:default;user-select:none;
  box-shadow:inset -1px -1px 0 #808080,inset 1px 1px 0 #fff,inset -2px -2px 0 #a0a0a0,inset 2px 2px 0 #dfdfdf}
.ms-c.open{box-shadow:inset 1px 1px 0 #8b8b8b;background:#c9c9c9}
.ms-c.boom{background:#e2554a}
.ms-c.n1{color:#0000ff}.ms-c.n2{color:#008000}.ms-c.n3{color:#ff0000}.ms-c.n4{color:#000080}
.ms-c.n5{color:#800000}.ms-c.n6{color:#008080}.ms-c.n7{color:#000}.ms-c.n8{color:#808080}
/* camera */
.cam-stage{flex:1;background:#101820;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.cam-stage video,.cam-stage canvas{max-width:100%;max-height:100%;display:block}
.cam-count{position:absolute;font:300 90px "Trebuchet MS",sans-serif;color:#fff;text-shadow:0 4px 20px #000}
.cam-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
@keyframes flash{0%{opacity:.95}100%{opacity:0}}
.cam-flash.on{animation:flash .45s}
.cam-strip{flex:0 0 auto;display:flex;gap:6px;padding:6px;overflow-x:auto;
  background:linear-gradient(180deg,#e9f2fa,#d3e3f1);border-top:1px solid #b7cbdd;min-height:56px}
.cam-strip img{height:44px;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.35);border-radius:2px}
/* dial-up wizard */
.du-lights{display:flex;gap:10px;margin:10px 0}
.du-lights i{width:12px;height:12px;border-radius:50%;background:#3a4a56;box-shadow:inset 0 1px 2px rgba(0,0,0,.6)}
.du-lights i.on{background:radial-gradient(circle at 35% 30%,#c7f5a8,#3fae2a);box-shadow:0 0 8px #4fbf3f}
.du-lights i.amber.on{background:radial-gradient(circle at 35% 30%,#ffe9a3,#e0a220);box-shadow:0 0 8px #e0a220}

/* ===================== 1.6: AERO EVERYWHERE ===================== */
.win.focused{box-shadow:0 16px 44px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.65) inset,
  0 0 0 1px rgba(0,0,0,.4),0 0 26px hsla(var(--accent-h),95%,62%,.32)}
.wbody{background:linear-gradient(180deg,rgba(255,255,255,.97),#fff 90px)}
.menubar{background:linear-gradient(180deg,hsla(var(--accent-h),60%,97%,.96),hsla(var(--accent-h),45%,92%,.9));
  border-bottom:1px solid hsla(var(--accent-h),40%,80%,.9)}
.toolbar{background:linear-gradient(180deg,hsla(var(--accent-h),70%,99%,.98),hsla(var(--accent-h),50%,93%,.92) 48%,
  hsla(var(--accent-h),45%,89%,.92) 52%,hsla(var(--accent-h),60%,96%,.95));
  border-bottom:1px solid hsla(var(--accent-h),35%,76%,.85)}
.statusbar{background:linear-gradient(180deg,hsla(var(--accent-h),50%,98%,.95),hsla(var(--accent-h),40%,92%,.9));
  border-top:1px solid hsla(var(--accent-h),35%,82%,.8)}
.sidebar{background:linear-gradient(180deg,hsla(var(--accent-h),60%,97%,.95),hsla(var(--accent-h),45%,90%,.92))}
.tbtn{background:linear-gradient(180deg,rgba(255,255,255,.98),hsla(var(--accent-h),50%,93%,.95) 48%,
  hsla(var(--accent-h),45%,87%,.95) 52%,hsla(var(--accent-h),60%,96%,.98));
  border-color:hsla(var(--accent-h),35%,68%,.9)}
.tbtn:hover{box-shadow:0 0 8px hsla(var(--accent-h),95%,65%,.5),0 1px 0 #fff inset}
.ctxmenu{background:linear-gradient(180deg,rgba(255,255,255,.9),hsla(var(--accent-h),45%,94%,.86));
  -webkit-backdrop-filter:blur(14px) saturate(150%);backdrop-filter:blur(14px) saturate(150%);
  border-radius:6px;box-shadow:0 10px 30px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.7) inset,0 0 0 1px rgba(0,0,0,.3)}
.dlg .box{background:linear-gradient(180deg,rgba(255,255,255,.96),hsla(var(--accent-h),45%,93%,.94));
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  box-shadow:0 18px 44px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.7) inset}
.balloon{background:linear-gradient(180deg,rgba(255,253,240,.94),hsla(45,70%,88%,.9));
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
::-webkit-scrollbar-thumb{background:linear-gradient(90deg,rgba(255,255,255,.95),
  hsla(var(--accent-h),55%,88%,.95) 48%,hsla(var(--accent-h),50%,80%,.95) 52%,rgba(255,255,255,.9));
  border-color:hsla(var(--accent-h),35%,65%,.8)}
.li.sel,.mm-c.sel,.ml-item.sel{box-shadow:0 1px 0 rgba(255,255,255,.5) inset}

/* taskbar live previews */
.thumb{position:absolute;bottom:44px;z-index:9600;width:212px;padding:6px;border-radius:8px;
  box-shadow:0 14px 34px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.5) inset;pointer-events:none}
.thumb .cap{font-size:11px;color:#0d2237;text-shadow:0 1px 0 rgba(255,255,255,.7);
  padding:2px 4px 5px;display:flex;align-items:center;gap:5px}
.thumb .cap svg{width:14px;height:14px}
.thumb .shot{height:132px;overflow:hidden;background:#fff;border-radius:4px;
  box-shadow:0 0 0 1px rgba(0,0,0,.35);position:relative}
.thumb .shot > div{position:absolute;top:0;left:0;transform-origin:0 0;pointer-events:none}

/* flip switcher */
#flip{position:absolute;inset:0;z-index:9750;display:none;align-items:center;justify-content:center;
  background:rgba(6,20,36,.45);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#flip.on{display:flex}
#flip .rail{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;max-width:86%;padding:16px;
  border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.45) inset}
#flip .fcard{width:190px;border-radius:8px;padding:6px;background:rgba(255,255,255,.22);
  border:1px solid rgba(255,255,255,.4);transition:transform .12s}
#flip .fcard.on{background:rgba(255,255,255,.55);transform:scale(1.06);
  box-shadow:0 0 20px hsla(var(--accent-h),95%,70%,.7)}
#flip .fcard .shot{height:118px;overflow:hidden;background:#fff;border-radius:4px;position:relative}
#flip .fcard .shot > div{position:absolute;top:0;left:0;transform-origin:0 0}
#flip .fcard .cap{font-size:11px;color:#eaf6ff;text-shadow:0 1px 3px rgba(0,0,0,.8);
  padding:5px 2px 1px;display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden}
#flip .fcard .cap svg{width:14px;height:14px}

/* eight-way resizing + docking preview */
.rz{position:absolute;z-index:4}
.rz.n{left:6px;right:6px;top:-2px;height:7px;cursor:ns-resize}
.rz.s{left:6px;right:6px;bottom:-2px;height:7px;cursor:ns-resize}
.rz.w{top:6px;bottom:6px;left:-2px;width:7px;cursor:ew-resize}
.rz.e{top:6px;bottom:6px;right:-2px;width:7px;cursor:ew-resize}
.rz.nw{left:-2px;top:-2px;width:12px;height:12px;cursor:nwse-resize}
.rz.ne{right:-2px;top:-2px;width:12px;height:12px;cursor:nesw-resize}
.rz.sw{left:-2px;bottom:-2px;width:12px;height:12px;cursor:nesw-resize}
.rz.se{right:-2px;bottom:-2px;width:12px;height:12px;cursor:nwse-resize}
.win.max .rz{display:none}
#dock{position:absolute;z-index:95;display:none;border-radius:8px;
  background:hsla(var(--accent-h),85%,70%,.28);border:2px solid hsla(var(--accent-h),90%,80%,.75);
  box-shadow:0 0 30px hsla(var(--accent-h),95%,60%,.5) inset;pointer-events:none;transition:all .1s}
#dock.on{display:block}
body.classic .thumb,body.classic #flip .rail{background:#c3c3c3!important}
body.classic #flip .fcard .cap{color:#000;text-shadow:none}

/* ---------- 1.6 preference effects ---------- */
body.noshadow .win{box-shadow:0 0 0 1px rgba(255,255,255,.5) inset,0 0 0 1px rgba(0,0,0,.35)!important}
body.bigcur, body.bigcur *{cursor:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='36' height='36' viewBox='0 0 36 36'><path d='M4 2l22 15-9 2 6 12-5 2-6-12-8 6z' fill='white' stroke='black' stroke-width='2'/></svg>") 3 2, auto}
body.contrast .glass{background:#000!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
body.contrast .win{background:#000;box-shadow:0 0 0 2px #ffe500 inset,0 0 0 3px #000}
body.contrast .wbody{background:#000;color:#fff}
body.contrast .titlebar{background:#ffe500}
body.contrast .tt{color:#000;text-shadow:none}
body.contrast .menubar,body.contrast .toolbar,body.contrast .statusbar,body.contrast .sidebar,
body.contrast .pane,body.contrast .cp-page,body.contrast .mm-list,body.contrast .ml-list{background:#000;color:#fff;border-color:#ffe500}
body.contrast .tbtn,body.contrast .pbtn{background:#000;color:#ffe500;border:2px solid #ffe500;text-shadow:none}
body.contrast .fld{background:#000;color:#fff;border:2px solid #ffe500}
body.contrast .li.sel,body.contrast .slink:hover,body.contrast .ctxmenu div:hover{background:#ffe500;color:#000}
body.contrast .dicon span{color:#ffe500;text-shadow:1px 1px 0 #000}
body.contrast .ctxmenu{background:#000;color:#fff}
/* taskbar placement */
body.tb-top #taskbar{top:0;bottom:auto;border-top:0;border-bottom:1px solid rgba(255,255,255,.75);
  box-shadow:0 6px 18px rgba(0,0,0,.45)}
body.tb-top #start{bottom:auto;top:44px}
body.tb-top #flyout{bottom:auto;top:44px}
body.tb-top .thumb{bottom:auto;top:44px}
body.tb-top #icons{top:44px;bottom:0}
body.tb-small #taskbar{height:30px}
body.tb-small .task{height:22px;font-size:10px}
body.tb-small #orb{width:44px;height:40px;flex:0 0 44px;margin:-5px 4px -3px -2px}
body.tb-small #tray{height:22px}
body.tb-auto #taskbar{transform:translateY(36px);transition:transform .2s}
body.tb-auto.tb-top #taskbar{transform:translateY(-36px)}
body.tb-auto #taskbar:hover,body.tb-auto #taskbar.up{transform:none}
/* spotlight results */
.sp-group{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:#3a6a99;
  padding:6px 6px 2px;border-top:1px solid #dbe6f0;margin-top:2px}
.sp-group:first-child{border-top:0;margin-top:0}
.sp-hit{display:flex;align-items:center;gap:8px;padding:5px 7px;border-radius:4px;cursor:default;font-size:12px}
.sp-hit svg{width:19px;height:19px;flex:0 0 19px}
.sp-hit .sub{font-size:10px;color:#6b8299;margin-left:auto;white-space:nowrap}
.sp-hit:hover,.sp-hit.on{background:linear-gradient(180deg,hsla(var(--accent-h),90%,72%,.95),hsla(var(--accent-h),85%,55%,.95));color:#fff}
.sp-hit.on .sub,.sp-hit:hover .sub{color:#eaf4ff}
#startLeft{max-height:330px;overflow:auto}

/* disc creator */
.dv-row{display:flex;flex:1;min-height:0}
.dv-side{width:180px;flex:0 0 180px;overflow:auto;padding:6px;
  background:linear-gradient(180deg,hsla(var(--accent-h),60%,97%,.95),hsla(var(--accent-h),45%,90%,.92));
  border-right:1px solid #bcd0e2}
.dv-list{flex:1;overflow:auto;background:#fff}
.dv-item{display:flex;align-items:center;gap:8px;padding:5px 9px;border-bottom:1px solid #eef3f8;font-size:12px}
.dv-item svg{width:18px;height:18px}
.dv-item .sz{margin-left:auto;color:#6b8299;font-size:11px}
.dv-cap{padding:7px 10px;background:linear-gradient(180deg,#f7fbfe,#e6eff8);border-top:1px solid #c8d8e6}
.dv-bar{height:16px;border:1px solid #7f9db9;border-radius:4px;overflow:hidden;background:#eef4fa;margin-top:4px}
.dv-bar i{display:block;height:100%;background:linear-gradient(180deg,#9fe0ff,#2f7fbc)}
.dv-bar i.over{background:linear-gradient(180deg,#ffb3ab,#c0392b)}
.dv-burn{position:absolute;inset:0;background:rgba(8,20,34,.9);color:#dff0ff;z-index:30;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px}
.dv-disc{width:96px;height:96px;border-radius:50%;position:relative;
  background:conic-gradient(from 0deg,#8fd7ff,#c9a6ff,#ffd6a6,#a6ffd0,#8fd7ff);
  box-shadow:0 6px 22px rgba(0,0,0,.6);animation:spin 1.1s linear infinite}
.dv-disc::after{content:"";position:absolute;inset:38px;border-radius:50%;background:#0b1a28;box-shadow:0 0 0 6px rgba(255,255,255,.25)}
.dv-prog{width:280px;height:14px;border:1px solid #4a6b86;border-radius:7px;overflow:hidden;background:#0a1620}
.dv-prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#0d4b7f,#4fc3f7);transition:width .2s}
.dv-buf{display:flex;gap:2px}
.dv-buf i{width:7px;height:12px;background:#1d3548;border-radius:1px}
.dv-buf i.on{background:#4fbf3f;box-shadow:0 0 5px #4fbf3f}
/* address and phone books */
.ab-row{display:flex;flex:1;min-height:0}
.ab-list{width:210px;flex:0 0 210px;overflow:auto;border-right:1px solid #c3d5e5;background:#fff}
.ab-card{flex:1;overflow:auto;padding:14px 16px}
.ab-card .fld{width:100%}
.ab-grid{display:grid;grid-template-columns:96px 1fr;gap:7px;align-items:center;font-size:12px}
.ab-grid .full{grid-column:1 / -1}
.ab-item{padding:6px 10px;border-bottom:1px solid #eef3f8;cursor:default;font-size:12px}
.ab-item:hover{background:hsla(var(--accent-h),85%,70%,.2)}
.ab-item.sel{background:linear-gradient(180deg,hsla(var(--accent-h),85%,62%,.9),hsla(var(--accent-h),80%,48%,.9));color:#fff}
.ab-item .m{font-size:11px;color:#6b8299}
.ab-item.sel .m{color:#e6f2ff}
.ph-keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;width:180px;margin:8px 0}
.ph-keypad button{padding:9px 0;font-size:15px}
.ph-dial{display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="desktop" class="wp-meadow">
  <div id="wall"></div>
  <div id="wall2"></div>
  <div id="icons"></div>
  <div id="dim" style="position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:99400;transition:opacity .3s"></div>
</div>

<div id="start" class="glass">
  <div class="userbar"><div class="avatar" data-hue="40"></div><div class="uname" id="uname">Liam</div></div>
  <div class="cols">
    <div class="left" id="startLeft"></div>
    <div class="right" id="startRight"></div>
  </div>

    <span id="trayIcons"></span>

</div>

<div id="dock"></div>
<div id="flip"><div class="rail glass" id="flipRail"></div></div>
<div id="flyout" class="glass"><div class="inner" id="flyInner"></div></div>
<div id="saver"><canvas id="saverCv"></canvas></div>
<div id="present"></div>

<div id="boot">
  <div class="firmware" id="fw"></div>
  <div id="bootStage">
    <div class="orbwrap"><div class="bloom"></div><div class="assemble" id="bootOrb"></div></div>
    <div class="bootlogo" style="font-size:30px;letter-spacing:4px">Laptop<b>OS</b></div>
    <div class="beads"><i></i><i style="animation-delay:.16s"></i><i style="animation-delay:.32s"></i>
      <i style="animation-delay:.48s"></i><i style="animation-delay:.64s"></i></div>

</div>

<div id="lock" style="display:none">
  <div style="font:300 30px 'Trebuchet MS';text-shadow:0 2px 8px rgba(0,0,0,.5)">LaptopOS <span style="font-size:15px;opacity:.8">1.6</span></div>

    <div style="font-size:13px">Name this account</div>

</div>

  <div class="avatar" data-hue="40"></div>
  <div class="wname" id="wname">Welcome</div>

</div>

<div id="bye"><div class="bootlogo" style="font-size:30px">Shutting down&hellip;</div>
  <div class="boottext">It is now safe to close the lid.</div>
  <button class="pbtn" style="background:#123;border-color:#456" onclick="location.reload()">Power on</button>
</div>

<script>
/* =======================================================================
   ICONS — glossy 2006-style SVG artwork

function ensureDir(path){ if(!FS[path]) FS[path] = {}; return FS[path]; }
function joinPath(dir, name){ return dir.replace(/\\+$/,'') + '\\' + name; }
function parentOf(path){ const i = path.lastIndexOf('\\'); return i>2 ? path.slice(0,i) : 'C:'; }
function baseName(path){ return path.slice(path.lastIndexOf('\\')+1); }
function nodeAt(path){ const par = FS[parentOf(path)]; return par ? par[baseName(path)] : null; }
function isDir(e){ return e && e.type==='dir'; }
function typeName(e){
  return {dir:'File folder', text:'Text document', image:'Picture', audio:'Sound clip',
          sheet:'Sheets workbook', slides:'Slides deck', app:'Application',
          link:'Shortcut', sys:'System folder'}[e.type] || 'File';
}
/* deleting sends things to the bin; deleting inside the bin is final */
function recycle(dir, name){
  const e = FS[dir] && FS[dir][name];
  if(!e) return;
  if(dir === RECYCLE || e.type==='sys'){ removeEntry(dir, name); return; }
  ensureDir(RECYCLE);
  const n = copyEntry(dir, name, RECYCLE);
  if(n){ FS[RECYCLE][n].origin = {dir, name}; FS[RECYCLE][n].deleted = NOW(); delete FS[RECYCLE][n].pos; }
  removeEntry(dir, name);
}
function restoreFromBin(name){
  const e = FS[RECYCLE] && FS[RECYCLE][name];
  if(!e) return false;
  const to = (e.origin && e.origin.dir) || DESKTOP;
  ensureDir(to);
  const want = (e.origin && e.origin.name) || name;
  const n = copyEntry(RECYCLE, name, to, FS[to][want] ? uniqueName(to, want) : want);
  if(n){ delete FS[to][n].origin; delete FS[to][n].deleted; }
  removeEntry(RECYCLE, name);
  return true;
}
const binCount = ()=>Object.keys(FS[RECYCLE]||{}).length;
function sizeOf(e){
  if(!e) return 0;
  if(e.type==='dir') return 0;
  if(e.type==='text') return (e.body||'').length;
  if(e.type==='image') return e.data ? Math.round(e.data.length*0.75) : 24576;
  if(e.type==='audio') return 3_400_000;
  return 8192;
}
const fmtSize = n => n>=1048576 ? (n/1048576).toFixed(1)+' MB' : n>=1024 ? Math.ceil(n/1024)+' KB' : n+' B';
const fmtDate = t => t ? new Date(t).toLocaleString([], {month:'numeric',day:'numeric',year:'2-digit',hour:'numeric',minute:'2-digit'}) : '';
function uniqueName(dir, name){
  const t = FS[dir] || {};
  if(!t[name]) return name;
  const dot = name.lastIndexOf('.'), stem = dot>0?name.slice(0,dot):name, ext = dot>0?name.slice(dot):'';
  let i = 2;
  while(t[stem+' ('+i+')'+ext]) i++;
  return stem+' ('+i+')'+ext;
}
function removeEntry(dir, name){
  const e = FS[dir] && FS[dir][name];
  if(!e) return;
  if(e.type==='dir'){
    const sub = joinPath(dir,name);
    Object.keys(FS[sub]||{}).forEach(n=>removeEntry(sub,n));
    delete FS[sub];
  }
  delete FS[dir][name];
}
function copyEntry(srcDir, name, dstDir, newName){
  const e = FS[srcDir][name]; if(!e) return;
  const n = newName || uniqueName(dstDir, name);
  ensureDir(dstDir);
  if(e.type==='dir'){
    FS[dstDir][n] = {type:'dir', mod:NOW()};
    const from = joinPath(srcDir,name), to = joinPath(dstDir,n);
    ensureDir(to);
    Object.keys(FS[from]||{}).forEach(c=>copyEntry(from, c, to, c));
  }else{
    FS[dstDir][n] = JSON.parse(JSON.stringify(e));
    FS[dstDir][n].mod = NOW();
  }
  return n;
}
function moveEntry(srcDir, name, dstDir){
  if(srcDir===dstDir) return name;
  const n = copyEntry(srcDir, name, dstDir);
  removeEntry(srcDir, name);
  return n;
}
function renameEntry(dir, name, to){
  if(!to || to===name || FS[dir][to]) return false;
  const e = FS[dir][name];
  if(e.type==='dir'){
    const from = joinPath(dir,name), dest = joinPath(dir,to);
    FS[dest] = FS[from]; delete FS[from];
    Object.keys(FS).filter(k=>k.indexOf(from+'\\')===0).forEach(k=>{
      FS[dest + k.slice(from.length)] = FS[k]; delete FS[k];
    });
  }
  FS[dir][to] = e; delete FS[dir][name];
  return true;
}
function searchFS(root, q){
  const hits = [], needle = q.toLowerCase();
  (function walk(dir){
    Object.keys(FS[dir]||{}).forEach(n=>{
      if(n.toLowerCase().includes(needle)) hits.push({dir, name:n});
      if(FS[dir][n].type==='dir') walk(joinPath(dir,n));
    });
  })(root);
  return hits;
}

/* per-account slice of the disk: everything under Documents and Pictures */
function userTree(){
  const out = {};
  Object.keys(FS).forEach(k=>{
    if(k.indexOf("C:\\Documents")===0 || k.indexOf("C:\\Pictures")===0 ||
       k.indexOf(DESKTOP)===0 || k.indexOf(RECYCLE)===0) out[k]=FS[k];
  });
  return out;
}
function loadUserTree(tree){
  Object.keys(FS).forEach(k=>{
    if(k.indexOf("C:\\Documents")===0 || k.indexOf("C:\\Pictures")===0 ||
       k.indexOf(DESKTOP)===0 || k.indexOf(RECYCLE)===0) delete FS[k];
  });
  if(tree && Object.keys(tree).length) Object.assign(FS, tree);
  else seedUserFolders();
}
