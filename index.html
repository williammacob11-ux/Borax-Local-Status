<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WAVE TV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Barlow+Condensed:wght@500;700;800&family=JetBrains+Mono:wght@500&display=swap">
<!--
  WAVE TV — a 24-hour music video channel.
  Edit the SONGS table to change videos, LISTS to change what each block plays,
  and SCHED to change which block airs at each hour (0 = midnight, 23 = 11 PM).
  Blocks switch only when the current video ends, except the 3 PM live news,
  which cuts to music right at 4:00.
  Host it on GitHub Pages (or any https site). YouTube won't play from a file:// page.
-->
<style>
  :root{
    --ink:#f4f1fb;
    --dim:#a19cb8;
    --screen:#000;
    --panel:rgba(10,9,16,.92);
    --line:rgba(244,241,251,.14);
    --accent:#ff2e88;
    --accent-ink:#0a0910;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--screen);color:var(--ink);font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
  [hidden]{display:none!important}
  button{font:inherit;color:inherit}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

  #stage{position:fixed;inset:0;background:var(--screen);overflow:hidden}
  #ytWrap,#newsWrap{position:absolute;inset:0}
  #ytWrap iframe,#newsWrap iframe,#yt{width:100%;height:100%;border:0;display:block}
  #catcher{position:absolute;inset:0;z-index:5;cursor:default}

  /* corner bug */
  .bug{position:absolute;z-index:6;top:calc(env(safe-area-inset-top,0px) + 22px);right:26px;text-align:right;pointer-events:none;opacity:.78}
  .bug-mark{font-family:Bungee,Impact,sans-serif;font-size:clamp(1.3rem,2.6vw,2.1rem);line-height:1;letter-spacing:.02em;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.55)}
  .bug-mark span{color:var(--accent)}
  .bug-live{display:inline-block;margin-top:6px;font-family:"JetBrains Mono",ui-monospace,monospace;font-size:.68rem;letter-spacing:.14em;background:#e0262f;color:#fff;padding:2px 6px}

  /* lower third */
  .lower{position:absolute;z-index:6;left:clamp(16px,5vw,64px);bottom:calc(env(safe-area-inset-bottom,0px) + clamp(40px,9vh,90px));max-width:min(78vw,760px);pointer-events:none;
    opacity:0;transform:translateX(-18px);transition:opacity .45s ease,transform .45s ease;text-shadow:0 2px 12px rgba(0,0,0,.7),0 0 2px rgba(0,0,0,.9)}
  .lower.show{opacity:1;transform:none}
  .lt-tag{display:inline-block;font-family:"JetBrains Mono",ui-monospace,monospace;font-size:clamp(.66rem,1.1vw,.8rem);letter-spacing:.14em;text-transform:uppercase;background:var(--accent);color:var(--accent-ink);padding:3px 8px;margin-bottom:8px;text-shadow:none}
  .lt-artist{font-weight:800;font-size:clamp(1.5rem,3.6vw,2.8rem);line-height:1;text-transform:uppercase;letter-spacing:.01em}
  .lt-title{font-weight:500;font-size:clamp(1.2rem,2.7vw,2.1rem);line-height:1.1;margin-top:4px}

  /* block ident */
  .ident{position:absolute;inset:0;z-index:8;display:grid;place-items:center;background:rgba(0,0,0,.82);pointer-events:none;opacity:0;visibility:hidden;transition:opacity .35s ease,visibility 0s linear .35s}
  .ident.on{opacity:1;visibility:visible;transition:opacity .25s ease}
  .id-band{background:var(--accent);color:var(--accent-ink);transform:rotate(-4deg) scaleX(.2);padding:clamp(18px,3vw,34px) clamp(24px,6vw,80px);text-align:center;transition:transform .55s cubic-bezier(.2,.9,.2,1.15)}
  .ident.on .id-band{transform:rotate(-4deg) scaleX(1)}
  .id-small{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:clamp(.7rem,1.3vw,.95rem);letter-spacing:.24em;text-transform:uppercase}
  .id-big{font-family:Bungee,Impact,sans-serif;font-size:clamp(2.4rem,10vw,7.5rem);line-height:.95;margin:8px 0 10px;text-wrap:balance}
  .id-time{font-weight:700;font-size:clamp(1rem,2vw,1.5rem);letter-spacing:.06em;text-transform:uppercase}

  /* slate (news offline / playback trouble) */
  .slate{position:absolute;z-index:7;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,560px);background:var(--panel);border:1px solid var(--line);padding:22px 24px;text-align:center}
  .slate h2{margin:0 0 6px;font-weight:800;font-size:1.6rem;text-transform:uppercase;letter-spacing:.02em}
  .slate p{margin:0;color:var(--dim);font-size:1.15rem;line-height:1.35}

  /* control bar */
  .bar{position:absolute;z-index:9;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 18px;
    padding:28px clamp(16px,3vw,32px) calc(env(safe-area-inset-bottom,0px) + 16px);background:linear-gradient(to top,rgba(0,0,0,.88),rgba(0,0,0,0));
    opacity:0;transform:translateY(12px);transition:opacity .3s ease,transform .3s ease;pointer-events:none}
  .bar.show{opacity:1;transform:none;pointer-events:auto}
  .bar-btns{display:flex;flex-wrap:wrap;gap:8px}
  .btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);padding:7px 14px;font-weight:700;font-size:1.05rem;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
  .btn:hover{background:rgba(255,255,255,.2)}
  .btn kbd{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:.7rem;opacity:.6;margin-left:6px}
  .bar-now{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  .now-label{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:.72rem;letter-spacing:.16em;color:var(--accent)}
  .now-name{font-weight:800;font-size:1.3rem;text-transform:uppercase}
  .clock{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:1.1rem;font-variant-numeric:tabular-nums}

  /* guide */
  .guide{position:absolute;z-index:10;top:0;right:0;bottom:0;width:min(100vw,440px);background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;
    padding:calc(env(safe-area-inset-top,0px) + 20px) 20px calc(env(safe-area-inset-bottom,0px) + 16px)}
  .g-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
  .g-head h2{margin:0;font-family:Bungee,Impact,sans-serif;font-weight:400;font-size:1.5rem}
  .g-now{border:1px solid var(--line);padding:12px 14px;margin-bottom:14px}
  .g-now .k{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:.7rem;letter-spacing:.16em;color:var(--accent);text-transform:uppercase}
  .g-now .v{font-weight:700;font-size:1.25rem;line-height:1.2;margin-top:2px}
  .g-now ol{margin:8px 0 0;padding-left:1.3em;color:var(--dim);font-size:1.05rem;line-height:1.35}
  .g-list{list-style:none;margin:0;padding:0;overflow-y:auto;flex:1;border-top:1px solid var(--line)}
  .g-row{display:grid;grid-template-columns:5.2rem 1fr auto;gap:10px;align-items:baseline;padding:9px 6px;border-bottom:1px solid var(--line)}
  .g-row.past{opacity:.45}
  .g-row.now{background:color-mix(in srgb,var(--rowc) 20%,transparent)}
  .g-time{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:.82rem;color:var(--dim);font-variant-numeric:tabular-nums}
  .g-name{font-weight:700;font-size:1.2rem;line-height:1.15}
  .g-name small{display:block;font-weight:500;font-size:.95rem;color:var(--dim)}
  .g-pill{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:.64rem;letter-spacing:.12em;padding:2px 6px;background:var(--rowc);color:var(--accent-ink)}
  .g-dot{width:10px;height:10px;border-radius:50%;background:var(--rowc);align-self:center}

  /* power-on screen */
  .power{position:absolute;inset:0;z-index:20;display:grid;place-items:center;background:
    radial-gradient(ellipse at 50% 38%,color-mix(in srgb,var(--accent) 22%,#000) 0%,#000 62%);padding:24px 16px}
  .p-inner{text-align:center;max-width:640px}
  .p-logo{font-family:Bungee,Impact,sans-serif;font-size:clamp(4.5rem,20vw,11rem);line-height:.9;color:#fff;letter-spacing:.01em}
  .p-logo span{color:var(--accent)}
  .p-tag{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:clamp(.7rem,1.8vw,.9rem);letter-spacing:.28em;text-transform:uppercase;color:var(--dim);margin:10px 0 26px}
  .p-on{font-size:clamp(1.2rem,3.2vw,1.6rem);font-weight:500;margin-bottom:22px}
  .p-on b{font-weight:800;text-transform:uppercase;color:var(--accent)}
  .p-btn{background:var(--accent);color:var(--accent-ink);border:0;font-family:Bungee,Impact,sans-serif;font-size:clamp(1.2rem,3vw,1.6rem);padding:14px 34px;cursor:pointer;transition:transform .15s ease}
  .p-btn:hover{transform:scale(1.04)}
  .p-btn[disabled]{opacity:.55;cursor:wait;transform:none}
  .p-warn{margin:22px auto 0;max-width:460px;color:#ffcf5a;font-size:1.1rem;line-height:1.35}

  @media (max-width:520px){
    .bug{right:16px}
    .bar-now{width:100%;justify-content:space-between}
  }
  @media (prefers-reduced-motion:reduce){
    .lower,.bar,.ident,.id-band,.p-btn{transition:none!important}
    .ident.on .id-band,.id-band{transform:rotate(-4deg)}
  }
</style>
</head>

<div id="stage">
  <div id="ytWrap"><div id="yt"></div></div>
  <div id="newsWrap" hidden></div>

  <div id="slate" class="slate" hidden>
    <h2 id="slateTitle"></h2>
    <p id="slateText"></p>
  </div>

  <div class="bug" aria-hidden="true">
    <div class="bug-mark">WAV<span>E</span></div>
    <div id="bugLive" class="bug-live" hidden>LIVE</div>
  </div>

  <div id="lower" class="lower" aria-live="polite">
    <div id="ltTag" class="lt-tag"></div>
    <div id="ltArtist" class="lt-artist"></div>
    <div id="ltTitle" class="lt-title"></div>
  </div>

  <div id="ident" class="ident" aria-hidden="true">
    <div class="id-band">
      <div class="id-small">Now on WAVE</div>
      <div id="idBig" class="id-big"></div>
      <div id="idTime" class="id-time"></div>
    </div>
  </div>

  <div id="catcher"></div>

  <div id="bar" class="bar">
    <div class="bar-btns">
      <button id="btnGuide" class="btn" type="button">Guide<kbd>G</kbd></button>
      <button id="btnSound" class="btn" type="button">Sound on<kbd>M</kbd></button>
      <button id="btnFull" class="btn" type="button">Full screen<kbd>F</kbd></button>
    </div>
    <div class="bar-now">
      <span class="now-label">ON NOW</span>
      <span id="nowName" class="now-name"></span>
      <span id="clock" class="clock"></span>
    </div>
  </div>

  <aside id="guide" class="guide" hidden aria-label="Channel guide">
    <div class="g-head">
      <h2>Today on WAVE</h2>
      <button id="btnGuideClose" class="btn" type="button">Close</button>
    </div>
    <div class="g-now">
      <div class="k">Playing now</div>
      <div id="gNow" class="v"></div>
      <div class="k" style="margin-top:10px">Coming up in this block</div>
      <ol id="gNext"></ol>
    </div>
    <ul id="gList" class="g-list"></ul>
  </aside>

  <div id="power" class="power">
    <div class="p-inner">
      <div class="p-logo">WAV<span>E</span></div>
      <div class="p-tag">Music videos · 24 hours</div>
      <div class="p-on">On now: <b id="pNow"></b> <span id="pRange"></span></div>
      <button id="btnTune" class="p-btn" type="button" disabled>Loading…</button>
      <p id="pWarn" class="p-warn" hidden>This page is open as a local file, so YouTube will refuse to play the videos. Upload it to GitHub Pages (or any https site) and open it from there.</p>
    </div>
  </div>
</div>

/* ---------- LISTS: what each block plays, in order ---------- */
const NINETIES_TAIL = ["wannabe","babyone","missyou","smallthings","wantit","believe","barbie","iris","linger","zombie","oops","remember","blackwhite","mustbelove","allstar","alwaysWhitney","neonmoon"];
const EIGHTIES = ["islabonita","eclipse","gloria","heaven","billiejean","prayer","materialgirl","runningup","beatit","thriller","bornusa","takeonme","winner","ninetofive","hero","humannature","africa","timeafter","girlsfun","mirror","pressure","maneater","paradise","karma","radiostar","everybreath","everywhere"];
const LISTS = {
  n90a: ["teen","aboutgirl","blackhole","creep"].concat(NINETIES_TAIL),
  n90b: NINETIES_TAIL,
  n00: ["toxic","umbrella","pokerface","badromance","hips","empire","brightside","numb","wannabe","slimshady","byebye","riptide","timber","gottafeeling","smallthings","sinceu","tiktok"],
  country: ["ninetofive","jolene","islands","alwaysDolly","coat","survivor","countryroads","mymaria","neonmoon","needyounow","fearless","dearjohn","mean","barsong","somehelp","lovestory","wagonwheel","december","chickenfried","bootscootin"],
  modern: ["ophelia","choosintexas","knewit","thecure","fatherfigure","backtofriends"],
  n70: ["dreams","gypsy","bohemian","stayinalive","hotelcal","jolene","dancingqueen","pianoman","rockwithyou","richgirl","burninglove","morethanfeeling","boogie"],
  n80: EIGHTIES,
  top25: ["diewithsmile","luther","barsong","losecontrol","birds","beautiful","ordinary","somehelp","apt","pinkpony"],
  top24: ["espresso","notlikeus","somehelp","barsong","birds","beautiful","losecontrol"],
  upbeat: ["gottafeeling","bestday","stayinalive","boy","tiger","justagirl","countdown"],
  night: ["midnightcity","blinding","nightcall","dreams","yellow","summertime","linger","wannaknow","oceaneyes","everywhere","royals","asitwas","instantcrush","smoothop","everybreath","church","timeafter","backtofriends"]
};
/* 7 PM Random Mix = every song from the daytime blocks, shuffled fresh each day */
LISTS.random = [...new Set(["n90a","n00","country","modern","n70","n80","top25","top24","upbeat"].flatMap(k=>LISTS[k]))];

/* ---------- BLOCKS: label + color ---------- */
const BLOCKS = {
  night:{label:"Overnight Mix",color:"#7d86ff"},
  n90a:{label:"90s",color:"#ff2e88"},
  n90b:{label:"90s",color:"#ff2e88"},
  n00:{label:"2000s",color:"#29e0ff"},
  country:{label:"Country",color:"#ffb627"},
  modern:{label:"Modern Day Jams",color:"#b98cff"},
  n70:{label:"70s",color:"#ff8a3d"},
  n80:{label:"80s",color:"#ff4fd8"},
  news:{label:"FOX 7 Austin Live",color:"#ff3b3b"},
  top25:{label:"Best of 2025",color:"#ffe14d"},
  top24:{label:"Best of 2024",color:"#3cffd0"},
  random:{label:"Random Mix",color:"#f4f1fb"},
  upbeat:{label:"Upbeat Jams",color:"#ff5e3a"}
};

/* ---------- SCHED: hour (0–23) -> block. Midnight–9 AM is the overnight mix. ---------- */
const SCHED = {9:"n90a",10:"n00",11:"country",12:"modern",13:"n70",14:"n80",15:"news",16:"n90b",17:"top25",18:"top24",19:"random",20:"n80",21:"n90a",22:"n00",23:"upbeat"};
const OVERNIGHT_END = 9;

const FOX7_CHANNEL = "UC5maSolHQX9er0BOxrzjMwA"; /* FOX 7 Austin on YouTube */
const AVG_SONG = 225; /* seconds, used to pick where you "tune in" mid-block */

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,"0");
function h12(h){ const hh=h%24; return {n: hh%12||12, ap: hh<12?"AM":"PM"}; }
function hourText(h){ const t=h12(h); return `${t.n}:00 ${t.ap}`; }
function clockText(d){ const t=h12(d.getHours()); return `${t.n}:${pad(d.getMinutes())} ${t.ap}`; }
function dateKey(d){ return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`; }
function hash(s){ let h=2166136261; for(const c of s){ h^=c.charCodeAt(0); h=Math.imul(h,16777619); } return h>>>0; }
function rng(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function shuffle(arr,seedStr){ const a=arr.slice(), r=rng(hash(seedStr)); for(let i=a.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function slotAt(date){
  const h=date.getHours();
  if(h<OVERNIGHT_END) return {id:"night", key:"night", start:0, end:OVERNIGHT_END};
  return {id:"h"+h, key:SCHED[h], start:h, end:h+1};
}
function slotName(s){
  if(s.key==="night"||s.key==="news") return BLOCKS[s.key].label;
  return `${BLOCKS[s.key].label} @ ${h12(s.start).n}`;
}
function slotRange(s){ return `${hourText(s.start)} – ${hourText(s.end)}`; }
function buildList(s,date){
  if(s.key==="night") return shuffle(LISTS.night,"night"+dateKey(date));
  if(s.key==="random") return shuffle(LISTS.random,"random"+dateKey(date));
  if(s.key==="news") return [];
  return LISTS[s.key].slice();
}

/* ---------- state ---------- */
let player=null, playerReady=false, pendingTune=false, tunedIn=false;
let newsPlayer=null, newsTimer=null;
let cur=null;            /* {id,key,start,end,list,idx,fallback} */
let nowKey=null, startOff=0, errStreak=0, muted=false;
let identTimer=null, slateTimer=null, barTimer=null;

/* ---------- YouTube ---------- */
(function(){ const s=document.createElement("script"); s.src="https://www.youtube.com/iframe_api"; document.head.appendChild(s); })();

window.onYouTubeIframeAPIReady = function(){
  player = new YT.Player("yt",{
    width:"100%", height:"100%",
    playerVars:{autoplay:1,controls:0,disablekb:1,fs:0,iv_load_policy:3,modestbranding:1,rel:0,playsinline:1,origin:location.origin},
    events:{
      onReady:()=>{ playerReady=true; const b=$("btnTune"); b.disabled=false; b.textContent="Tune in"; if(pendingTune) tuneIn(); },
      onStateChange:e=>{
        if(e.data===YT.PlayerState.PLAYING){ errStreak=0; hideSlate(); }
        if(e.data===YT.PlayerState.ENDED) advance();
      },
      onError:()=>{
        errStreak++;
        if(errStreak>=6){ showSlate("Videos won't load","YouTube is refusing to play here. Open this page from GitHub Pages or another https site, then reload."); return; }
        setTimeout(advance,900);
      }
    }
  });
};

/* ---------- playback ---------- */
function startSlot(join){
  const now=new Date(), s=slotAt(now);
  teardownNews();
  cur={...s, list:buildList(s,now), idx:0, fallback:false};
  applyAccent(BLOCKS[s.key].color);
  showIdent(s);
  updateBar();
  if(s.key==="news"){ startNews(); return; }
  let off=0;
  if(join){
    const startDate=new Date(now.getFullYear(),now.getMonth(),now.getDate(),s.start,0,0);
    const el=Math.max(0,(now-startDate)/1000);
    cur.idx=Math.floor(el/AVG_SONG)%cur.list.length;
    off=Math.min(Math.floor(el%AVG_SONG),170);
    if(off<10) off=0;
  }
  playCurrent(off);
}

function playCurrent(off){
  $("ytWrap").hidden=false; $("bugLive").hidden=true;
  nowKey=cur.list[cur.idx]; startOff=off||0;
  hideLower();
  player.loadVideoById({videoId:SONGS[nowKey][2], startSeconds:startOff});
  if(muted) player.mute(); else player.unMute();
  updateBar();
}

/* Called when a video ends: switch blocks only here, so songs never get cut off. */
function advance(){
  if(!cur) return;
  const s=slotAt(new Date());
  if(s.id!==cur.id){ startSlot(false); return; }
  if(cur.key==="news" && !cur.fallback) return;
  cur.idx=(cur.idx+1)%cur.list.length;
  playCurrent(0);
}

function startNews(){
  try{ player.stopVideo(); }catch(e){}
  $("ytWrap").hidden=true; $("bugLive").hidden=false;
  nowKey=null; hideLower();
  const wrap=$("newsWrap");
  const f=document.createElement("iframe");
  f.src=`https://www.youtube.com/embed/live_stream?channel=${FOX7_CHANNEL}&autoplay=1&controls=0&playsinline=1&rel=0&enablejsapi=1&origin=${encodeURIComponent(location.origin)}`;
  f.allow="autoplay; encrypted-media; picture-in-picture";
  f.title="FOX 7 Austin live";
  wrap.appendChild(f); wrap.hidden=false;
  let playing=false;
  newsPlayer=new YT.Player(f,{events:{
    onReady:e=>{ if(muted) e.target.mute(); else e.target.unMute(); e.target.playVideo(); },
    onStateChange:e=>{ if(e.data===YT.PlayerState.PLAYING){ playing=true; showNewsLower(); } },
    onError:()=>newsFailed()
  }});
  newsTimer=setTimeout(()=>{ if(!playing) newsFailed(); },25000);
}

function newsFailed(){
  if(!cur || cur.key!=="news" || cur.fallback) return;
  teardownNews();
  cur.fallback=true;
  cur.list=shuffle(LISTS.random,"newsfallback"+dateKey(new Date()));
  cur.idx=0;
  showSlate("FOX 7 is offline",`The live stream isn't available right now. Random Mix until ${hourText(cur.end)}.`,6000);
  updateBar();
  playCurrent(0);
}

function teardownNews(){
  clearTimeout(newsTimer); newsTimer=null;
  try{ if(newsPlayer) newsPlayer.destroy(); }catch(e){}
  newsPlayer=null;
  const w=$("newsWrap"); w.innerHTML=""; w.hidden=true;
  $("bugLive").hidden=true;
}

/* ---------- on-screen graphics ---------- */
function applyAccent(c){ $("stage").style.setProperty("--accent",c); document.documentElement.style.setProperty("--accent",c); }

function showIdent(s){
  $("idBig").textContent=slotName(s);
  $("idTime").textContent=slotRange(s);
  const el=$("ident"); el.classList.add("on");
  clearTimeout(identTimer); identTimer=setTimeout(()=>el.classList.remove("on"),3600);
}

function setLower(tag,artist,title){
  $("ltTag").textContent=tag; $("ltArtist").textContent=artist; $("ltTitle").textContent=title;
  $("lower").classList.add("show");
}
function hideLower(){ $("lower").classList.remove("show"); }

function showNewsLower(){
  setLower("Live","FOX 7 Austin","Live news from Austin");
  setTimeout(()=>{ if(cur && cur.key==="news" && !cur.fallback) hideLower(); },9000);
}

function introTag(){
  if(cur.fallback) return "Random Mix";
  if(cur.key==="top25"||cur.key==="top24") return `#${cur.idx+1} · ${BLOCKS[cur.key].label}`;
  return slotName(cur);
}

function upNext(){
  let d=0,t=0; try{ d=player.getDuration(); t=player.getCurrentTime(); }catch(e){}
  const endsAt=new Date(Date.now()+Math.max(0,d-t)*1000);
  const s=slotAt(endsAt);
  if(s.id!==cur.id) return {tag:"Coming up", a:slotName(s), b:slotRange(s)};
  const k=cur.list[(cur.idx+1)%cur.list.length];
  return {tag:"Up next", a:SONGS[k][0], b:`"${SONGS[k][1]}"`};
}

let slateSticky=false;
function showSlate(title,text,ms){
  $("slateTitle").textContent=title; $("slateText").textContent=text; $("slate").hidden=false;
  clearTimeout(slateTimer); slateSticky=!ms;
  if(ms) slateTimer=setTimeout(()=>{ $("slate").hidden=true; },ms);
}
/* a video started playing: clear only the "videos won't load" message */
function hideSlate(){ if(slateSticky){ $("slate").hidden=true; slateSticky=false; } }

function updateBar(){
  const s = cur || slotAt(new Date());
  $("nowName").textContent = cur && cur.fallback ? "Random Mix" : slotName(s);
  $("clock").textContent = clockText(new Date());
}

/* ---------- guide ---------- */
function openGuide(){
  const now=new Date(), h=now.getHours();
  const rows=[{start:0,end:OVERNIGHT_END,key:"night"}];
  for(let i=OVERNIGHT_END;i<24;i++) rows.push({start:i,end:i+1,key:SCHED[i]});
  $("gList").innerHTML=rows.map(r=>{
    const isNow = h>=r.start && h<r.end, past = h>=r.end;
    const s={...r,id:""};
    const meta = r.key==="news" ? "Live stream" : r.key==="night"||r.key==="random" ? `${LISTS[r.key].length} videos, shuffled` : `${LISTS[r.key].length} videos`;
    const tt=h12(r.start);
    return `<li class="g-row${isNow?" now":""}${past?" past":""}" style="--rowc:${BLOCKS[r.key].color}">
      <span class="g-time">${tt.n}:00 ${tt.ap}</span>
      <span class="g-name">${slotName(s)}<small>${meta}</small></span>
      ${isNow?'<span class="g-pill">ON NOW</span>':'<span class="g-dot"></span>'}
    </li>`;
  }).join("");
  if(cur && nowKey){
    const k=SONGS[nowKey];
    $("gNow").textContent=`${k[0]} – ${k[1]}`;
    const n=[]; for(let i=1;i<=3 && i<cur.list.length;i++){ const x=SONGS[cur.list[(cur.idx+i)%cur.list.length]]; n.push(`<li>${x[0]} – ${x[1]}</li>`); }
    $("gNext").innerHTML=n.join("");
  } else if(cur && cur.key==="news"){
    $("gNow").textContent="FOX 7 Austin – live news";
    $("gNext").innerHTML=`<li>${slotName(slotAt(new Date(Date.now()+3600e3)))} at ${hourText(cur.end)}</li>`;
  } else {
    $("gNow").textContent="Nothing yet – tune in first";
    $("gNext").innerHTML="";
  }
  $("guide").hidden=false;
  const nowRow=$("gList").querySelector(".now"); if(nowRow) nowRow.scrollIntoView({block:"center"});
  showBar(true);
}
function closeGuide(){ $("guide").hidden=true; showBar(); }
function toggleGuide(){ $("guide").hidden ? openGuide() : closeGuide(); }

/* ---------- controls ---------- */
function showBar(stay){
  const b=$("bar"); b.classList.add("show");
  clearTimeout(barTimer);
  if(!stay) barTimer=setTimeout(()=>{ if($("guide").hidden) b.classList.remove("show"); },3200);
}
function toggleMute(){
  muted=!muted;
  try{ muted ? player.mute() : player.unMute(); }catch(e){}
  try{ if(newsPlayer) (muted ? newsPlayer.mute() : newsPlayer.unMute()); }catch(e){}
  $("btnSound").firstChild.textContent = muted ? "Muted" : "Sound on";
  showBar();
}
function toggleFull(){
  const st=$("stage");
  try{
    if(document.fullscreenElement) document.exitFullscreen();
    else if(st.requestFullscreen) st.requestFullscreen().catch(()=>{});
  }catch(e){}
}

function tuneIn(){
  if(!playerReady){ pendingTune=true; return; }
  if(tunedIn) return;
  tunedIn=true;
  $("power").hidden=true;
  startSlot(true);
  showBar();
}

/* ---------- clock tick ---------- */
setInterval(()=>{
  updateBar();
  if(!cur) return;
  /* live news is the one thing that cuts at the top of the hour */
  if(cur.key==="news" && !cur.fallback){
    if(slotAt(new Date()).id!==cur.id) startSlot(false);
    return;
  }
  if(!playerReady || !nowKey) return;
  let st=-1,t=0,d=0;
  try{ st=player.getPlayerState(); t=player.getCurrentTime(); d=player.getDuration(); }catch(e){ return; }
  if(st!==1) return;
  const s=SONGS[nowKey];
  if(t>=startOff+3 && t<startOff+11){ setLower(introTag(), s[0], `"${s[1]}"`); }
  else if(d>30 && d-t<=16 && d-t>1.5){ const n=upNext(); setLower(n.tag, n.a, n.b); }
  else hideLower();
},500);

/* ---------- wiring ---------- */
$("btnTune").addEventListener("click",tuneIn);
$("btnGuide").addEventListener("click",toggleGuide);
$("btnGuideClose").addEventListener("click",closeGuide);
$("btnSound").addEventListener("click",toggleMute);
$("btnFull").addEventListener("click",toggleFull);
$("catcher").addEventListener("mousemove",()=>showBar());
$("catcher").addEventListener("click",()=>{ if(!$("guide").hidden) closeGuide(); else showBar(); });
$("bar").addEventListener("mousemove",()=>showBar());
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT") return;
  const k=e.key.toLowerCase();
  if(!tunedIn && (k==="enter"||k===" ")){ e.preventDefault(); tuneIn(); return; }
  if(k==="g") toggleGuide();
  else if(k==="m") toggleMute();
  else if(k==="f") toggleFull();
  else if(k==="escape") closeGuide();
});

/* power-on screen */
(function initPower(){
  const s=slotAt(new Date());
  applyAccent(BLOCKS[s.key].color);
  $("pNow").textContent=slotName(s);
  $("pRange").textContent="· until "+hourText(s.end);
  if(location.protocol==="file:") $("pWarn").hidden=false;
  updateBar();
})();
</script>
</body>
