/* =======================================================================
   WINDOW MANAGER
   ======================================================================= */
let Z = 100, WID = 0;
const WINS = {};
const desktop = document.getElementById('desktop');
const tasksEl = document.getElementById('tasks');

function openApp(id, arg){
  const def = APPS[id];
  if(!def) return;
  if(def.single){
    const ex = Object.values(WINS).find(w=>w.app===id);
    if(ex){ if(arg && def.reuse) def.reuse(ex, arg); restore(ex); return ex; }
  }
  const w = {id:'w'+(++WID), app:id, min:false, max:false};
  const el = document.createElement('div');
  el.className = 'win glass';
  const wide = Math.min(def.w||620, window.innerWidth-40);
  const tall = Math.min(def.h||430, window.innerHeight-90);
  el.style.width = wide+'px'; el.style.height = tall+'px';
  el.style.left = Math.max(10, Math.round((window.innerWidth-wide)/2 + (WID%6)*22 - 60))+'px';
  el.style.top  = Math.max(10, Math.round((window.innerHeight-tall)/2 + (WID%6)*18 - 70))+'px';
  el.innerHTML =
    '<div class="titlebar"><div class="sheen"></div>'+I[def.icon]+'<div class="tt">'+def.title+'</div>'+
    '<div class="wbtns"><div class="wbtn min"><i></i></div><div class="wbtn mx"><i></i></div>'+
    '<div class="wbtn x"><i></i></div></div></div>'+
    '<div class="wbody"></div><div class="grip"></div>'+
    ['n','s','w','e','nw','ne','sw','se'].map(d=>'<div class="rz '+d+'" data-rz="'+d+'"></div>').join('');
  desktop.appendChild(el);
  w.el = el; w.body = el.querySelector('.wbody'); w.titleEl = el.querySelector('.tt');
  WINS[w.id] = w;

  el.querySelector('.wbtn.min').onclick = e=>{e.stopPropagation();minimize(w)};
  el.querySelector('.wbtn.mx').onclick  = e=>{e.stopPropagation();toggleMax(w)};
  el.querySelector('.wbtn.x').onclick   = e=>{e.stopPropagation();closeWin(w)};
  el.querySelector('.titlebar').addEventListener('dblclick', ()=>toggleMax(w));
  el.addEventListener('pointerdown', ()=>focusWin(w), true);
  dragify(w, el.querySelector('.titlebar'));
  resizify(w, el.querySelector('.grip'));
  el.querySelectorAll('[data-rz]').forEach(h=>edgeResize(w, h, h.dataset.rz));

  // taskbar button
  const t = document.createElement('div');
  t.className='task pop'; t.innerHTML = I[def.icon]+'<span>'+def.title+'</span>';
  setTimeout(()=>t.classList.remove('pop'), 340);
  t.onclick = ()=>{ hideThumb(); if(w.min) restore(w); else if(w.focused) minimize(w); else focusWin(w); };
  t.onpointerenter = ()=>showThumb(w, t);
  t.onpointerleave = hideThumb;
  t.oncontextmenu = ev=>{
    ev.preventDefault(); hideThumb();
    ctx(ev.clientX, ev.clientY, [
      {label:'Restore', run:()=>restore(w)},
      {label:w.max?'Unmaximise':'Maximise', run:()=>toggleMax(w)},
      {label:'Minimise', run:()=>minimize(w)},
      '-',
      {label:'Close', run:()=>closeWin(w)}
    ]);
  };
  tasksEl.appendChild(t); w.task = t;

  def.init(w, arg);
  focusWin(w);
  return w;
}
function focusWin(w){
  Object.values(WINS).forEach(x=>{x.focused=false;x.el.classList.remove('focused');x.task.classList.remove('active')});
  w.focused=true; w.el.classList.add('focused'); w.task.classList.add('active');
  w.el.style.zIndex = ++Z;
  if(w.min) restore(w);
}
function minimize(w){
  w.focused=false; w.task.classList.remove('active');
  if(SETTINGS.anim){
    w.el.classList.add('mining');
    setTimeout(()=>{ w.el.classList.remove('mining'); w.min=true; w.el.classList.add('min'); }, 190);
  }else{ w.min=true; w.el.classList.add('min'); }
}
function restore(w){
  w.min=false; w.el.classList.remove('min');
  if(SETTINGS.anim){ w.el.classList.add('restoring'); setTimeout(()=>w.el.classList.remove('restoring'), 240); }
  focusWin(w);
}
function toggleMax(w){
  w.max=!w.max;
  if(SETTINGS.anim){ w.el.classList.add('zoom'); setTimeout(()=>w.el.classList.remove('zoom'), 260); }
 
  if(w.max){
    w.prev = {l:w.el.style.left,t:w.el.style.top,wd:w.el.style.width,h:w.el.style.height};
    Object.assign(w.el.style,{left:'0px',top:'0px',width:'100%',height:'calc(100% - 40px)'});
    w.el.classList.add('max');
  }else{
    Object.assign(w.el.style,{left:w.prev.l,top:w.prev.t,width:w.prev.wd,height:w.prev.h});
    w.el.classList.remove('max');
  }
  if(w.onResize) w.onResize();
}
function closeWin(w){
  hideThumb();
  if(w.onClose) w.onClose();
  w.task.remove(); delete WINS[w.id];
  if(SETTINGS.anim){ w.el.classList.add('closing'); setTimeout(()=>w.el.remove(), 160); }
  else w.el.remove();
}
function dragify(w, handle){
  handle.addEventListener('pointerdown', e=>{
    if(e.target.closest('.wbtn')||w.max) return;
    const r = w.el.getBoundingClientRect();
    let ox=e.clientX-r.left, oy=e.clientY-r.top;
    handle.setPointerCapture(e.pointerId);
    w.el.classList.add('moving');
    let zone = null;
    const move = ev=>{
      if(w.max && !w.undocking){
        w.undocking = true;
        toggleMax(w);
        const nr = w.el.getBoundingClientRect();
        ox = Math.min(nr.width-40, ox);
      }
      w.el.style.left = Math.min(window.innerWidth-60, Math.max(-r.width+80, ev.clientX-ox))+'px';
      w.el.style.top  = Math.min(window.innerHeight-60, Math.max(0, ev.clientY-oy))+'px';
      zone = dockZone(ev.clientX, ev.clientY);
      const d = dockEl();
      if(zone){
        d.classList.add('on');
        Object.assign(d.style, {left:zone.l+'px', top:zone.t+'px', width:zone.w+'px', height:zone.h+'px'});
      }else d.classList.remove('on');
    };
    const up = ()=>{
      w.el.classList.remove('moving');
      w.undocking = false;
      dockEl().classList.remove('on');
      if(zone){
        if(zone.kind==='max'){ if(!w.max) toggleMax(w); }
        else{
          w.dockPrev = {l:w.el.style.left,t:w.el.style.top,wd:w.el.style.width,h:w.el.style.height};
          if(SETTINGS.anim){ w.el.classList.add('zoom'); setTimeout(()=>w.el.classList.remove('zoom'),260); }
          Object.assign(w.el.style, {left:zone.l+'px', top:zone.t+'px', width:zone.w+'px', height:zone.h+'px'});
          if(w.onResize) w.onResize();
        }
      }
      handle.removeEventListener('pointermove',move); handle.removeEventListener('pointerup',up);
    };
    handle.addEventListener('pointermove',move); handle.addEventListener('pointerup',up);
  });
}
/* pull any edge or corner */
function edgeResize(w, handle, dir){
  handle.addEventListener('pointerdown', e=>{
    e.stopPropagation();
    if(w.max) return;
    const r = w.el.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    handle.setPointerCapture(e.pointerId);
    const move = ev=>{
      const dx = ev.clientX - sx, dy = ev.clientY - sy;
      let L = r.left, T = r.top, W = r.width, H = r.height;
      if(dir.includes('e')) W = Math.max(300, r.width + dx);
      if(dir.includes('s')) H = Math.max(190, r.height + dy);
      if(dir.includes('w')){ W = Math.max(300, r.width - dx); L = r.left + (r.width - W); }
      if(dir.includes('n')){ H = Math.max(190, r.height - dy); T = Math.max(0, r.top + (r.height - H)); }
      Object.assign(w.el.style, {left:L+'px', top:T+'px', width:W+'px', height:H+'px'});
      if(w.onResize) w.onResize();
    };
    const up = ()=>{ handle.removeEventListener('pointermove',move); handle.removeEventListener('pointerup',up); };
    handle.addEventListener('pointermove',move); handle.addEventListener('pointerup',up);
  });
}
/* dock to an edge by dragging a window there */
const dockEl = ()=>document.getElementById('dock');
function dockZone(x, y){
  const W = window.innerWidth, H = window.innerHeight - 40;
  if(y < 8) return {l:0,t:0,w:W,h:H,kind:'max'};
  if(x < 8) return {l:0,t:0,w:Math.round(W/2),h:H,kind:'left'};
  if(x > W-8) return {l:Math.round(W/2),t:0,w:Math.round(W/2),h:H,kind:'right'};
  return null;
}
function resizify(w, grip){
  grip.addEventListener('pointerdown', e=>{
    e.stopPropagation();
    const r = w.el.getBoundingClientRect(), sx=e.clientX, sy=e.clientY;
    grip.setPointerCapture(e.pointerId);
    const move = ev=>{
      w.el.style.width  = Math.max(300, r.width + ev.clientX - sx)+'px';
      w.el.style.height = Math.max(200, r.height + ev.clientY - sy)+'px';
      if(w.onResize) w.onResize();
    };
    const up = ()=>{grip.removeEventListener('pointermove',move);grip.removeEventListener('pointerup',up)};
    grip.addEventListener('pointermove',move); grip.addEventListener('pointerup',up);
  });
}

/* small helpers */
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function notify(title, msg){
  document.querySelectorAll('.balloon').forEach(b=>b.remove());
  const b = document.createElement('div'); b.className='balloon';
  b.innerHTML = '<b>'+esc(title)+'</b>'+esc(msg);
  document.body.appendChild(b);
  setTimeout(()=>b.remove(), 4200);
  b.onclick = ()=>b.remove();
}
function ctx(x, y, items){
  document.querySelectorAll('.ctxmenu').forEach(m=>m.remove());
  const m = document.createElement('div'); m.className='ctxmenu';
  items.forEach(it=>{
    if(it==='-'){ m.appendChild(document.createElement('hr')); return; }
    const d=document.createElement('div'); d.textContent=it.label;
    d.onclick=()=>{m.remove(); it.run&&it.run()};
    m.appendChild(d);
  });
  m.style.left = Math.min(x, window.innerWidth-190)+'px';
  m.style.top  = Math.min(y, window.innerHeight-40-items.length*26)+'px';
  document.body.appendChild(m);
  setTimeout(()=>document.addEventListener('pointerdown',()=>m.remove(),{once:true}),0);
}

function fetchJSON(url, ms){
  const ac = new AbortController();
  const t = setTimeout(()=>ac.abort(), ms||9000);
  return fetch(url,{signal:ac.signal}).then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); })
    .finally(()=>clearTimeout(t));
}

function videoId(u){
  const m = u.match(/[?&]v=([\w-]{11})/) || u.match(/youtu\.be\/([\w-]{11})/) ||
            u.match(/\/shorts\/([\w-]{11})/) || u.match(/\/embed\/([\w-]{11})/);
  return m ? m[1] : null;
}

function normURL(v){
  v = (v||'').trim();
  if(!v) return null;
  if(/^(about|local|search|wiki|news):/.test(v)) return v;
  if(/^https?:\/\//i.test(v)) return v;
  if(/^[\w-]+(\.[\w-]+)+([\/?#].*)?$/.test(v)) return 'https://'+v;
  return null;
}

        '<div class="card"><b>Why the front page will not load</b>'+
        '<p style="margin:6px 0">Video sites refuse to appear inside another page, and a text copy of one is blank. '+
        'A single video, though, is published in an embeddable form, and that is what this page uses.</p></div>'+
        '<div class="card"><b>If the player shows “content is blocked” or “error 153”</b>'+'<p style="margin:6px 0">The video site checks the web address of the page holding the player. A page inside a sandboxed pane, or one opened straight from a folder with file://, has no address to offer, and the player stops with error 153. Serving the file over http fixes it: a web host, or <code>python3 -m http.server</code> in the folder and then localhost:8000. Open in a new tab works in every case.</p></div>'+'<p style="font-size:11px;color:#777">Watch history and comments are not available here.</p></div>');
      const inp = R('page').querySelector('[data-vurl]'), btn = R('page').querySelector('[data-vgo]');
      const play = ()=>{
        const v = inp.value.trim();
        const id = videoId(v) || (/^[\w-]{11}$/.test(v) ? v : null);

      };

    function openExternal(url){
      let win = null;
      try{ win = window.open(url, '_blank', 'noopener'); }catch(e){}
      if(!win){
        try{ navigator.clipboard.writeText(url); notify('Meridian Browser','This page may not open new tabs, so the address was copied to the clipboard instead.'); }
        catch(e){ notify('Meridian Browser', url); }
      }
    }
    /* YouTube refuses to start when the host page has no real web origin.
       Opening the file straight from disk (file://) or from inside a sandboxed
       frame both produce that condition, and the player answers with error 153. */
    function originTrouble(){
      const framed = (function(){ try{ return window.self !== window.top; }catch(e){ return true; } })();
      if(location.protocol === 'file:') return 'file';
      if(framed) return 'framed';
      return null;
    }
    async function showVideo(id){
      const watch = 'https://www.youtube.com/watch?v='+id;
      const trouble = originTrouble();
      R('addr').value = watch;

        (trouble==='file'
          ? '<b>Player will report error 153.</b> This page was opened straight from disk, so it has no web address for the video site to check against.'
          : '<b>Player may report error 153 or stay blank.</b> This page is running inside another page, so it has no web address of its own.')+
        '</div>' : '';
      R('page').innerHTML = warn +
        '<div class="bw-note" data-vnote>Meridian Video \u2014 loading '+esc(id)+'\u2026</div>'+
        '<iframe class="bw-frame" data-vframe allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture" '+
        'allowfullscreen src="https://www.youtube-nocookie.com/embed/'+encodeURIComponent(id)+'?rel=0"></iframe>'+
        '<div style="flex:0 0 auto;border-top:1px solid #c8d8e6;background:linear-gradient(180deg,#f7fbfe,#e8f1f8);'+
        'padding:10px 12px;display:flex;gap:12px;align-items:center">'+
        '<img src="https://i.ytimg.com/vi/'+encodeURIComponent(id)+'/mqdefault.jpg" '+
        'style="width:110px;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3)" onerror="this.style.display=\'none\'">'+
        '<div style="flex:1;min-width:0"><b data-vtitle style="font-size:12px">Video '+esc(id)+'</b>'+
        '<div data-vby style="font-size:11px;color:#5b7a94"></div>'+
        '<div style="font-size:11px;color:#7b93a8;margin-top:4px">Open in a new tab always works, whatever the player does.</div></div>'+
        '<div style="display:flex;flex-direction:column;gap:4px">'+
        '<button class="tbtn" data-vopen>Open in a new tab</button>'+
        '<button class="tbtn" data-valt>Try the other player</button>'+
        '<button class="tbtn" data-vcopy>Copy link</button>'+
        '<button class="tbtn" data-vhome>Play another</button></div></div>'+
        (trouble ? '<div style="flex:0 0 auto;padding:8px 12px;font-size:11px;color:#5b7a94;'+
          'background:#fbfdff;border-top:1px solid #e2ecf4">To make the player work, the file has to be served '+
          'over http rather than opened from a folder. Put it on a web host, or run '+
          '<code style="background:#eef4fa;padding:1px 4px">python3 -m http.server</code> in the folder that holds it '+
          'and visit <code style="background:#eef4fa;padding:1px 4px">localhost:8000</code>.</div>' : '');
      R('page').querySelector('[data-vopen]').onclick=()=>openExternal(watch);
      R('page').querySelector('[data-vcopy]').onclick=()=>{
        try{ navigator.clipboard.writeText(watch); notify('Meridian Video','Address copied.'); }
        catch(e){ notify('Meridian Video', watch); }
      };
      R('page').querySelector('[data-vhome]').onclick=()=>go('video:home');
      let alt = false;
      R('page').querySelector('[data-valt]').onclick=()=>{
        alt = !alt;
        const f = R('page').querySelector('[data-vframe]');
        f.src = alt ? 'https://www.youtube.com/embed/'+encodeURIComponent(id)+'?rel=0'
                    : 'https://www.youtube-nocookie.com/embed/'+encodeURIComponent(id)+'?rel=0';
        status('Switched to the '+(alt?'standard':'no-cookie')+' player');
      };
      status(trouble ? 'Player blocked by the surrounding page \u2014 use Open in a new tab'
                     : 'Playing \u2014 if the player stays blank, use Open in a new tab');
      try{
        const j = await fetchJSON('https://noembed.com/embed?url='+encodeURIComponent(watch), 8000);
        if(j && j.title){
          const t = R('page').querySelector('[data-vtitle]'), b = R('page').querySelector('[data-vby]'),
                n = R('page').querySelector('[data-vnote]');
          if(t) t.textContent = j.title;
          if(b) b.textContent = j.author_name || '';
          if(n) n.textContent = 'Meridian Video \u2014 '+j.title;
          head(j.title.slice(0,40));
        }
      }catch(e){
        const n = R('page').querySelector('[data-vnote]');
        if(n) n.textContent = 'Meridian Video \u2014 '+id;
      }
    }
    function frameIt(url){
      R('page').innerHTML =
        '<div class="bw-note">Full page view of <b>'+esc(url.replace(/^https?:\/\//,'').split('/')[0])+'</b>. '+
        'If this stays blank, the site or the surrounding page refuses frames.'+
        '<button class="tbtn" data-open>Open in a new tab</button>'+
        '<button class="tbtn" data-text>Text-only view</button></div>'+
        '<iframe class="bw-frame" referrerpolicy="no-referrer" src="'+esc(url)+'" '+
        'sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>';
      R('page').querySelector('[data-text]').onclick=()=>showURL(url);
      R('page').querySelector('[data-open]').onclick=()=>openExternal(url);
      status('Full page view \u2014 '+esc(url));
    }
    function offline(what, tried, retry){
      page('<div class="site"><h1>The page cannot be displayed</h1>'+
        '<p>Meridian Browser could not '+esc(what)+'.</p>'+
        (tried? '<div class="card"><b>Tried</b><ul style="padding-left:18px;margin:6px 0">'+
          tried.map(t=>'<li>'+esc(t)+'</li>').join('')+'</ul></div>' : '')+
        '<div class="card"><b>What usually fixes it</b><ul style="padding-left:18px;margin:6px 0">'+
        (retry? '<li><a href="#" data-go="'+esc(retry)+'">Try that page again</a></li>':'')+
        '<li><a href="#" data-go="diag:net">Run the connection test</a></li>'+
        '<li><a href="#" data-go="about:start">Go back to Meridian Start</a></li>'+
        '<li>If this page is open inside a preview pane, save the file and open it in a browser tab \u2014 '+
        'preview panes often block outside connections.</li></ul></div></div>');
      wire(); status('Cannot find server');
    }
    /* ---------- connection test ---------- */
    async function showDiag(){
      R('addr').value = 'diag:net';
      spin('Testing the connection\u2026'); head('Connection test');
      const checks = [
        ['Search index', WIKI+'/w/api.php?action=query&meta=siteinfo&format=json&origin=*'],
        ['Article text', WIKI+'/w/api.php?action=parse&page=Web_browser&prop=text&format=json&formatversion=2&origin=*'],
        ['Headline feed','https://hacker-news.firebaseio.com/v0/maxitem.json'],
        ['Weather service','https://api.open-meteo.com/v1/forecast?latitude=30.5&longitude=-97.7&current=temperature_2m'],
      ].concat(RELAYS.map(r=>['Relay: '+r.name, r.make('https://example.com')]));
      const rows = [];
      for(const [name,url] of checks){
        const t0 = performance.now();
        let ok = false, note = '';
        try{
          const ac = new AbortController(), to = setTimeout(()=>ac.abort(), 9000);
          const r = await fetch(url,{signal:ac.signal});
          clearTimeout(to);
          ok = r.ok; note = 'HTTP '+r.status+' in '+Math.round(performance.now()-t0)+' ms';
        }catch(e){ note = (e.name==='AbortError') ? 'timed out' : 'blocked or unreachable'; }
        rows.push('<tr><td>'+esc(name)+'</td><td style="color:'+(ok?'#2a7a2a':'#a33')+'">'+
          (ok?'OK':'Failed')+'</td><td>'+esc(note)+'</td></tr>');
      }
      const framed = (function(){ try{ return window.self !== window.top; }catch(e){ return true; } })();
      page('<div class="site"><h1>Connection test</h1>'+
        '<p>Browser reports the machine is <b>'+(navigator.onLine?'online':'offline')+'</b>. '+
        'LaptopOS is running '+(framed
          ? '<b>inside another page</b>, which commonly blocks embedded players and some requests.'
          : (location.protocol==='file:'
             ? '<b>from a folder on this computer</b>. Data requests work, but video players refuse a page with no web address (error 153).'
             : '<b>in its own tab over '+location.protocol.replace(':','')+'</b>, so nothing here is sandboxed.'))+'</p>'+
        '<table><tr><th>Service</th><th>Result</th><th>Detail</th></tr>'+rows.join('')+'</table>'+
        '<div class="card">If every row failed, nothing on this page can reach the network. That is normal '+
        'inside a preview pane; open the saved file in its own browser tab instead.</div>'+
        '<p><a href="#" data-go="about:start">Back to Meridian Start</a></p></div>');
      wire(); status('Connection test finished');
    }
    /* ---------- router ---------- */
    function go(target, push){
      const t = tab();
      if(push!==false){ t.hist = t.hist.slice(0,t.hi+1); t.hist.push(target); t.hi = t.hist.length-1; }
      t.url = target;
      if(target==='about:start') return showLocal('home');
      if(target.indexOf('local:')===0) return showLocal(target.slice(6));
      if(target.indexOf('search:')===0) return showSearch(target.slice(7));
      if(target.indexOf('wiki:')===0) return showWiki(target.slice(5));
      if(target.indexOf('news:')===0) return showNews();
      if(target.indexOf('diag:')===0) return showDiag();
      if(target.indexOf('video:')===0){ const v=target.slice(6); return v==='home'? showVideoHome() : showVideo(v); }
      const u = normURL(target);
      if(!u) { t.url = 'search:'+target; return showSearch(target); }
      if(/wikipedia\.org\/wiki\//.test(u)) return showWiki(u.split('/wiki/')[1]);
      const vid = videoId(u);
      if(vid) return showVideo(vid);
      showURL(u);
    }
    R('go').onclick=()=>go(R('addr').value);
    R('addr').onkeydown=e=>{ if(e.key==='Enter') go(R('addr').value); };
    R('addr').onfocus=e=>e.target.select();
    R('back').onclick=()=>{ const t=tab(); if(t.hi>0){t.hi--;go(t.hist[t.hi],false)} };
    R('fwd').onclick=()=>{ const t=tab(); if(t.hi<t.hist.length-1){t.hi++;go(t.hist[t.hi],false)} };
    R('home').onclick=()=>go('about:start');
    R('reload').onclick=()=>go(tab().url,false);
    R('star').onclick=()=>{
      const t=tab(); if(!CURRENT) return;
      CURRENT.favs = CURRENT.favs||[];
      if(CURRENT.favs.some(f=>f.url===t.url)) return notify('Favorites','Already saved.');
      CURRENT.favs.push({title:t.title.slice(0,20), url:t.url});
      saveProfiles(); drawFavs(); notify('Favorites','Added '+t.title.slice(0,20)+'.');
    };
    newTab();
    go(arg ? (/^(about|local|search|wiki|news|http)/.test(arg)? arg : 'local:'+arg) : 'about:start');
  }
};

APPS.files = {
  title:"Files", icon:"files", w:760, h:500,
  init(w, arg){
    w.body.innerHTML =
      '<div class="menubar"><b>File</b><b>Edit</b><b>View</b><b>Tools</b><b>Help</b></div>'+

        '<button class="tbtn" data-r="back">&#9668;</button>'+

        '<div class="pane" data-r="pane" style="position:relative"></div></div>'+
      '<div class="statusbar" data-r="st"></div>';
    const R=k=>w.body.querySelector('[data-r='+k+']');
    let cur = (arg && (typeof arg==='string'? arg : arg.dir)) || "C:\\Documents";
    let sel = null, mode = 'details', sortBy = 'name', sortDir = 1, hist = [], hi = -1, results = null;

    function pushHist(p){ hist = hist.slice(0,hi+1); hist.push(p); hi = hist.length-1; }
    function goTo(p, push){
      if(!FS[p]) { notify('Files','That folder does not exist: '+p); return; }
      cur = p; sel = null; results = null;
      if(push!==false) pushHist(p);
      draw();
    }
    function tree(){
      const rows = [];
      (function walk(path, depth){
        Object.keys(FS[path]||{}).filter(n=>FS[path][n].type==='dir').sort().forEach(n=>{
          const sub = joinPath(path,n);
          rows.push('<div class="tw'+(sub===cur?' sel':'')+'" data-p="'+esc(sub)+'" style="padding-left:'+(6+depth*12)+'px">'+
            (sub===cur? I.folderopen : I.files)+'<span>'+esc(n)+'</span></div>');
          walk(sub, depth+1);

      })('C:',0);
      R('side').innerHTML = '<h4 class="grp">Folders</h4>'+
        '<div class="tw'+('C:'===cur?' sel':'')+'" data-p="C:">'+I.drive+'<span>Local Disk (C:)</span></div>'+
        (FS['D:'] ? '<div class="tw'+('D:'===cur?' sel':'')+'" data-p="D:">'+I.media+
          '<span>'+esc(DISC_LABEL||'Disc')+' (D:)</span></div>' : '')+
        rows.join('')+
        '<h4 class="grp">Shortcuts</h4>'+
        '<div class="tw" data-p="C:\\Pictures\\Sketches">'+I.sketch+'<span>Sketches</span></div>'+
        '<div class="tw'+(cur===RECYCLE?' sel':'')+'" data-p="'+esc(RECYCLE)+'">'+(binCount()?I.trashfull:I.trash)+

      R('side').querySelectorAll('[data-p]').forEach(d=>d.onclick=()=>goTo(d.dataset.p));

    }
    function entries(){
      if(results) return results.map(r=>({dir:r.dir, name:r.name, e:FS[r.dir][r.name]}));
      return Object.keys(FS[cur]||{}).map(n=>({dir:cur, name:n, e:FS[cur][n]}));
    }
    function sorted(){
      const list = entries();
      list.sort((a,b)=>{
        if(isDir(a.e)!==isDir(b.e)) return isDir(a.e)? -1 : 1;
        let r = 0;
        if(sortBy==='name') r = a.name.localeCompare(b.name);
        else if(sortBy==='size') r = sizeOf(a.e)-sizeOf(b.e);
        else if(sortBy==='type') r = typeName(a.e).localeCompare(typeName(b.e));
        else r = (a.e.mod||0)-(b.e.mod||0);
        return r*sortDir;
      });
      return list;
    }
    function select(name, dir){
      sel = name ? {name, dir:dir||cur} : null;
      R('pane').querySelectorAll('[data-n]').forEach(el=>
        el.classList.toggle('sel', !!sel && el.dataset.n===sel.name && el.dataset.d===sel.dir));

      R('st').textContent = e
        ? sel.name+'  \u2014  '+typeName(e)+(e.type==='dir'?'':'  \u2014  '+fmtSize(sizeOf(e)))
        : entries().length+' object(s)';
    }
    function open(dir, name){
      const e = FS[dir][name];
      if(isDir(e)) goTo(joinPath(dir,name));
      else openFile(dir, name);
    }
    function rowMenu(x,y,dir,name){
      select(name,dir);
      ctx(x,y,[
        {label:'Open', run:()=>open(dir,name)},
        '-',

        {label:'Properties', run:()=>props(dir,name)}

        R('pane').innerHTML = '<table class="fm-details"><thead><tr>'+
          '<th data-s="name">Name'+arrow('name')+'</th><th data-s="size">Size'+arrow('size')+'</th>'+

            '<td>'+(isDir(x.e)?'':fmtSize(sizeOf(x.e)))+'</td>'+
            '<td>'+typeName(x.e)+'</td><td>'+fmtDate(x.e.mod)+'</td></tr>').join('')
            : '<tr><td colspan="4" style="padding:18px;color:#7b93a8">This folder is empty.</td></tr>')+
          '</tbody></table>';

    function mkFolder(){
      const n = uniqueName(cur,'New folder');
      FS[cur][n] = {type:'dir', mod:NOW()};
      ensureDir(joinPath(cur,n));
      persist(); draw(); select(n);
    }
    function mkFile(){
      const n = uniqueName(cur,'New file.txt');
      FS[cur][n] = {type:'text', body:'', mod:NOW()};
      persist(); draw(); select(n);

    function paste(){
      if(!CLIP.name || !FS[CLIP.dir] || !FS[CLIP.dir][CLIP.name]){ notify('Files','There is nothing to paste.'); return; }
      const n = CLIP.cut ? moveEntry(CLIP.dir, CLIP.name, cur) : copyEntry(CLIP.dir, CLIP.name, cur);
      if(CLIP.cut){ CLIP.name=null; }
      persist(); draw(); select(n);
    }
    function doRename(dir,name){
      dialog(w, 'Rename', name, v=>{
        if(renameEntry(dir,name,v)){ persist(); draw(); select(v,dir); }
        else notify('Files','That name is already in use.');
      });
    }
    function props(dir,name){
      const e = FS[dir][name];
      const count = e.type==='dir' ? Object.keys(FS[joinPath(dir,name)]||{}).length : null;
      notify(name, typeName(e)+' \u2014 '+(count!=null? count+' item(s)' : fmtSize(sizeOf(e)))+
        ' \u2014 in '+dir+' \u2014 modified '+fmtDate(e.mod));
    }
    R('back').onclick=()=>{ if(hi>0){hi--;goTo(hist[hi],false)} };
    R('fwd').onclick=()=>{ if(hi<hist.length-1){hi++;goTo(hist[hi],false)} };
    R('up').onclick=()=>{ if(cur!=='C:') goTo(parentOf(cur)); };
    R('path').onkeydown=e=>{ if(e.key==='Enter') goTo(e.target.value.trim()); };
    R('q').onkeydown=e=>{
      if(e.key!=='Enter') return;
      const q = e.target.value.trim();
      if(!q){ results=null; draw(); return; }
      results = searchFS(cur, q);
      draw();
      R('st').textContent = results.length+' item(s) found for "'+q+'"';
    };
    R('view').onclick=()=>{ mode = mode==='icons'?'details':'icons'; R('view').textContent = mode==='icons'?'Icons':'Details'; draw(); };
    R('nfolder').onclick=mkFolder;
    R('nfile').onclick=mkFile;
    R('cut').onclick=()=>{ if(sel){CLIP.dir=sel.dir;CLIP.name=sel.name;CLIP.cut=true;draw()} };
    R('copy').onclick=()=>{ if(sel){CLIP.dir=sel.dir;CLIP.name=sel.name;CLIP.cut=false;draw()} };
    R('paste').onclick=paste;
    R('ren').onclick=()=>{ if(sel) doRename(sel.dir,sel.name); };
    R('del').onclick=()=>{
      if(!sel) return;
      if(cur===RECYCLE) removeEntry(sel.dir,sel.name); else recycle(sel.dir,sel.name);
      sel=null; persist(); draw();
    };
    R('restore').onclick=()=>{
      if(!sel) return notify('Recycle Bin','Pick something to restore first.');
      restoreFromBin(sel.name); sel=null; persist(); draw();
    };
    R('empty').onclick=()=>{
      const c = binCount();
      Object.keys(FS[RECYCLE]||{}).forEach(n=>removeEntry(RECYCLE,n));
      persist(); draw();
      notify('Recycle Bin', c? c+' item(s) deleted for good.' : 'It was already empty.');
    };
    w.body.addEventListener('keydown', e=>{
      if(!sel) return;
      if(e.key==='Delete'){
        if(e.shiftKey || cur===RECYCLE) removeEntry(sel.dir,sel.name); else recycle(sel.dir,sel.name);
        sel=null; persist(); draw();
      }
      if(e.key==='F2') doRename(sel.dir,sel.name);
    });
    pushHist(cur);
    draw();
    if(arg && arg.select) select(arg.select);
  }
};
/* small in-window prompt used by Files and others */
function dialog(w, title, value, ok){
  const d = document.createElement('div');
  d.className = 'dlg';
  d.innerHTML = '<div class="box"><h4>'+esc(title)+'</h4>'+
    '<input class="fld" style="width:100%" value="'+esc(value||'')+'">'+
    '<div class="btns"><button class="tbtn" data-c>Cancel</button><button class="tbtn" data-o>OK</button></div></div>';
  w.body.appendChild(d);
  const inp = d.querySelector('input');
  inp.focus(); inp.select();
  const close = ()=>d.remove();
  d.querySelector('[data-c]').onclick = close;
  d.querySelector('[data-o]').onclick = ()=>{ const v=inp.value.trim(); close(); if(v) ok(v); };
  inp.onkeydown = e=>{ if(e.key==='Enter') d.querySelector('[data-o]').click(); if(e.key==='Escape') close(); };
}
function openFile(dir, name){
  const f = FS[dir] && FS[dir][name]; if(!f) return;
  if(f.type==='dir')        openApp('files', joinPath(dir,name));
  else if(f.type==='text')  openApp('text',{dir,name});
  else if(f.type==='image') openApp('image',{dir,name});
  else if(f.type==='audio') openApp('media',{name});
  else if(f.type==='sheet') openApp('sheet',{name});
  else if(f.type==='slides')openApp('slides',{name});
  else if(f.type==='app')   openApp(f.app);
}

function wireSpace(root, reload){
  const sp = spaceData();
  if(!sp) return;
  const save = ()=>{ if(CURRENT){ CURRENT.space = sp; saveProfiles(); } };
  root.querySelectorAll('[data-sp]').forEach(el=>{
    el.onblur = ()=>{ sp[el.dataset.sp] = el.textContent.trim(); save(); };
  });
  root.querySelectorAll('input[name=sptheme]').forEach(r=>r.onchange = ()=>{
    sp.theme = r.value; sp.views--; save(); reload();
  });
  const post = root.querySelector('[data-sp-post]'), inp = root.querySelector('[data-sp-new]');
  const add = ()=>{
    const v = inp.value.trim();
    if(!v) return;
    sp.comments.unshift({who:CURRENT.name, text:v, at:Date.now()});
    save(); sp.views--; reload();
  };
  if(post) post.onclick = add;
  if(inp) inp.onkeydown = e=>{ if(e.key==='Enter') add(); };
  root.querySelectorAll('[data-sp-del]').forEach(a=>a.onclick = e=>{
    e.preventDefault();
    sp.comments.splice(+a.dataset.spDel,1); save(); sp.views--; reload();
  });

    e.preventDefault();

  root.querySelectorAll('[data-sp-act]').forEach(a=>a.onclick = e=>{
    e.preventDefault();

  });
}

const TRACKS = [

  {n:"Dial Tone Waltz", a:"56k Orchestra", len:242, sim:true},

let RECENT = [];
function recordPlay(t){
  RECENT = RECENT.filter(x=>!(x.n===t.n && x.a===t.a));
  RECENT.unshift({n:t.n, a:t.a, at:Date.now(), local:!!t.url});
  if(RECENT.length>24) RECENT.length = 24;
  if(CURRENT){ CURRENT.recent = RECENT; saveProfiles(); }
}
const agoText = t => {
  const m = Math.round((Date.now()-t)/60000);
  if(m<1) return 'just now';
  if(m<60) return m+' minute'+(m>1?'s':'')+' ago';
  const h = Math.round(m/60);
  if(h<24) return h+' hour'+(h>1?'s':'')+' ago';
  return Math.round(h/24)+' day(s) ago';
};

          '<div class="mp-round" data-r="prev"><svg viewBox="0 0 16 16"><path d="M13 2v12L5 8zM4 2h2v12H4z"/></svg></div>'+
          '<div class="mp-round big" data-r="play"><svg viewBox="0 0 16 16"><path d="M4 2l10 6-10 6z"/></svg></div>'+
          '<div class="mp-round" data-r="next"><svg viewBox="0 0 16 16"><path d="M3 2l8 6-8 6zM10 2h2v12h-2z"/></svg></div>'+
          '<div class="mp-seek" data-r="seek"><i></i></div>'+
          '<div class="mp-time" data-r="time">0:00 / 0:00</div>'+
          '<input type="range" data-r="vol" min="0" max="100" value="80" style="width:70px">'+
        '</div>'+
        '<div class="mp-list" data-r="list"></div>'+
      '</div>'+
      '<div class="statusbar" data-r="st">Stopped</div>';
    const R=k=>w.body.querySelector('[data-r='+k+']');
    const audio = new Audio();
    audio.preload = 'metadata';
    let list = TRACKS.slice(), i = 0, pos = 0, playing = false, tick = null, raf = null, node = null, analyser = null;
    const fmt = s => (isFinite(s)?Math.floor(s/60):0)+':'+String(Math.floor(isFinite(s)?s%60:0)).padStart(2,'0');
    const track = ()=>list[i] || list[0];
    const dur = ()=> track() && track().url ? (audio.duration||track().len||0) : (track()? track().len : 0);

    if(arg && arg.name){ const k = list.findIndex(t=>arg.name.indexOf(t.n)===0); if(k>=0) i = k; }

    function drawList(){
      R('list').innerHTML = list.map((t,k)=>
        '<div class="mp-track'+(k===i?' on':'')+'" data-i="'+k+'"><span style="width:16px;color:#5f7d99">'+(k+1)+'</span>'+
        '<span class="n">'+esc(t.n)+'</span><span style="opacity:.75">'+esc(t.a)+'</span>'+
        '<span>'+(t.url? '<b style="color:#7fd4a0">file</b> ' : '')+fmt(t.len||0)+'</span></div>').join('');
      R('list').querySelectorAll('[data-i]').forEach(d=>d.onclick=()=>{ i=+d.dataset.i; load(true); });
    }
    function load(autoplay){
      const t = track();
      R('t').textContent = t.n; R('a').textContent = t.a;
      setTitle(w, t.n+' \u2014 Media Player');
      drawList();
      pos = 0;
      if(t.url){
        audio.src = t.url;
        audio.load();
      }else{
        audio.pause(); audio.removeAttribute('src');
      }
      if(autoplay) play(true); else upd();
    }
    function upd(){
      const d = dur();
      const p = track() && track().url ? (audio.currentTime||0) : pos;
      R('seek').firstElementChild.style.width = d? (p/d*100)+'%' : '0%';
      R('time').textContent = fmt(p)+' / '+fmt(d);
      const t = track();
      R('st').textContent = (playing?'Playing':'Paused')+' \u2014 '+(t?t.n+' \u2014 '+t.a:'')+
        (t && t.url ? ' \u2014 from this computer' : ' \u2014 44 kHz stereo');
    }
    function icon(){
      R('play').innerHTML = playing
        ? '<svg viewBox="0 0 16 16"><path d="M4 2h3.5v12H4zM8.5 2H12v12H8.5z"/></svg>'
        : '<svg viewBox="0 0 16 16"><path d="M4 2l10 6-10 6z"/></svg>';
    }
    function hookAnalyser(){
      const ac = audioCtx();
      if(!ac || node) return;
      try{
        node = ac.createMediaElementSource(audio);
        analyser = ac.createAnalyser();
        analyser.fftSize = 128;
        node.connect(analyser); analyser.connect(ac.destination);
      }catch(e){ analyser = null; }
    }
    function play(on){
      playing = on===undefined ? !playing : on;
      const t = track();
      if(playing) recordPlay(t);
      clearInterval(tick);
      if(t && t.url){
        if(playing){ hookAnalyser(); audio.play().catch(()=>{ playing=false; icon(); upd(); }); }
        else audio.pause();
      }else{
        if(playing){
          tick = setInterval(()=>{
            pos++;
            if(pos >= (t.len||0)){ next(); }
            upd();
          }, 1000);
        }
      }
      icon(); upd();
    }
    function next(){ i = (i+1) % list.length; load(playing); }
    function prev(){ if((track().url?audio.currentTime:pos) > 3){ if(track().url) audio.currentTime=0; else pos=0; upd(); } else { i=(i-1+list.length)%list.length; load(playing); } }
    audio.onended = next;
    audio.ontimeupdate = ()=>{ if(track() && track().url) upd(); };
    audio.onloadedmetadata = ()=>{ const t=track(); if(t && t.url){ t.len = audio.duration; drawList(); upd(); } };
    R('play').onclick=()=>play();
    R('next').onclick=next;
    R('prev').onclick=prev;
    R('seek').onclick=e=>{
      const r = R('seek').getBoundingClientRect(), f = (e.clientX-r.left)/r.width;
      if(track().url){ if(isFinite(audio.duration)) audio.currentTime = audio.duration*f; }
      else pos = Math.round((track().len||0)*f);
      upd();
    };
    R('vol').oninput=()=>{ audio.volume = R('vol').value/100; R('st').textContent = 'Volume '+R('vol').value+'%'; };
    audio.volume = .8;
    R('open').onclick=()=>R('file').click();
    R('file').onchange=e=>addFiles(e.target.files);
    R('web').onclick=()=>openApp('browser','local:music');

    function addFiles(files){
      const added = [];
      [...files].forEach(f=>{
        if(!/^audio\//.test(f.type) && !/\.(mp3|m4a|ogg|wav|flac|aac)$/i.test(f.name)) return;
        const url = URL.createObjectURL(f);
        const nm = f.name.replace(/\.[^.]+$/,'');
        const t = {n:nm, a:'On this computer', len:0, url};
        list.push(t); added.push(t);
        ensureDir("C:\\Music");
        FS["C:\\Music"][uniqueName("C:\\Music", f.name)] = {type:'audio', mod:NOW(), local:true};
      });
      if(!added.length){ notify('Media Player','That file is not an audio file this player understands.'); beep('error'); return; }
      drawList();
      i = list.indexOf(added[0]);
      load(true);
      notify('Media Player', added.length+' file(s) added to the playlist.');
    }
    /* drag and drop */
    const dz = R('drop');
    const over = e=>{ e.preventDefault(); dz.classList.add('on'); };
    const out  = e=>{ e.preventDefault(); dz.classList.remove('on'); };
    w.body.addEventListener('dragenter', over);
    w.body.addEventListener('dragover', over);
    w.body.addEventListener('dragleave', out);
    w.body.addEventListener('drop', e=>{
      out(e);
      if(e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) addFiles(e.dataTransfer.files);
    });

    /* visualiser: real spectrum when a file is playing, animated bars otherwise */
    const cv = R('cv'), cx = cv.getContext('2d');
    let ph = 0;
    const bins = new Uint8Array(64);
    function frame(){
      const dpr = window.devicePixelRatio||1, W = cv.clientWidth, H = cv.clientHeight;
      if(cv.width !== W*dpr){ cv.width = W*dpr; cv.height = H*dpr; }
      cx.setTransform(dpr,0,0,dpr,0,0);
      cx.clearRect(0,0,W,H);
      const live = analyser && playing && track() && track().url;
      if(live) analyser.getByteFrequencyData(bins);
      const bars = 44, bw = W/bars, amp = playing ? 1 : .12;
      ph += playing ? .09 : .012;
      for(let b=0;b<bars;b++){
        let v;
        if(live) v = (bins[Math.floor(b*bins.length/bars)]||0)/255;
        else v = (Math.sin(ph+b*.42)*.5+.5)*(Math.sin(ph*.7+b*.13)*.35+.65)*amp;
        const h = Math.max(2, v*H*.78+2);
        const g = cx.createLinearGradient(0,H-h,0,H);
        g.addColorStop(0,'hsl('+(190+b*1.6)+' 100% 72%)');
        g.addColorStop(1,'hsl('+(205+b*1.2)+' 90% 34%)');
        cx.fillStyle = g;
        cx.fillRect(b*bw+1.5, H-h, bw-3, h);
        cx.fillStyle = 'rgba(255,255,255,.16)';
        cx.fillRect(b*bw+1.5, H-h, bw-3, Math.min(8,h/2));
      }
      raf = requestAnimationFrame(frame);
    }
    frame();
    w.onClose = ()=>{ clearInterval(tick); cancelAnimationFrame(raf); audio.pause(); };
    load(false);
  }
};

/* ---- sound ---- */
let AC = null, AC_VERB = null, AC_BUS = null;
function audioCtx(){
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended') AC.resume();
    if(!AC_VERB){
      /* a small hall, generated rather than sampled */
      const len = Math.floor(AC.sampleRate*2.1);
      const ir = AC.createBuffer(2, len, AC.sampleRate);
      for(let ch=0; ch<2; ch++){
        const d = ir.getChannelData(ch);
        for(let i=0;i<len;i++){
          const t = i/len;
          d[i] = (Math.random()*2-1) * Math.pow(1-t, 2.6) * (i<AC.sampleRate*0.012 ? t*80 : 1);
        }
      }
      AC_VERB = AC.createConvolver(); AC_VERB.buffer = ir;
      const wet = AC.createGain(); wet.gain.value = .34;
      AC_VERB.connect(wet); wet.connect(AC.destination);
      AC_BUS = AC.createGain(); AC_BUS.gain.value = .5;
      AC_BUS.connect(AC.destination); AC_BUS.connect(AC_VERB);
    }
    return AC;
  }catch(e){ return null; }
}
/* an FM bell: a carrier shaped by a modulator, decaying like struck metal */
function bell(f, at, dur, vol, ratio, bright){
  const ac = AC;
  const t = ac.currentTime + at;
  const car = ac.createOscillator(), mod = ac.createOscillator();
  const mg = ac.createGain(), g = ac.createGain();
  car.frequency.value = f;
  mod.frequency.value = f * (ratio || 2.76);
  mg.gain.setValueAtTime(f * (bright||1.9), t);
  mg.gain.exponentialRampToValueAtTime(f * 0.06, t + dur*0.7);
  mod.connect(mg); mg.connect(car.frequency);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol||.4, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  car.connect(g); g.connect(AC_BUS);
  mod.start(t); car.start(t);
  mod.stop(t + dur + .05); car.stop(t + dur + .05);
}
/* a soft string-ish pad for the low end */
function pad(f, at, dur, vol){
  const ac = AC, t = ac.currentTime + at;
  const g = ac.createGain(), lp = ac.createBiquadFilter();
  lp.type = 'lowpass'; lp.frequency.value = 900;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol||.16, t + dur*0.28);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  [0, 3.5, -3.5].forEach(cents=>{
    const o = ac.createOscillator();
    o.type = 'triangle';
    o.frequency.value = f * Math.pow(2, cents/1200);
    o.connect(lp);
    o.start(t); o.stop(t + dur + .05);
  });
  lp.connect(g); g.connect(AC_BUS);
}
/* a breathy sweep, the sound every startup had in this era */
function swell(at, dur, vol, up){
  const ac = AC, t = ac.currentTime + at;
  const len = Math.ceil(ac.sampleRate*dur);
  const buf = ac.createBuffer(1, len, ac.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i] = Math.random()*2-1;
  const src = ac.createBufferSource(); src.buffer = buf;
  const bp = ac.createBiquadFilter(); bp.type='bandpass'; bp.Q.value = 1.4;
  bp.frequency.setValueAtTime(up? 320 : 2600, t);
  bp.frequency.exponentialRampToValueAtTime(up? 3200 : 260, t + dur);
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol||.12, t + dur*0.55);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(bp); bp.connect(g); g.connect(AC_BUS);
  src.start(t); src.stop(t + dur + .05);
}
/* Three events make a sound. They are chimes, not beeps. */
function beep(kind){
  if(SETTINGS.soundCue){
    const f = document.createElement('div');
    f.style.cssText = 'position:fixed;inset:0;z-index:99990;pointer-events:none;box-shadow:0 0 0 8px '+
      (kind==='error'?'rgba(220,70,60,.8)':'rgba(120,200,255,.7)')+' inset;transition:opacity .45s';
    document.body.appendChild(f);
    requestAnimationFrame(()=>{ f.style.opacity='0'; });
    setTimeout(()=>f.remove(), 500);
  }
  if(!SETTINGS.sounds) return;
  if(!audioCtx()) return;
  if(kind==='start'){
    swell(0, 1.5, .10, true);
    pad(130.81, .05, 3.4, .13);          /* C3 underneath */
    bell(523.25, .10, 2.4, .34);         /* C5 */
    bell(659.25, .34, 2.4, .30);         /* E5 */
    bell(783.99, .58, 2.6, .30);         /* G5 */

let wallFront = false;
function wallStyle(el){
  el.className = '';
  el.style.background = '';
  el.style.backgroundImage = '';
  if(SETTINGS.wallCustom){
    el.style.backgroundColor = SETTINGS.wallColor;
    el.style.backgroundImage = 'url("'+SETTINGS.wallCustom+'")';
    el.style.backgroundRepeat = SETTINGS.wallFit==='repeat' ? 'repeat' : 'no-repeat';
    el.style.backgroundSize = SETTINGS.wallFit==='repeat' ? 'auto'
      : SETTINGS.wallFit==='contain' ? 'contain'

  }else if(SETTINGS.wall==='solid'){
    el.style.backgroundColor = SETTINGS.wallColor;
  }else{
    el.className = SETTINGS.wall;
  }
}
function paintWall(){
  const a = document.getElementById('wall'), b = document.getElementById('wall2');
  const back = wallFront ? a : b, front = wallFront ? b : a;
  wallStyle(back);
  back.style.transition = 'opacity .55s ease';
  back.style.opacity = '1';
  front.style.opacity = '0';
  wallFront = !wallFront;
}
function applySettings(){

/* ---- screen saver ---- */
let idleAt = Date.now(), saverRAF = null;
function saverStart(){
  if(SETTINGS.saver==='none') return;
  const el = document.getElementById('saver'), cv = document.getElementById('saverCv');
  el.classList.add('on');
  const cx = cv.getContext('2d');
  let t = 0;
  const stars = Array.from({length:180},()=>({x:(Math.random()-.5)*2,y:(Math.random()-.5)*2,z:Math.random()}));
  let mx=.5,my=.5,dx=.004,dy=.003;
  const pipes = Array.from({length:5},(_,i)=>({x:Math.random(),y:Math.random(),a:Math.random()*6.28,h:i*70}));
  function frame(){
    const W = cv.width = cv.clientWidth, H = cv.height = cv.clientHeight;
    t += 1;
    if(SETTINGS.saver==='stars'){
      cx.fillStyle='#000'; cx.fillRect(0,0,W,H);
      stars.forEach(s=>{
        s.z -= .004; if(s.z<=.02){ s.x=(Math.random()-.5)*2; s.y=(Math.random()-.5)*2; s.z=1; }
        const k = 1/s.z, x = W/2 + s.x*k*W/3, y = H/2 + s.y*k*H/3, r = Math.max(.4,(1-s.z)*2.6);
        cx.fillStyle = 'hsl('+(200+(1-s.z)*40)+' 100% '+(55+(1-s.z)*35)+'%)';
        cx.beginPath(); cx.arc(x,y,r,0,6.284); cx.fill();
      });
    }else if(SETTINGS.saver==='marquee'){
      cx.fillStyle='#000'; cx.fillRect(0,0,W,H);
      mx+=dx; my+=dy;
      if(mx<.05||mx>.95) dx*=-1;
      if(my<.1||my>.9) dy*=-1;
      cx.save();
      cx.translate(mx*W,my*H);
      cx.textAlign='center'; cx.font='300 46px "Trebuchet MS",sans-serif';
      const g = cx.createLinearGradient(-180,0,180,0);
      g.addColorStop(0,'hsl('+(t%360)+' 90% 65%)'); g.addColorStop(1,'hsl('+((t+120)%360)+' 90% 65%)');
      cx.fillStyle=g; cx.fillText('LaptopOS 1.6', 0, 0);
      cx.font='14px "Segoe UI",sans-serif'; cx.fillStyle='#7fa8c8';
      cx.fillText(new Date().toLocaleTimeString(), 0, 30);
      cx.restore();
    }else{
      if(t===1){ cx.fillStyle='#04101c'; cx.fillRect(0,0,W,H); }
      cx.globalAlpha=.9;
      pipes.forEach(p=>{
        const nx = p.x + Math.cos(p.a)*.006, ny = p.y + Math.sin(p.a)*.006;
        cx.strokeStyle='hsl('+p.h+' 85% 62%)'; cx.lineWidth=5; cx.lineCap='round';
        cx.beginPath(); cx.moveTo(p.x*W,p.y*H); cx.lineTo(nx*W,ny*H); cx.stroke();
        p.x=nx; p.y=ny; p.h=(p.h+.4)%360;
        if(p.x<0||p.x>1||p.y<0||p.y>1||Math.random()<.02){
          p.a += (Math.random()<.5?1:-1)*1.5708;
          p.x=Math.min(.98,Math.max(.02,p.x)); p.y=Math.min(.98,Math.max(.02,p.y));
        }
      });
      cx.globalAlpha=1;
    }
    saverRAF = requestAnimationFrame(frame);
  }
  frame();
}
function saverStop(){
  document.getElementById('saver').classList.remove('on');
  if(saverRAF) cancelAnimationFrame(saverRAF);
  saverRAF = null;
  idleAt = Date.now();
}
setInterval(()=>{
  if(!CURRENT || saverRAF) return;
  if(SETTINGS.saver!=='none' && Date.now()-idleAt > SETTINGS.saverWait*60000) saverStart();
}, 3000);
['pointerdown','pointermove','keydown','wheel'].forEach(ev=>
  document.addEventListener(ev, ()=>{ idleAt = Date.now(); if(saverRAF) saverStop(); }, true));

/* scale a picked image down before it is stored with the account */
function shrink(dataURL, done){
  const img = new Image();
  img.onload = ()=>{
    const max = 1440, sc = Math.min(1, max/Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.round(img.width*sc); c.height = Math.round(img.height*sc);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    try{ done(c.toDataURL('image/jpeg', .82)); }catch(e){ done(dataURL); }
  };
  img.onerror = ()=>done(dataURL);
  img.src = dataURL;
}

/* every account is represented by a flower, tinted by the account colour */
function flowerSVG(hue, size){
  const h = hue===undefined ? 40 : hue;
  let petals = '';
  for(let i=0;i<8;i++){
    petals += '<ellipse cx="32" cy="17" rx="8.5" ry="13" transform="rotate('+(i*45)+' 32 32)" '+
      'fill="url(#pt'+h+')" stroke="hsl('+h+' 65% 42%)" stroke-width="1" opacity=".97"/>';
  }
  return '<svg viewBox="0 0 64 64" width="'+(size||'100%')+'" height="'+(size||'100%')+'" xmlns="http://www.w3.org/2000/svg">'+
    '<defs>'+
      '<radialGradient id="pt'+h+'" cx="50%" cy="18%">'+
        '<stop offset="0" stop-color="hsl('+h+' 100% 96%)"/>'+
        '<stop offset=".45" stop-color="hsl('+h+' 92% 72%)"/>'+
        '<stop offset="1" stop-color="hsl('+h+' 78% 52%)"/></radialGradient>'+
      '<radialGradient id="ct'+h+'" cx="36%" cy="30%">'+
        '<stop offset="0" stop-color="#fff6c9"/><stop offset=".55" stop-color="#f2c53d"/>'+
        '<stop offset="1" stop-color="#b8801a"/></radialGradient>'+
      '<linearGradient id="sk'+h+'" x1="0" y1="0" x2="0" y2="1">'+
        '<stop offset="0" stop-color="#dff1ff"/><stop offset="1" stop-color="#aad6f0"/></linearGradient>'+
      '<linearGradient id="lf'+h+'" x1="0" y1="0" x2="1" y2="1">'+
        '<stop offset="0" stop-color="#8fd45c"/><stop offset="1" stop-color="#3f8a21"/></linearGradient>'+
    '</defs>'+
    '<rect width="64" height="64" rx="6" fill="url(#sk'+h+')"/>'+
    '<path d="M32 44v18" stroke="#3f8a21" stroke-width="3.4" stroke-linecap="round"/>'+
    '<path d="M32 52c-7-1-11-5-12-10 6-1 11 3 12 10z" fill="url(#lf'+h+')" stroke="#2f6b18" stroke-width=".8"/>'+
    '<path d="M32 58c6-1 10-4 11-9-5-1-10 2-11 9z" fill="url(#lf'+h+')" stroke="#2f6b18" stroke-width=".8"/>'+
    petals+
    '<circle cx="32" cy="32" r="8.5" fill="url(#ct'+h+')" stroke="#9a6a12" stroke-width="1"/>'+
    '<g fill="#a5741a" opacity=".65"><circle cx="29" cy="30" r="1.1"/><circle cx="34" cy="30" r="1.1"/>'+
    '<circle cx="31.5" cy="34" r="1.1"/><circle cx="35" cy="34.5" r="1"/><circle cx="28" cy="34" r="1"/></g>'+
    '<ellipse cx="27" cy="26" rx="6" ry="3.4" fill="#fff" opacity=".45"/>'+
    '<ellipse cx="20" cy="14" rx="17" ry="8" fill="#fff" opacity=".25"/></svg>';
}

/* shared analog clock face */
function analogFace(size){
  const d = new Date(), s = d.getSeconds(), m = d.getMinutes(), h = d.getHours()%12;
  const R = size/2, hand = (ang, len, wid, col, cap)=>{
    const a = (ang-90)*Math.PI/180;
    return '<line x1="'+R+'" y1="'+R+'" x2="'+(R+Math.cos(a)*len)+'" y2="'+(R+Math.sin(a)*len)+
      '" stroke="'+col+'" stroke-width="'+wid+'" stroke-linecap="'+(cap||'round')+'"/>';
  };
  let ticks='';
  for(let i=0;i<60;i++){

      '<div class="statusbar" data-r="st">Ready</div>';
    const R=k=>w.body.querySelector('[data-r='+k+']');
    const raw = {}; // A1 -> string
    let cur = 'A1';
    const seed = {
      A1:'Q3 Budget', A3:'Category', B3:'Planned', C3:'Actual', D3:'Difference',
      A4:'Materials', B4:'12400', C4:'11900', D4:'=B4-C4',
      A5:'Travel',    B5:'3200',  C5:'3490',  D5:'=B5-C5',
      A6:'Software',  B6:'1850',  C6:'1850',  D6:'=B6-C6',
      A7:'Printing',  B7:'640',   C7:'712',   D7:'=B7-C7',
      A8:'Total',     B8:'=SUM(B4:B7)', C8:'=SUM(C4:C7)', D8:'=B8-C8',
      A10:'Variance', B10:'=D8/B8'
    };
    if(!arg || arg.name) Object.assign(raw, seed);

    let head='<tr><th class="rh"></th>';
    for(let c=0;c<COLS;c++) head+='<th>'+cl(c)+'</th>';
    head+='</tr>';
    let rows='';
    for(let r=1;r<=ROWS;r++){
      rows+='<tr><td class="rh">'+r+'</td>';
      for(let c=0;c<COLS;c++){ const id=cl(c)+r; rows+='<td data-id="'+id+'"><div contenteditable="true" spellcheck="false"></div></td>'; }
      rows+='</tr>';
    }
    R('tb').innerHTML = head+rows;

    function val(id, seen){
      seen = seen || {};
      if(seen[id]) return 0;
      seen[id]=1;
      const s = raw[id];
      if(s===undefined||s==='') return '';
      if(s[0]!=='=') return isNaN(parseFloat(s))||!/^-?[\d.,]+$/.test(s) ? s : parseFloat(s.replace(/,/g,''));
      try{
        let f = s.slice(1).toUpperCase();
        f = f.replace(/SUM\(([A-H])(\d+):([A-H])(\d+)\)/g, (m,c1,r1,c2,r2)=>{
          let t=0;
          for(let c=c1.charCodeAt(0); c<=c2.charCodeAt(0); c++)
            for(let r=+r1; r<=+r2; r++){ const v=val(String.fromCharCode(c)+r, Object.assign({},seen)); if(typeof v==='number') t+=v; }
          return t;
        });
        f = f.replace(/AVG\(([A-H])(\d+):([A-H])(\d+)\)/g, (m,c1,r1,c2,r2)=>{
          let t=0,n=0;
          for(let c=c1.charCodeAt(0); c<=c2.charCodeAt(0); c++)
            for(let r=+r1; r<=+r2; r++){ const v=val(String.fromCharCode(c)+r, Object.assign({},seen)); if(typeof v==='number'){t+=v;n++} }
          return n?t/n:0;
        });
        f = f.replace(/\b([A-H])(\d{1,2})\b/g, (m,c,r)=>{ const v=val(c+r, Object.assign({},seen)); return typeof v==='number'?v:0; });
        if(/[^0-9+\-*/(). ]/.test(f)) return '#NAME?';
        const out = Function('"use strict";return ('+f+')')();
        return (typeof out==='number' && isFinite(out)) ? Math.round(out*1e6)/1e6 : '#ERR';
      }catch(e){ return '#ERR'; }
    }
    function render(){
      R('tb').querySelectorAll('td[data-id]').forEach(td=>{
        const id=td.dataset.id, v=val(id), d=td.firstElementChild;
        if(document.activeElement!==d) d.textContent = (typeof v==='number')
          ? (td.dataset.cur? '$'+v.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}) : v.toLocaleString())
          : v;
        td.classList.toggle('num', typeof v==='number');
        td.classList.toggle('cur', id===cur);
      });
      R('ref').textContent = cur;
      R('fx').value = raw[cur]||'';
      const v=val(cur);
      R('st').textContent = 'Cell '+cur+(typeof v==='number'?'  \u2014  value '+v:'');
    }
    R('tb').addEventListener('pointerdown', e=>{
      const td=e.target.closest('td[data-id]'); if(td){ cur=td.dataset.id; render(); }
    });
    R('tb').addEventListener('focusin', e=>{
      const td=e.target.closest('td[data-id]'); if(td){ cur=td.dataset.id; e.target.textContent = raw[cur]||''; render(); }
    });
    R('tb').addEventListener('focusout', e=>{
      const td=e.target.closest('td[data-id]'); if(td){ raw[td.dataset.id]=e.target.textContent.trim(); render(); }
    });
    R('tb').addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); e.target.blur(); } });
    R('fx').onkeydown=e=>{ if(e.key==='Enter'){ raw[cur]=R('fx').value.trim(); render(); } };
    R('sum').onclick=()=>{
      const c=cur[0], r=+cur.slice(1);
      raw[cur] = r>1 ? '=SUM('+c+'1:'+c+(r-1)+')' : '=SUM(A1:A1)';
      render();
    };
    R('bold').onclick=()=>{ const td=R('tb').querySelector('[data-id="'+cur+'"]');
      td.firstElementChild.style.fontWeight = td.firstElementChild.style.fontWeight==='700'?'':'700'; };
    R('cur').onclick=()=>{ const td=R('tb').querySelector('[data-id="'+cur+'"]');
      if(td.dataset.cur) delete td.dataset.cur; else td.dataset.cur='1'; render(); };
    R('clr').onclick=()=>{ delete raw[cur]; render(); };
    setTitle(w, (arg&&arg.name || 'Book1.sheet')+' \u2014 Sheets');
    render();
  }
};

      if(f.lowres){

        const img = cx.getImageData(0,0,c.width,c.height), d = img.data;

const SUITS = [['\u2660','black'],['\u2665','red'],['\u2666','red'],['\u2663','black']];

    let draw3=false, moves=0, started=0, undo=[], winTimer=null;

    const snapshot = ()=>JSON.stringify({stock,waste,found,cols,moves});
    const restore = j=>{ const o=JSON.parse(j); stock=o.stock; waste=o.waste; found=o.found; cols=o.cols; moves=o.moves; };
    const val = c => RANKS.indexOf(c.r)+1;
    const colour = c => SUITS[c.s][1];

    function deal(){
      if(winTimer){ clearInterval(winTimer); winTimer=null; }
      const deck=[];
      for(let s=0;s<4;s++) for(let r=0;r<13;r++) deck.push({s, r:RANKS[r], up:false});
      for(let i=deck.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [deck[i],deck[j]]=[deck[j],deck[i]]; }
      cols=[[],[],[],[],[],[],[]]; found=[[],[],[],[]]; waste=[];
      for(let i=0;i<7;i++) for(let k=0;k<=i;k++){ const c=deck.pop(); c.up = k===i; cols[i].push(c); }

      render();
    }
    function cardHTML(c, x, y, cls){

      h += '<div class="slot" style="left:'+(12+GX)+'px;top:10px"></div>';
      for(let f=0;f<4;f++) h += '<div class="slot" style="left:'+(12+GX*(3+f))+'px;top:10px">'+
        '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;'+
        'font-size:30px;color:rgba(255,255,255,.25)">'+SUITS[f][0]+'</div></div>';
      for(let i=0;i<7;i++) h += '<div class="slot" style="left:'+(12+GX*i)+'px;top:118px"></div>';
      if(stock.length) h += '<div class="card back" data-stock="1" style="left:12px;top:10px"></div>';
      const shown = draw3 ? waste.slice(-3) : waste.slice(-1);
      shown.forEach((c,k)=>{
        const last = k===shown.length-1;
        h += cardHTML(c, 12+GX+k*16, 10, last?'':' ').replace('class="card',
          'data-waste="'+(last?'1':'0')+'" class="card');
      });
      found.forEach((f,i)=>{ if(f.length) h += cardHTML(f[f.length-1], 12+GX*(3+i), 10).replace('class="card','data-found="'+i+'" class="card'); });
      cols.forEach((col,i)=>{
        let y = 118;
        col.forEach((c,k)=>{
          h += cardHTML(c, 12+GX*i, y).replace('class="card','data-col="'+i+'" data-idx="'+k+'" class="card');
          y += c.up ? FAN_UP : FAN_DN;
        });
      });
      tbl.innerHTML = h;
      const secs = started? Math.floor((Date.now()-started)/1000) : 0;
      R('score').textContent = 'Moves: '+moves+'   Time: '+Math.floor(secs/60)+':'+String(secs%60).padStart(2,'0')+
        '   Stock: '+stock.length;
      bind();
      if(found.every(f=>f.length===13)) win();
    }
    function push(){ undo.push(snapshot()); if(undo.length>40) undo.shift(); }
    function canStack(c, onto){ return onto ? (colour(c)!==colour(onto) && val(c)===val(onto)-1) : c.r==='K'; }
    function canFound(c, f){
      const top = found[f][found[f].length-1];
      if(!top) return c.r==='A' && c.s===f;
      return c.s===f && val(c)===val(top)+1;
    }
    function autoFound(c, from){
      for(let f=0;f<4;f++) if(canFound(c,f)){
        push(); found[f].push(c); from(); moves++; flip(); render(); return true;
      }
      return false;
    }
    function flip(){ cols.forEach(col=>{ const t=col[col.length-1]; if(t && !t.up) t.up=true; }); }
    function bind(){
      const st = tbl.querySelector('[data-stock]');
      if(st) st.onclick = ()=>{
        push();
        const n = draw3?3:1;
        for(let i=0;i<n && stock.length;i++){ const c=stock.pop(); c.up=true; waste.push(c); }
        moves++; render();
      };
      if(!stock.length){
        const slot = tbl.querySelector('.slot');
        slot.onclick = ()=>{ if(waste.length){ push(); stock = waste.reverse().map(c=>({...c,up:false})); waste=[]; moves++; render(); } };
      }
      tbl.querySelectorAll('[data-waste="1"]').forEach(el=>{
        el.ondblclick = ()=>autoFound(waste[waste.length-1], ()=>waste.pop());
        drag(el, ()=>[waste[waste.length-1]], ()=>waste.pop());
      });
      tbl.querySelectorAll('[data-found]').forEach(el=>{
        const f = +el.dataset.found;
        drag(el, ()=>[found[f][found[f].length-1]], ()=>found[f].pop());
      });
      tbl.querySelectorAll('[data-col]').forEach(el=>{
        const i = +el.dataset.col, k = +el.dataset.idx;
        if(!cols[i][k].up) return;
        el.ondblclick = ()=>{ if(k===cols[i].length-1) autoFound(cols[i][k], ()=>cols[i].pop()); };
        drag(el, ()=>cols[i].slice(k), ()=>{ cols[i] = cols[i].slice(0,k); });
      });
    }
    function drag(el, take, remove){
      el.addEventListener('pointerdown', e=>{
        e.preventDefault();
        const pile = take().filter(Boolean);
        if(!pile.length) return;
        const box = tbl.getBoundingClientRect();
        const layer = document.createElement('div');
        layer.style.cssText = 'position:absolute;z-index:60;pointer-events:none';
        layer.innerHTML = pile.map((c,k)=>cardHTML(c,0,k*FAN_UP)).join('');
        tbl.appendChild(layer);
        const r = el.getBoundingClientRect();
        const ox = e.clientX-r.left, oy = e.clientY-r.top;
        const place = ev=>{
          layer.style.left = (ev.clientX-box.left-ox)+'px';
          layer.style.top  = (ev.clientY-box.top-oy)+'px';
        };
        place(e);
        el.style.visibility='hidden';
        const move = ev=>place(ev);
        const up = ev=>{
          window.removeEventListener('pointermove',move);
          window.removeEventListener('pointerup',up);
          layer.remove();
          const x = ev.clientX-box.left, y = ev.clientY-box.top;
          let done = false;
          if(y < 108 && pile.length===1){
            for(let f=0;f<4;f++){
              const fx = 12+GX*(3+f);
              if(x>fx-14 && x<fx+CW+14 && canFound(pile[0], f)){ push(); remove(); found[f].push(pile[0]); done=true; break; }
            }
          }
          if(!done){
            for(let i=0;i<7;i++){
              const cx = 12+GX*i;
              if(x>cx-14 && x<cx+CW+14 && y>100){
                const top = cols[i][cols[i].length-1];
                if((top && top.up && canStack(pile[0], top)) || (!cols[i].length && pile[0].r==='K')){
                  push(); remove(); cols[i] = cols[i].concat(pile); done=true; break;
                }
              }
            }
          }
          if(done){ moves++; flip(); }
          render();
        };
        window.addEventListener('pointermove',move);
        window.addEventListener('pointerup',up);
      });
    }
    function win(){
      if(winTimer) return;
      const secs = Math.floor((Date.now()-started)/1000);
      const best = Math.min((CURRENT && CURRENT.solBest) || 9999, secs);
      if(CURRENT){ CURRENT.solBest = best; saveProfiles(); }
      const cv = document.createElement('canvas');
      cv.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;z-index:30';
      tbl.appendChild(cv);
      cv.width = tbl.clientWidth; cv.height = tbl.clientHeight;
      const cx = cv.getContext('2d');
      const flying = [];
      let f = 3;
      winTimer = setInterval(()=>{
        if(found[f] && found[f].length){
          const c = found[f].pop();
          flying.push({c, x:12+GX*(3+f), y:10, vx:(Math.random()*7-3.5)||2, vy:-Math.random()*4});
        }
        f = (f+3)%4;
        flying.forEach(o=>{
          o.vy += .45; o.x += o.vx; o.y += o.vy;
          if(o.y > cv.height-CH){ o.y = cv.height-CH; o.vy *= -.72; }
          const [sym,col] = SUITS[o.c.s];
          cx.fillStyle = '#fff';
          cx.strokeStyle = '#7b8b99';
          cx.beginPath();
          if(cx.roundRect) cx.roundRect(o.x, o.y, CW, CH, 5); else cx.rect(o.x, o.y, CW, CH);
          cx.fill(); cx.stroke();
          cx.fillStyle = col==='red' ? '#c0392b' : '#12222f';
          cx.font = 'bold 13px Segoe UI, Tahoma';
          cx.fillText(o.c.r, o.x+5, o.y+16);
          cx.font = '26px Segoe UI, Tahoma';
          cx.fillText(sym, o.x+CW/2-9, o.y+CH/2+9);
        });
        if(flying.length > 26) flying.shift();
        if(!found.some(x=>x.length) && flying.every(o=>o.x < -80 || o.x > cv.width+80)){
          clearInterval(winTimer); winTimer=null;
        }
      }, 45);
      const box = document.createElement('div');
      box.className = 'sol-win';
      box.innerHTML = '<h2 style="margin:0;font-weight:300;font-size:26px">You win</h2>'+
        '<div>'+moves+' moves in '+Math.floor(secs/60)+':'+String(secs%60).padStart(2,'0')+
        ' \u2014 best '+Math.floor(best/60)+':'+String(best%60).padStart(2,'0')+'</div>'+
        '<button class="tbtn" data-again>Deal again</button>';
      setTimeout(()=>{
        tbl.appendChild(box);
        box.querySelector('[data-again]').onclick=()=>{ cv.remove(); box.remove(); deal(); };
      }, 2600);
    }
    R('new').onclick=deal;
    R('undo').onclick=()=>{ if(undo.length){ restore(undo.pop()); render(); } };
    R('draw').onclick=()=>{ draw3=!draw3; R('draw').textContent = draw3?'Draw one':'Draw three'; deal(); };
    const tick = setInterval(()=>{ if(started && !winTimer) render(); }, 1000);
    w.onClose = ()=>{ clearInterval(tick); if(winTimer) clearInterval(winTimer); };
    deal();
  }
};

/* ----------------------------- MINESWEEPER ----------------------------- */
const MS_LEVELS = {beginner:[9,9,10], intermediate:[16,16,40], expert:[30,16,99]};
APPS.mines = {
  title:"Minesweeper", icon:"mine", w:420, h:460,
  init(w){
    let level='beginner', W=9, H=9, M=10, grid=[], open=[], flag=[], started=false, dead=false, won=false, t=0, iv=null;
    w.body.innerHTML =
      '<div class="menubar"><b data-r="mGame">Game</b><b>Help</b></div>'+
      '<div class="ms-wrap">'+
        '<div class="ms-panel"><span class="ms-seg" data-r="mines">010</span>'+
        '<button class="ms-face" data-r="face">\uD83D\uDE42</button>'+
        '<span class="ms-seg" data-r="time">000</span></div>'+
        '<div class="ms-grid" data-r="grid"></div>'+
        '<div style="font-size:11px;color:#333" data-r="hint">Left click to open, right click to flag</div>'+
      '</div>';
    const R=k=>w.body.querySelector('[data-r='+k+']');
    const seg = n => String(Math.max(-99,Math.min(999,n))).padStart(3,'0');
    const idx = (x,y)=>y*W+x;
    const inb = (x,y)=>x>=0&&y>=0&&x<W&&y<H;
    function face(f){ R('face').textContent = f; }
    function setLevel(l){
      level=l; [W,H,M]=MS_LEVELS[l];
      w.el.style.width = Math.max(300, W*20+70)+'px';
      w.el.style.height = (H*20+180)+'px';
      reset();
    }
    function reset(){
      clearInterval(iv); iv=null; t=0; started=false; dead=false; won=false;
      grid = Array(W*H).fill(0); open = Array(W*H).fill(false); flag = Array(W*H).fill(false);
      face('\uD83D\uDE42');
      R('time').textContent = seg(0);
      R('mines').textContent = seg(M);
      paint();
    }
    function plant(safe){
      let placed = 0;
      while(placed < M){
        const k = Math.floor(Math.random()*W*H);
        if(grid[k]===-1 || k===safe) continue;
        const sx = safe%W, sy = Math.floor(safe/W), x = k%W, y = Math.floor(k/W);
        if(Math.abs(sx-x)<=1 && Math.abs(sy-y)<=1) continue;
        grid[k] = -1; placed++;
      }
      for(let y=0;y<H;y++) for(let x=0;x<W;x++){
        if(grid[idx(x,y)]===-1) continue;
        let n=0;
        for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++)
          if(inb(x+dx,y+dy) && grid[idx(x+dx,y+dy)]===-1) n++;
        grid[idx(x,y)] = n;
      }
    }
    function paint(){
      R('grid').style.gridTemplateColumns = 'repeat('+W+',20px)';
      R('grid').innerHTML = Array.from({length:W*H},(_,k)=>{
        const o = open[k], g = grid[k];
        let cls = 'ms-c', txt = '';
        if(o){
          cls += ' open';
          if(g===-1){ cls += dead?' boom':''; txt='\uD83D\uDCA3'; }
          else if(g>0){ cls += ' n'+g; txt = g; }
        }else if(flag[k]) txt = '\uD83D\uDEA9';
        else if(dead && g===-1) { }
        return '<div class="'+cls+'" data-k="'+k+'">'+txt+'</div>';
      }).join('');
      R('grid').querySelectorAll('[data-k]').forEach(el=>{
        const k = +el.dataset.k;
        el.onmousedown = e=>{ if(!dead && !won && e.button===0) face('\uD83D\uDE2E'); };
        el.onclick = ()=>reveal(k);
        el.oncontextmenu = e=>{ e.preventDefault(); mark(k); };
        el.ondblclick = ()=>chord(k);
      });
      R('mines').textContent = seg(M - flag.filter(Boolean).length);
    }
    function begin(k){
      if(started) return;
      started = true; plant(k);
      iv = setInterval(()=>{ t++; R('time').textContent = seg(t); }, 1000);
    }
    function reveal(k){
      if(dead||won||open[k]||flag[k]) return;
      begin(k);
      face('\uD83D\uDE42');
      if(grid[k]===-1){ boom(k); return; }
      const st=[k];
      while(st.length){
        const c = st.pop();
        if(open[c]||flag[c]) continue;
        open[c]=true;
        if(grid[c]===0){
          const x=c%W, y=Math.floor(c/W);
          for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++)
            if(inb(x+dx,y+dy)) st.push(idx(x+dx,y+dy));
        }
      }
      paint(); check();
    }
    function chord(k){
      if(!open[k] || grid[k]<=0) return;
      const x=k%W, y=Math.floor(k/W);
      let f=0, hidden=[];
      for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){
        if(!inb(x+dx,y+dy)) continue;
        const c = idx(x+dx,y+dy);
        if(flag[c]) f++; else if(!open[c]) hidden.push(c);
      }
      if(f===grid[k]) hidden.forEach(reveal);
    }
    function mark(k){
      if(dead||won||open[k]) return;
      flag[k] = !flag[k]; paint();
    }
    function boom(k){
      dead = true; clearInterval(iv);
      open = open.map((o,i)=>o || grid[i]===-1);
      face('\uD83D\uDE35'); beep('error');
      paint();
      R('hint').textContent = 'Boom. Click the face for a new game.';
    }
    function check(){
      const hidden = open.filter(o=>!o).length;
      if(hidden === M){
        won = true; clearInterval(iv);
        face('\uD83D\uDE0E');
        const key = 'ms'+level;
        const best = Math.min((CURRENT && CURRENT[key]) || 999, t);
        if(CURRENT){ CURRENT[key] = best; saveProfiles(); }
        R('hint').textContent = 'Cleared in '+t+' seconds \u2014 best for '+level+' is '+best+'.';
      }
    }
    R('face').onclick = reset;
    R('mGame').onclick = e=>ctx(e.clientX, e.clientY, Object.keys(MS_LEVELS).map(l=>({
      label: l[0].toUpperCase()+l.slice(1)+' ('+MS_LEVELS[l][0]+'\u00d7'+MS_LEVELS[l][1]+', '+MS_LEVELS[l][2]+' mines)',
      run:()=>setLevel(l)
    })).concat([{label:'Best times', run:()=>notify('Minesweeper',
      Object.keys(MS_LEVELS).map(l=>l+': '+((CURRENT&&CURRENT['ms'+l])||'\u2014')).join('   '))}]));
    w.onClose = ()=>clearInterval(iv);
    setLevel('beginner');
  }
};

/* ----------------------------- CALCULATOR ----------------------------- */
APPS.calc = {
  title:"Calculator", icon:"calc", w:268, h:340,
  init(w){
    let acc = null, op = null, cur = '0', fresh = true, mem = 0, sci = false, deg = true;
    w.body.innerHTML =
      '<div class="menubar"><b data-r="mView">View</b><b>Edit</b><b>Help</b></div>'+
      '<div class="cl-disp"><div class="cl-mem" data-r="mem"></div><div data-r="d">0</div></div>'+
      '<div class="cl-pad" data-r="pad"></div>';
    const R=k=>w.body.querySelector('[data-r='+k+']');
    const show = ()=>{
      R('d').textContent = cur.length>16 ? (+cur).toExponential(9) : cur;
      R('mem').textContent = (mem?'M  ':'')+(sci? (deg?'DEG':'RAD') : '');
    };
    const digits = ['7','8','9','4','5','6','1','2','3'];
    function pad(){
      const std =
        [['MC','m'],['MR','m'],['MS','m'],['M+','m'],
         ['\u2190','fn'],['CE','fn'],['C','fn'],['\u00b1','fn'],
         ['7',''],['8',''],['9',''],['\u00f7','op'],
         ['4',''],['5',''],['6',''],['\u00d7','op'],
         ['1',''],['2',''],['3',''],['\u2212','op'],
         ['0',''],['.',''],['=','eq'],['+','op']];
      const scin =
        [['sin','fn'],['cos','fn'],['tan','fn'],['deg','fn'],
         ['ln','fn'],['log','fn'],['n!','fn'],['\u03c0','fn'],
         ['x\u00b2','fn'],['\u221a','fn'],['1/x','fn'],['x^y','op']];
      const keys = sci ? scin.concat(std) : std;
      R('pad').style.gridTemplateColumns = 'repeat(4,1fr)';
      R('pad').innerHTML = keys.map(k=>'<button class="'+k[1]+'" data-k="'+esc(k[0])+'">'+k[0]+'</button>').join('');
      R('pad').querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>press(b.dataset.k));
    }
    const fact = n=>{ if(n<0||n>170||n%1) return NaN; let r=1; for(let i=2;i<=n;i++) r*=i; return r; };
    function apply(){
      const b = parseFloat(cur), a = acc;
      let r = b;
      if(op==='+') r = a+b;
      else if(op==='\u2212') r = a-b;
      else if(op==='\u00d7') r = a*b;
      else if(op==='\u00f7') r = b===0 ? NaN : a/b;
      else if(op==='x^y') r = Math.pow(a,b);
      return r;
    }
    function press(k){
      const num = parseFloat(cur);
      if(/^[0-9]$/.test(k)){ cur = (fresh||cur==='0') ? k : cur+k; fresh=false; }
      else if(k==='.'){ if(fresh){cur='0.';fresh=false;} else if(!cur.includes('.')) cur+='.'; }
      else if(k==='C'){ acc=null; op=null; cur='0'; fresh=true; }
      else if(k==='CE'){ cur='0'; fresh=true; }
      else if(k==='\u2190'){ cur = cur.length>1 ? cur.slice(0,-1) : '0'; }
      else if(k==='\u00b1'){ cur = cur.startsWith('-') ? cur.slice(1) : (cur==='0'?cur:'-'+cur); }
      else if(k==='MC'){ mem=0; }
      else if(k==='MR'){ cur=String(mem); fresh=true; }
      else if(k==='MS'){ mem=num; }
      else if(k==='M+'){ mem+=num; }
      else if(k==='deg'){ deg=!deg; }
      else if(['+','\u2212','\u00d7','\u00f7','x^y'].includes(k)){
        if(op!==null && !fresh){ const r=apply(); acc=r; cur=String(r); }
        else acc = num;
        op = k; fresh = true;
      }
      else if(k==='='){
        if(op!==null){ const r = apply(); cur = String(r); acc=null; op=null; fresh=true; }
      }
      else {
        const rad = deg ? num*Math.PI/180 : num;
        let r = num;
        if(k==='sin') r=Math.sin(rad); else if(k==='cos') r=Math.cos(rad); else if(k==='tan') r=Math.tan(rad);
        else if(k==='ln') r=Math.log(num); else if(k==='log') r=Math.log10(num);
        else if(k==='x\u00b2') r=num*num; else if(k==='\u221a') r=Math.sqrt(num);
        else if(k==='1/x') r = num===0?NaN:1/num;
        else if(k==='n!') r=fact(num);
        else if(k==='\u03c0') r=Math.PI;
        cur = String(Math.round(r*1e12)/1e12);
        fresh = true;
      }
      if(cur==='NaN'||cur==='Infinity'||cur==='-Infinity'){ cur='Cannot divide by zero'; beep('error'); fresh=true; }
      show();
    }
    R('mView').onclick=()=>{
      sci = !sci;
      w.el.style.width = sci? '330px':'268px';
      w.el.style.height = sci? '430px':'340px';
      setTitle(w, sci? 'Calculator \u2014 Scientific' : 'Calculator');
      pad(); show();
    };
    w.body.addEventListener('keydown', e=>{
      const m = {'/':'\u00f7','*':'\u00d7','-':'\u2212','+':'+','Enter':'=','=':'=','Escape':'C','Backspace':'\u2190'};
      if(/^[0-9.]$/.test(e.key)) press(e.key);
      else if(m[e.key]) press(m[e.key]);
      else return;
      e.preventDefault();
    });
    w.body.tabIndex = 0;
    setTimeout(()=>w.body.focus(), 60);
    pad(); show();
  }
};

          out(fmtDate(e.mod).padEnd(20)+(e.type==='dir'||e.type==='sys'?'   <DIR>       ':String(sizeOf(e)).padStart(12)+'  ')+n);
        });
        const files = names.filter(n=>FS[p][n].type!=='dir');
        out('\n'+String(files.length).padStart(15)+' File(s)');
        out(String(names.length-files.length).padStart(15)+' Dir(s)\n');
      },
      cd(a){
        if(!a) return out(cwd);
        const p = resolve(a);
        if(FS[p]) { cwd = p; prompt(); }
        else out('The system cannot find the path specified.');
      },
      md(a){
        if(!a) return out('The syntax of the command is incorrect.');
        const n = uniqueName(cwd, a);
        FS[cwd][n] = {type:'dir', mod:NOW()}; ensureDir(joinPath(cwd,n));
        persistCmd(); out('');
      },
      rd(a){
        if(!a || !FS[cwd][a]) return out('The system cannot find the file specified.');
        recycle(cwd, a); persistCmd(); out('');
      },
      del(a){
        if(!a || !FS[cwd][a]) return out('Could not find '+joinPath(cwd, a||''));
        recycle(cwd, a); persistCmd(); out('        1 file(s) moved to the Recycle Bin.');
      },
      type(a){
        const e = a && FS[cwd][a];
        if(!e) return out('The system cannot find the file specified.');
        if(e.type!=='text') return out('Access denied - this is not a text file.');
        out(e.body || '');
      },
      copy(a){
        const [x,y] = (a||'').split(/\s+/);
        if(!x || !FS[cwd][x]) return out('The system cannot find the file specified.');
        const dst = y ? resolve(y) : cwd;
        if(!FS[dst]) return out('The system cannot find the path specified.');
        copyEntry(cwd, x, dst); persistCmd(); out('        1 file(s) copied.');
      },
      move(a){
        const [x,y] = (a||'').split(/\s+/);
        if(!x || !FS[cwd][x]) return out('The system cannot find the file specified.');
        const dst = resolve(y);
        if(!FS[dst]) return out('The system cannot find the path specified.');
        moveEntry(cwd, x, dst); persistCmd(); out('        1 file(s) moved.');
      },
      ren(a){
        const [x,y] = (a||'').split(/\s+/);
        if(!x||!y||!FS[cwd][x]) return out('The system cannot find the file specified.');
        renameEntry(cwd, x, y); persistCmd(); out('');
      },
      tree(){
        out('\nFolder PATH listing for '+cwd);
        (function walk(p, pre){
          const dirs = Object.keys(FS[p]||{}).filter(n=>FS[p][n].type==='dir');
          dirs.forEach((n,k)=>{
            const last = k===dirs.length-1;
            out(pre+(last?'\\---':'+---')+n);
            walk(joinPath(p,n), pre+(last?'    ':'|   '));
          });
        })(cwd, '');
        out('');
      },
      start(a){
        const k = (a||'').toLowerCase();
        if(RUN_MAP[k]){ openApp(RUN_MAP[k]); out(''); }
        else if(FS[cwd][a]){ openFile(cwd, a); out(''); }
        else out("'"+a+"' is not recognized as a program.");
      },
      exit(){ closeWin(w); }
    };
    CMDS.chdir = CMDS.cd; CMDS.mkdir = CMDS.md; CMDS.rmdir = CMDS.rd;
    CMDS.erase = CMDS.del; CMDS.rename = CMDS.ren;
    function persistCmd(){ if(CURRENT){ CURRENT.tree = userTree(); saveProfiles(); } renderDesktop(); }
    function run(line){
      out(cwd+'>'+line);
      const t = line.trim();
      if(!t) return;
      hist.push(t); hi = hist.length;
      const sp = t.indexOf(' ');
      const cmd = (sp<0? t : t.slice(0,sp)).toLowerCase();
      const rest = sp<0? '' : t.slice(sp+1).trim();
      if(CMDS[cmd]) CMDS[cmd](rest);
      else { beep('error'); out("'"+cmd+"' is not recognized as an internal or external command,\noperable program or batch file."); }
    }
    R('in').onkeydown = e=>{
      if(e.key==='Enter'){ const v=R('in').value; R('in').value=''; run(v); }
      else if(e.key==='ArrowUp'){ if(hi>0){ hi--; R('in').value = hist[hi]||''; } e.preventDefault(); }
      else if(e.key==='ArrowDown'){ if(hi<hist.length-1){ hi++; R('in').value = hist[hi]||''; } else { hi=hist.length; R('in').value=''; } e.preventDefault(); }
    };
    w.body.onclick = ()=>R('in').focus();
    out('LaptopOS [Version 1.6.6120]');
    out('Copyright (c) 2007 Meridian Systems.  Type HELP for a list of commands.\n');
    prompt();
    setTimeout(()=>R('in').focus(), 80);
  }
};
